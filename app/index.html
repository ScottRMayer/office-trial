    async function saveBooking() {
      var btn = $("bkGo");
      btn.disabled = true;
      var booked = false;
      try {
        if (!chosen) throw new Error("Pick who it is for first.");
        var picked = Array.prototype.slice.call($("bksvc").querySelectorAll("input:checked"));
        if (!picked.length) throw new Error("Tick at least one thing they are having done.");
        var date = $("bkdate").value;
        if (!date) throw new Error("Which day?");
        var days = Number($("bkdays").value) || 1;
        var slots = Number($("bkslots").value) || 1;
        var win = $("bkwin").value;
         
        if (slots > 5 && win !== "am")
          throw new Error("Anything longer than one window has to start in the morning.");
        var hour = null;
        if ($("bkhour").value.trim()) {
          var hm = $("bkhour").value.trim().toLowerCase().match(/^(\d{1,2})/);
          if (hm) {
            hour = Number(hm[1]);
            if (/pm/.test($("bkhour").value.toLowerCase()) && hour < 12) hour += 12;
            if (hour < 7 || hour > 16)
              throw new Error("An exact time has to be between 7am and 4pm — or leave it empty.");
          }
        }
        var props = propsOf(chosen);
        var propId = $("bkprop") ? $("bkprop").value : ((props[0] || {}).id || null);

        var body = {
          customer_id: chosen, property_id: propId,
          type: $("bktype").value, status: "scheduled",
          scheduled_date: date, scheduled_window: win,
          scheduled_hour: hour, slots: slots,
          end_date: days > 1 ? shiftISO(date, days - 1) : null,
          assigned_to: $("bkwho").value || null,
          notes: $("bknote").value.trim() || null,
          created_by: S.me.id
        };
        var r = await sb.from("jobs").insert(body).select();
        if (r.error) throw explain(r.error);
        var job = (r.data || [])[0];
        if (!job) throw new Error("The job didn’t save.");
        booked = true;

var linkWarn = "";
        if (pre.quote_id) {
          var qu = await sb.from("quotes").update({ job_id: job.id })
            .eq("id", pre.quote_id).select();
          if (qu.error || !(qu.data || []).length)
            linkWarn = " — but the estimate link didn’t save, so it may still show as not in the book";
          else S.quotes = await many(sb.from("quotes").select("*").is("voided_at", null));
        }

var lines = picked.map(function (el, i) {
          return { job_id: job.id, service_id: el.value,
                   service_name: el.getAttribute("data-name"),
                   price: null, sort_order: i + 1 };
        });
        var lr = await sb.from("job_lines").insert(lines).select();
        if (lr.error) throw explain(lr.error);

        await reload(["jobs", "money", "attention"]);
        closeModal();
        var total = (lr.data || []).reduce(function (n, l) { return n + Number(l.price || 0); }, 0);
        var c = custById(chosen);
        toast("Booked — " + (c ? c.name : "") + " " + fmtDate(date) + " " +
              windowName(win).toLowerCase() +
              (total > 0 ? " · " + money(total) + " before tax" : " · to be priced") +
              (typeof linkWarn === "string" ? linkWarn : ""));
        route.date = date;
        if (route.name !== "schedule") go("schedule"); else render();
      } catch (e) {
        if (booked) {
          closeModal();
          toast("The job IS booked, but the services didn’t attach — open it and add them.");
          await reload(["jobs", "money"]); render();
          return;
        }
        toast(/slots|scheduled_window|end_date/.test(e.message)
          ? "Job size and windows need the latest bit of SQL run first."
          : e.message);
        btn.disabled = false;
      }
    }
  }

function changeEmailModal(userId) {
    var pp = personOf(userId);

    var me = userId === S.me.id;
    openModal("<h3>The address " + esc(pp.name) + " signs in with</h3>" +
      '<p class="note">Now: <b>' + esc(pp.email || "none on file") + "</b></p>" +
      '<label for="ceNew">The new address</label>' +

      'placeholder="' + esc(pp.email || "name@theirdomain.com") + '">' +
      '<p class="note">They keep the password they already have \u2014 this moves the ' +
      "address it belongs to, and nothing is emailed to them. The next password reset " +
      "or sign-in link goes to the new one." +
      (me ? " <b>This is your own sign-in. Get it right.</b>" : "") + "</p>" +
      '<div id="ceMsg"></div>' +
      '<div class="row"><button class="primary" id="ceGo" type="button">Move it</button>' +
      '<button class="act" id="ceNo" type="button">Leave it</button></div>');
    $("ceNo").addEventListener("click", closeModal);
    $("ceGo").addEventListener("click", async function () {
      var em = $("ceNew").value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) {
        $("ceMsg").innerHTML = '<div class="msg bad">That does not look like an email address.</div>';
        return;
      }
      this.disabled = true;
      $("ceMsg").innerHTML = '<div class="msg">Moving it\u2026</div>';
      try {
        var r = await sb.functions.invoke("change-email", {
          body: { user_id: userId, email: em }
        });
        if (r.error) {
           
          var said = "", code = 0, hint = "";
          try {
            var ctx = r.error.context;
            if (ctx && typeof ctx.json === "function") {
              code = ctx.status || 0;
              var b = await ctx.json();
              said = (b && (b.error || b.message)) || "";
               
              hint = [(b && b.also) || "", (b && b.hint) || ""].filter(function (x) {
                return x;
              }).join(" ");
            }
          } catch (ignore) {   }
          if (said && hint) said = said + " — " + hint;
          if (!said && code === 404)
            said = "The change-email function is not deployed yet \u2014 see " +
                   "supabase/functions/change-email.";
          if (!said && code === 401)
            said = "Supabase refused the sign-in token before the function saw it. " +
                   "This is the legacy JWT secret being on: turn it off in " +
                   "Project Settings \u2192 JWT Keys.";
          throw new Error(said || r.error.message || "It did not go through.");
        }
        var d = r.data || {};
        if (d.error) throw new Error(d.error);
        S.people = await many(sb.from("profiles")
          .select("id,name,email,role,is_technician,active,applicator_no,works_under"));
         
        if (me) {
          var mine = S.people.filter(function (x) { return x.id === S.me.id; })[0];
          if (mine) S.me = mine; else S.me.email = em;
        }
         
        if (d.warning) {
          $("ceMsg").innerHTML = '<div class="msg warn"><b>Moved, but not cleanly.</b><br>' +
            esc(d.warning) + "</div>";
          $("ceGo").textContent = "Close";
          $("ceGo").disabled = false;
          $("ceGo").onclick = function () { closeModal(); renderLists(); };
          return;
        }
        closeModal();
        renderLists();
        toast(me
          ? "Moved to " + em + ". Sign in with that from now on."
          : pp.name + " signs in with " + em + " from now on.");
      } catch (e) {
        $("ceMsg").innerHTML = '<div class="msg bad">' + esc(e.message) + "</div>";
        this.disabled = false;
      }
    });
    $("ceNew").focus();
  }

  async function savePayment(inv, ref, btn) {
    btn.disabled = true;
    var posted = false;
    try {
       
      var b = S.balances.filter(function (x) { return x.invoice_id === inv.id; })[0];
      if (!b) throw new Error("That invoice has moved — close this and open it again.");
      var method = $("pm").value, raw = $("amt").value, amt = readMoney(raw);
      if (amt == null) throw new Error('"' + raw + '" isn’t an amount — type it like 159.94');
      if (amt <= 0) throw new Error("Type how much they handed over.");
      if (amt > Number(b.balance) + 0.004) throw new Error("They only owe " + money(b.balance) + " on this one.");
      var ck = method === "check" ? $("ck").value.trim() : null;
      if (method === "check" && !ck) throw new Error("A check needs the number printed on it.");
       
      var txn = method === "card" && $("ptxn") ? $("ptxn").value.trim() : "";
      var collected = method === "to-be-mailed" ? false
                    : method === "card" ? txn !== ""
                    : true;
      var r = await sb.from("payments").insert({
        invoice_id: inv.id, job_id: inv.job_id, customer_id: inv.customer_id,
        method: method, amount_collected: amt, check_number: ck,
        processor: txn ? "authorize-net" : "manual",
        processor_txn_id: txn || null,
        collected: collected, recorded_by: S.me.id, client_ref: ref
      }).select();
      if (r.error) throw explain(r.error);
       
      posted = true;
      await reload(["money", "attention"]);
      closeModal(); render();
      toast(collected
        ? money(amt) + " recorded" +
          (amt < Number(b.balance) - 0.004 ? " — " + money(Number(b.balance) - amt) + " still owed" : "")
        : method === "card"
          ? "Card noted — not money yet. Complete it from this invoice once it’s run."
          : "Marked To Be Mailed — it stays on the list until the money arrives");
    } catch (e) {
      if (posted) {
        closeModal();
        toast("The payment IS recorded — the screen just couldn’t refresh. Reload to see it.");
        return;
      }
      var n = $("modal").querySelector(".note");
      if (n) n.outerHTML = '<div class="msg bad">' + esc(e.message) + "</div>"; else toast(e.message);
      btn.disabled = false;
    }
  }

    var NUM_FLD = { year_started: 1, month_box: 1 };
     
    function onRecord(table, key, col) {
      var row = table === "customers" ? custById(key)
        : S.properties.filter(function (x) { return x.id === key; })[0];
      var v = row ? row[col] : "";
      return v == null ? "" : String(v);
    }
    async function saveOne(el, table, key, col, raw) {
      var val = String(raw).trim();
      var patch = {};
      var refuse = function (why) {
        toast(why);
        el.value = onRecord(table, key, col);
        return false;
      };
      if (col === "name" && !val) return refuse("A last name is how the record is filed.");
       
      if (col === "address" && !val)
        return refuse("A street can\u2019t be left blank \u2014 type the new one over the old.");
      if (col === "year_started") {
        var y = val === "" ? null : parseYear(val);
        if (val !== "" && y == null) return refuse("A year like 2004 \u2014 that isn\u2019t one.");
        patch[col] = y;
      } else if (NUM_FLD[col]) {
         
        var n = val === "" ? null : Number(val);
        if (n != null && !isFinite(n)) return refuse("That needs to be a number.");
        patch[col] = n;
      } else patch[col] = val === "" ? null : val;
      el.disabled = true;
      try {
        var q = sb.from(table).update(patch);
        var r = await (table === "customers" ? q.eq("id", key) : q.eq("id", key)).select();
        if (r.error) throw explain(r.error);
        if (!(r.data || []).length) throw new Error("That didn\u2019t save \u2014 the database refused it.");
         
        var fresh = r.data[0];
        var into = table === "customers" ? S.customers : S.properties;
        for (var i = 0; i < into.length; i++)
          if (into[i].id === fresh.id) { into[i] = fresh; break; }
         
        if (table === "customers" && col === "address") {
          var pr = await many(sb.from("properties").select("*").eq("customer_id", key));
          pr.forEach(function (row) {
            for (var k = 0; k < S.properties.length; k++)
              if (S.properties[k].id === row.id) { S.properties[k] = row; break; }
          });
        }
        toast("Saved");
        return true;
      } catch (e) { toast(e.message); el.value = onRecord(table, key, col); return false; }
      finally { el.disabled = false; }
    }

app.querySelectorAll("[data-cfld]").forEach(function (el) {

            pt[col] = el.value.trim() || null;

    ["unreachable", "Nobody ever answers",       "set aside after three tries"]
  ];
  function inactiveModal(id) {
    var c = custById(id); if (!c) return;
    openModal("<h3>" + esc(c.name) + " — no longer a customer</h3>" +
      '<p class="note">Which is it? Nothing is deleted and the record stays ' +
      "searchable, so this can be undone from the same card.</p>" +
      '<div class="picklist" style="max-height:none">' +
      INACTIVE.map(function (o) {
        return '<button type="button" class="pickrow" data-why="' + o[0] + '"><span>' +
          esc(o[1]) + '</span><span class="pickamt">' + esc(o[2]) + "</span></button>";
      }).join("") + "</div>" +
      '<div class="row"><button class="act" id="inNo" type="button">Cancel</button></div>');
     
    $("inNo").addEventListener("click", function () { customerCard(id); });
    $("modal").querySelectorAll("[data-why]").forEach(function (b) {
      b.addEventListener("click", function () { markInactive(id, b.getAttribute("data-why")); });
    });
  }
   
  async function markInactive(id, why) {
    var c = custById(id);
    try {
      var r = await sb.from("customers").update({ inactive_reason: why || null })
        .eq("id", id).select();
      if (r.error) throw explain(r.error);
       
      if (!(r.data || []).length) throw new Error("That didn’t save — nothing was changed.");
      S.customers = await all(function () { return sb.from("customers").select("*").order("name").order("id"); });
      closeModal();
      toast((c ? c.name : "They") + (why
        ? " — " + why + ". Off the calling list and out of the post."
        : " — back on the calling list."));
      render();
    } catch (e) { toast(e.message); }
  }

var NTHS = [[1, "1st"], [2, "2nd"], [3, "3rd"], [4, "4th"], [5, "the last"]];
  var DOWS = [[1, "Monday"], [2, "Tuesday"], [3, "Wednesday"], [4, "Thursday"],
              [5, "Friday"], [6, "Saturday"], [0, "Sunday"]];

  function slotName(nth, dow) {
    var n = NTHS.filter(function (x) { return x[0] === Number(nth); })[0];
    var d = DOWS.filter(function (x) { return x[0] === Number(dow); })[0];
    return (n ? n[1] : "?") + " " + (d ? d[1] : "?") + " of the month";
  }

  async function programModal(cid) {
    var c = custById(cid); if (!c) return;
     
    var pg = progOf(cid);
    if (!pg) {
      var was = await many(sb.from("programs").select("*").eq("customer_id", cid));
      pg = was[0] || null;
    }
    var fresh = !pg;
    pg = pg || { nth: 3, weekday: 1, months: [5, 6, 7, 8, 9],
                 base_price: null, letter_note: null, property_id: null };
    var ps = propsOf(cid);
    var st = S.settings || {};

    openModal("<h3>" + esc(c.name) + " · the pre-scheduled programme</h3>" +
      '<p class="note">A slot they keep, mailed to them once a year.</p>' +
      (ps.length > 1
        ? '<label for="pgProp">Which address</label><select id="pgProp" class="f">' +
          ps.map(function (p) {
            return '<option value="' + p.id + '"' +
              (pg.property_id === p.id || (!pg.property_id && p.is_primary) ? " selected" : "") +
              ">" + esc(p.address) + "</option>";
          }).join("") + "</select>"
        : "") +
      '<label for="pgNth">Which week, and which day</label>' +
      '<div class="row" style="gap:.4rem">' +
      '<select id="pgNth" class="f" style="flex:1">' +
      NTHS.map(function (n) {
        return '<option value="' + n[0] + '"' + (Number(pg.nth) === n[0] ? " selected" : "") +
          ">" + n[1] + "</option>";
      }).join("") + "</select>" +
      '<select id="pgDow" class="f" style="flex:1.4">' +
      DOWS.map(function (d) {
        return '<option value="' + d[0] + '"' + (Number(pg.weekday) === d[0] ? " selected" : "") +
          ">" + d[1] + "</option>";
      }).join("") + "</select></div>" +
      '<label>Which months</label><div class="fcols five" id="pgMonths">' +
      MONTHS.map(function (m, i) {
        var on = (pg.months || []).indexOf(i + 1) >= 0;
        return '<label class="box"><span class="chk' + (on ? " on" : "") +
          '" data-mon="' + (i + 1) + '">' + (on ? "✓" : "") + "</span>" +
          "<span>" + esc(m.slice(0, 3)) + "</span></label>";
      }).join("") + "</div>" +
      '<label for="pgPrice">Price per spray</label>' +
      '<input id="pgPrice" class="f" inputmode="decimal" value="' +
        esc(pg.base_price == null ? "" : pg.base_price) + '" placeholder="' +
        esc(money(st.program_price || 65)) + ' — the programme rate">' +
      '<label for="pgNote">A line for their letter</label>' +
      '<input id="pgNote" class="f" value="' + esc(pg.letter_note || "") +
        '" placeholder="Always Friday morning, please">' +
       
      '<label>Also on that visit</label>' +
      '<div id="pgEx"></div>' +
      '<div class="acts"><button class="act" id="pgExAdd" type="button">' +
      "＋ Add something</button></div>" +
      '<div id="pgPreview" class="msg">Working out the dates…</div>' +
      (!fresh && !progOf(cid)
        ? '<p class="note">They were on the programme before, so their old slot and ' +
          "note are filled in below rather than lost.</p>"
        : "") +
      '<div class="row"><button class="primary" id="pgGo" type="button">' +
        (progOf(cid) ? "Save the programme" : "Put them on it") + "</button>" +
      (progOf(cid) ? '<button class="act" id="pgOff" type="button">Take them off</button>' : "") +
      '<button class="act" id="pgNo" type="button">Cancel</button></div>');

    var months = function () {
      var out = [];
      $("pgMonths").querySelectorAll("[data-mon]").forEach(function (el) {
        if (el.classList.contains("on")) out.push(Number(el.getAttribute("data-mon")));
      });
      return out.sort(function (a, b) { return a - b; });
    };

var EX = S.progExtras.filter(function (e) { return e.customer_id === cid; })
      .map(function (e) {
        return { month: Number(e.month), label: e.label, price: e.price,
                 every_other: !!e.every_other, base_year: e.base_year,
                 was: e.month + "|" + e.label };
      });
    var thisYear = new Date().getFullYear();

    var drawEx = function () {
      if (!EX.length) {
        $("pgEx").innerHTML = '<p class="note">Nothing else — just the sprays.</p>';
        return;
      }
      $("pgEx").innerHTML = EX.map(function (e, i) {
        return '<div class="exrow">' +
          '<select class="f exwhen" data-ex="' + i + '" data-f="month">' +
          MONTHS.map(function (m, k) {
            return '<option value="' + (k + 1) + '"' + (e.month === k + 1 ? " selected" : "") +
              ">" + esc(m.slice(0, 3)) + "</option>";
          }).join("") + "</select>" +
          '<input class="f exwhat" data-ex="' + i + '" data-f="label" list="pgSvcList" value="' +
            esc(e.label) + '" placeholder="what else is done that visit">' +
          '<div class="exfoot">' +
            '<input class="f r" data-ex="' + i + '" data-f="price" inputmode="decimal" value="' +
              esc(e.price == null ? "" : e.price) + '" placeholder="price">' +
            '<label class="box"><span class="chk' + (e.every_other ? " on" : "") +
              '" data-exo="' + i + '">' + (e.every_other ? "✓" : "") +
              "</span><span>every other year</span></label>" +
            '<span class="grow"></span>' +
            '<button class="act" data-exdel="' + i + '" type="button">Remove</button>' +
          "</div>" +
          (e.every_other
            ? '<p class="exnote">Due in ' +
              esc(String(e.base_year == null ? thisYear : e.base_year)) +
              " and every second year after — so " +
              esc([0, 2, 4].map(function (k) {
                return String((e.base_year == null ? thisYear : Number(e.base_year)) + k);
              }).join(", ")) + ".</p>"
            : "") +
          "</div>";
      }).join("") +
      '<datalist id="pgSvcList">' +
      S.catalog.map(function (x) { return '<option value="' + esc(x.name) + '">'; }).join("") +
      "</datalist>";
    };
    drawEx();

    $("pgExAdd").addEventListener("click", function () {
      EX.push({ month: (months()[0] || 8), label: "", price: null,
                every_other: false, base_year: null, was: null });
      drawEx();
    });
    $("pgEx").addEventListener("click", function (e) {
      var del = e.target.closest("[data-exdel]");
      if (del) { EX.splice(Number(del.getAttribute("data-exdel")), 1); drawEx(); return; }
      var tog = e.target.closest("[data-exo]");
      if (tog) {
        e.preventDefault();
        var j = Number(tog.getAttribute("data-exo"));
        EX[j].every_other = !EX[j].every_other;
         
        if (EX[j].every_other && EX[j].base_year == null) EX[j].base_year = thisYear;
        drawEx();
      }
    });
    $("pgEx").addEventListener("change", function (e) {
      var el = e.target.closest("[data-ex]"); if (!el) return;
      var j = Number(el.getAttribute("data-ex")), f = el.getAttribute("data-f");
      EX[j][f] = f === "month" ? Number(el.value)
               : (f === "price" ? (el.value.trim() === "" ? null : readMoney(el.value))
                                : el.value);
      if (f === "every_other" || f === "month") drawEx();
    });

var preview = async function () {
      var ms = months();
      if (!ms.length) {
        $("pgPreview").className = "msg warn";
        $("pgPreview").innerHTML = "Pick at least one month.";
        return;
      }
      $("pgPreview").className = "msg";
      $("pgPreview").innerHTML = "Working out the dates…";
      var y = route.year;
      var r = await sb.rpc("slot_dates", { p_year: y, p_dow: Number($("pgDow").value),
                                          p_nth: Number($("pgNth").value), p_months: ms });
      if (r.error) {
        $("pgPreview").className = "msg warn";
        $("pgPreview").innerHTML = "The dates cannot be worked out until " +
          "<code>0024_the_year_in_advance.sql</code> has been run. Everything else here saves.";
        return;
      }
      var rows = r.data || [];
      var clash = rows.filter(function (x) { return x.closed_day; });
      $("pgPreview").className = clash.length ? "msg warn" : "msg good";
      $("pgPreview").innerHTML = "<b>" + esc(slotName($("pgNth").value, $("pgDow").value)) +
        "</b> puts " + y + " on:<br>" +
        rows.map(function (x) {
          return esc(fmtLetter(x.d)) + (x.closed_day
            ? ' <span class="pill bad">' + esc(x.closed_reason || "closed") + "</span>" : "");
        }).join("<br>") +
        (clash.length
          ? "<br><br>" + plural(clash.length, "of these lands", "of these land") +
            " on a day nobody works. You will be asked to choose those dates."
          : "");
    };

    $("pgMonths").addEventListener("click", function (e) {
      var el = e.target.closest("[data-mon]"); if (!el) return;
      e.preventDefault();
      var on = el.classList.toggle("on");
      el.textContent = on ? "✓" : "";
      preview();
    });
    $("pgNth").addEventListener("change", preview);
    $("pgDow").addEventListener("change", preview);
    preview();

    $("pgNo").addEventListener("click", closeModal);
    if ($("pgOff")) $("pgOff").addEventListener("click", async function () {
      this.disabled = true;
      try {
         
        var u = await sb.from("programs").update({ active: false }).eq("customer_id", cid).select();
        if (u.error) throw explain(u.error);
        S.programs = await many(sb.from("programs").select("*").eq("active", true));
        LET = null; closeModal(); toast(c.name + " taken off the programme.");
      } catch (e) { toast(e.message); this.disabled = false; }
    });

    $("pgGo").addEventListener("click", async function () {
      var ms = months();
      if (!ms.length) { toast("Pick at least one month."); return; }
      var pr = $("pgPrice").value.trim() === "" ? null : readMoney($("pgPrice").value);
      if ($("pgPrice").value.trim() !== "" && pr == null) {
        toast("That price does not look like an amount."); return;
      }
      this.disabled = true;
      try {
        var row = {
          customer_id: cid,
          property_id: ($("pgProp") ? $("pgProp").value : null) ||
                       ((propsOf(cid).filter(function (p) { return p.is_primary; })[0] || {}).id) || null,
          nth: Number($("pgNth").value),
          weekday: Number($("pgDow").value),
          months: ms,
          base_price: pr,
          letter_note: $("pgNote").value.trim() || null,
          active: true
        };
        var up = await sb.from("programs").upsert(row, { onConflict: "customer_id" }).select();
        if (up.error) throw explain(up.error);

var keep = EX.filter(function (e) { return e.label && e.label.trim(); });
        for (var q = 0; q < keep.length; q++) {
          if (keep[q].price == null || isNaN(Number(keep[q].price)))
            throw new Error("\u201c" + keep[q].label + "\u201d needs a price — it goes on the " +
              "letter's total, so it cannot be left blank.");
          if (keep[q].month == null || !ms.length || ms.indexOf(Number(keep[q].month)) < 0)
            throw new Error("\u201c" + keep[q].label + "\u201d is set for " +
              MONTHS[Number(keep[q].month) - 1] + ", but there is no visit that month.");
        }
        var seen = {};
        for (var w = 0; w < keep.length; w++) {
          var k = Number(keep[w].month) + "|" + keep[w].label.trim();
          if (seen[k]) throw new Error("\u201c" + keep[w].label +
            "\u201d is on " + MONTHS[Number(keep[w].month) - 1] + " twice.");
          seen[k] = 1;
        }
         
        var had = S.progExtras.filter(function (e) { return e.customer_id === cid; });
        for (var d = 0; d < had.length; d++) {
          var stillThere = keep.filter(function (e) {
            return Number(e.month) === Number(had[d].month) && e.label.trim() === had[d].label;
          }).length;
          if (!stillThere) {
            var dr = await sb.from("program_extras").delete()
              .eq("customer_id", cid).eq("month", had[d].month).eq("label", had[d].label);
            if (dr.error) throw explain(dr.error);
          }
        }
        if (keep.length) {
          var er = await sb.from("program_extras").upsert(keep.map(function (e) {
            return { customer_id: cid, month: Number(e.month), label: e.label.trim(),
                     price: Number(e.price), every_other: !!e.every_other,
                     base_year: e.every_other ? Number(e.base_year || thisYear) : null };
          }), { onConflict: "customer_id,month,label" }).select();
          if (er.error) throw explain(er.error);
        }

        S.programs = await many(sb.from("programs").select("*").eq("active", true));
        S.progExtras = await many(sb.from("program_extras").select("*"));
        LET = null;
        closeModal();
        toast(c.name + " · " + slotName(row.nth, row.weekday) +
          (keep.length ? " · with " + esc(keep.map(function (e) { return e.label; }).join(", ")) : ""));
      } catch (e) { toast(e.message); this.disabled = false; }
    });
  }
})();
</script>
