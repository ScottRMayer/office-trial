function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  var CARRY_DAYS = 90;    

function tzOffsetMs(tz, when) {
    var f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hour12: false,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit" });
    var p = {};
    f.formatToParts(when).forEach(function (x) { p[x.type] = x.value; });
    return Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second) - when.getTime();
  }
   
  function dayStartISO(iso) {
    var tz = (S.settings && S.settings.business_tz) || "America/New_York";
    var wall = new Date(iso + "T00:00:00Z");
    try {
      var t = new Date(wall.getTime() - tzOffsetMs(tz, wall));
      return new Date(wall.getTime() - tzOffsetMs(tz, t)).toISOString();
    } catch (e) {
       
      return wall.toISOString();
    }
  }

  async function renderClose(D) {
    app.innerHTML = '<div class="msg">Adding up ' + esc(fmtLong(D)) + "…</div>";

    var pays = [], revs = [], revPays = [];
    var work = [], openToday = [], carriedRaw = [];
    var invBy = {}, balBy = {}, linesBy = {}, sheetBy = {};
    try {
       
      pays = await many(sb.from("payments")
        .select("id,invoice_id,job_id,customer_id,method,amount_collected,check_number," +
                "processor,processor_txn_id,collected,collected_at,recorded_by,recorded_offline")
        .gte("collected_at", dayStartISO(D))
        .lt("collected_at", dayStartISO(shiftISO(D, 1)))
        .order("collected_at"));
      revs = await many(sb.from("payment_reversals")
        .select("id,payment_id,kind,amount,reason,effective_on,created_by")
        .is("undone_at", null).eq("effective_on", D));

work = await many(sb.from("jobs").select("*")
        .eq("status", "complete").eq("completed_date", D));
      openToday = await many(sb.from("jobs").select("*")
        .eq("scheduled_date", D).in("status", ["scheduled", "rained-out", "no-access"]));
      carriedRaw = await many(sb.from("jobs").select("*")
        .gte("scheduled_date", shiftISO(D, -CARRY_DAYS)).lt("scheduled_date", D)
        .in("status", ["scheduled", "rained-out", "no-access"]).order("scheduled_date"));

var ids = {};
      work.concat(openToday, carriedRaw).forEach(function (j) { ids[j.id] = 1; });
      pays.forEach(function (p) { if (p.job_id) ids[p.job_id] = 1; });
      if (revs.length) {
        revPays = await many(sb.from("payments")
          .select("id,customer_id,job_id,method,check_number,amount_collected,collected_at")
          .in("id", revs.map(function (x) { return x.payment_id; })));
        revPays.forEach(function (p) { if (p.job_id) ids[p.job_id] = 1; });
      }
      var idList = Object.keys(ids);
      if (idList.length) {
        (await many(sb.from("invoices").select("*").in("job_id", idList)))
          .forEach(function (i) { invBy[i.job_id] = i; });
        (await many(sb.from("v_invoice_balances").select("*").in("job_id", idList)))
          .forEach(function (b) { balBy[b.job_id] = b; });
        (await many(sb.from("job_lines").select("*").in("job_id", idList)))
          .forEach(function (l) { (linesBy[l.job_id] = linesBy[l.job_id] || []).push(l); });
        (await many(sb.from("job_sheets").select("job_id,signed_on,notes").in("job_id", idList)))
          .forEach(function (s) { sheetBy[s.job_id] = s; });
      }
    } catch (e) {
      app.innerHTML = '<div class="msg bad"><b>Couldn’t add up the day.</b><br>' +
        esc(e.message) + "<br>Nothing here is a real figure — reload before acting on it.</div>";
      return;
    }

if (!S.customers.length && !work.length && !pays.length) {
      app.innerHTML = '<div class="msg bad"><b>Nothing loaded.</b><br>' +
        "This is not an empty day — the app could not read the data. Reload, and if " +
        "it keeps happening your access may have been switched off.</div>";
      return;
    }

    var lines = function (id) { return linesBy[id] || []; };
    var svc = function (id) {
      return lines(id).map(function (l) { return l.service_name; }).join(" + ");
    };
    var who = function (id) { var c = custById(id); return c ? c.name : "?"; };

var noInvoice = [], excluded = [], counted = [];
    work.forEach(function (j) {
      var inv = invBy[j.id];
      if (!inv) { noInvoice.push(j); return; }
       
      if (inv.voided_at || inv.charge_withdrawn) { excluded.push({ j: j, inv: inv }); return; }
      counted.push({ j: j, inv: inv, bal: balBy[j.id] });
    });
    var completed = r2(counted.reduce(function (t, x) { return t + Number(x.inv.total || 0); }, 0));
    var recorded  = r2(counted.reduce(function (t, x) { return t + Number(x.bal ? x.bal.collected : 0); }, 0));
    var unaccounted = r2(counted.reduce(function (t, x) { return t + Number(x.bal ? x.bal.balance : x.inv.total); }, 0));
     
    var overpaid = r2(counted.reduce(function (t, x) { return t + Number(x.bal ? x.bal.overpaid : 0); }, 0));
    var excludedTotal = r2(excluded.reduce(function (t, x) { return t + Number(x.inv.total || 0); }, 0));
    var taxDue  = r2(counted.reduce(function (t, x) { return t + Number(x.inv.tax || 0); }, 0));
    var taxable = r2(counted.reduce(function (t, x) {
      return t + (Number(x.inv.subtotal || 0) - Number(x.inv.discount || 0));
    }, 0));

    var faults = (unaccounted > 0.004) || (overpaid > 0.004) || noInvoice.length > 0;
    var balanced = !faults;
    var nothingYet = !counted.length && !noInvoice.length && !excluded.length;

var inDrawer = pays.filter(function (p) { return p.collected; });
    var promised = pays.filter(function (p) { return !p.collected; });
    var by = function (m) { return inDrawer.filter(function (p) { return p.method === m; }); };
    var sum = function (rows) {
      return r2(rows.reduce(function (t, p) { return t + Number(p.amount_collected || 0); }, 0));
    };
    var cash = by("cash"), checks = by("check"), cards = by("card");
    var mailed = by("to-be-mailed"), other = by("other");
    var drawerGross = r2(sum(cash) + sum(checks) + sum(mailed) + sum(other));

var dayStart = dayStartISO(D), dayEnd = dayStartISO(shiftISO(D, 1));
    var revInfo = revs.map(function (r) {
      var p = revPays.filter(function (x) { return x.id === r.payment_id; })[0] || null;
      var sameDay = !!(p && p.collected_at >= dayStart && p.collected_at < dayEnd);
      var isCard = !!(p && p.method === "card");
      return { r: r, p: p, sameDay: sameDay, isCard: isCard,
               bucket: isCard ? "card" : (sameDay ? "drawer" : "earlier") };
    });
    var backDrawer = r2(revInfo.filter(function (x) { return x.bucket === "drawer"; })
      .reduce(function (t, x) { return t + Number(x.r.amount || 0); }, 0));
    var backCard = r2(revInfo.filter(function (x) { return x.bucket === "card"; })
      .reduce(function (t, x) { return t + Number(x.r.amount || 0); }, 0));
    var backEarlier = r2(revInfo.filter(function (x) { return x.bucket === "earlier"; })
      .reduce(function (t, x) { return t + Number(x.r.amount || 0); }, 0));
    var drawer = r2(drawerGross - backDrawer);

    var voidJobs = {};
    excluded.forEach(function (x) { voidJobs[x.j.id] = x.inv; });

var h = "<h1>Daily Close — " + esc(fmtLong(D)) + "</h1>" +
      '<p class="sub">Work finished, against money recorded.</p>';

    h += '<div class="daynav noprint">' +

if (openToday.length)

function bankRow(label, rows, total, detail) {
      return '<div class="brow"><div>' + esc(label) +
        (rows.length ? " (" + rows.length + ")" : "") + "</div><div>" + money(total) + "</div>" +
        (detail && rows.length
          ? '<div class="bdetail">' + rows.map(function (p) {
              return detail(p) + " " + money(p.amount_collected);
            }).join(" · ") + "</div>"
          : "") + "</div>";
    }
    function closeLine(x, which) {
      var v = which === "total" ? x.inv.total
            : which === "collected" ? (x.bal ? x.bal.collected : 0)
            : which === "overpaid" ? (x.bal ? x.bal.overpaid : 0)
            : (x.bal ? x.bal.balance : x.inv.total);
      return '<div class="item tap" data-job="' + x.j.id + '"><div class="top">' +
        '<span class="nm">' + esc(who(x.j.customer_id)) + "</span>" +
        '<span class="amt">' + money(v) + "</span></div>" +
        '<div class="why">' + esc(svc(x.j.id)) +
        (x.bal && x.bal.methods ? " · " + esc(x.bal.methods) : "") + "</div></div>";
    }
    function openJobLine(j, on) {
      var inv = invBy[j.id], t = personOf(j.assigned_to);
      var days = j.scheduled_date
        ? Math.round((new Date(on + "T12:00:00") - new Date(j.scheduled_date + "T12:00:00")) / 864e5) : 0;
      var pill = j.status === "rained-out" ? "rained out"
               : j.status === "no-access" ? "nobody home"
               : sheetBy[j.id] ? "sheet started" : "not started";
      return '<div class="item"><div class="top">' +
        '<span class="nm">' + esc(who(j.customer_id)) + "</span>" +
        '<span class="pill' + (days >= 7 ? " warn" : "") + '">' + pill + "</span>" +
        '<span class="amt">' + (inv ? money(inv.total) : "—") + "</span></div>" +
        '<div class="dates">' + esc(svc(j.id)) +
        (t ? " · " + esc(t.name) : "") +
        (days > 0 ? " · " + plural(days, "day") + " ago" : "") +
        (days >= 7 ? " — worth a nudge" : "") + "</div>" +
         
        '<div class="acts noprint">' +
        '<button class="act go" data-move="' + j.id + '" type="button">Move it</button>' +
        '<button class="act" data-job="' + j.id + '" type="button">Open it</button>' +
        "</div></div>";
    }
  }

async function untickChem(row, el, back) {
    if (el) el.style.opacity = ".4";
    try {
      var r = await sb.from("treatment_chemicals").delete().eq("id", row.id).select();
      if (r.error) throw explain(r.error);
      if (!(r.data || []).length)
        throw new Error("That sheet is finished, so it can’t just come off — " +
          "reopen it and take it off with a reason.");
      S.chems = await all(function () {
        return sb.from("treatment_chemicals").select("*").order("sort_order").order("id");
      });
      toast(row.product_name + " taken off");
      back();
    } catch (e) {
      if (el) el.style.opacity = "";
      toast(e.message);
    }
  }

var VOID_REASONS = ["Recorded in error", "Wrong product", "Not actually applied"];

  function voidChemModal(row, j, back) {
    back = back || function () { go("sheet", j.id); };
    openModal("<h3>Take " + esc(row.product_name) + " off the record?</h3>" +
      '<p class="note">' +
      (row.epa_number ? "EPA #" + esc(row.epa_number) : "") +
      (row.percent || row.amount
        ? (row.epa_number ? " · " : "") +
          esc([row.percent, row.amount].filter(Boolean).join(" · ")) : "") +
      "</p>" +
      '<p class="note">Not deleted — it stays on the file with your name against it ' +
      "and comes off the printed record. If it really was applied and you only regret " +
      "it, that is not a mistake: leave it.</p>" +
      '<div class="acts" style="margin-bottom:.3rem">' +
      VOID_REASONS.map(function (r, i) {
        return '<button class="act' + (i === 0 ? " go" : "") + '" data-vc="' + esc(r) +
          '" type="button">' + esc(r) + "</button>";
      }).join("") +
      '<button class="act" id="vcOther" type="button">Something else…</button></div>' +
      '<div id="vcFree" hidden><label for="vcWhy">What happened?</label>' +
      '<input id="vcWhy" class="f" placeholder="say what happened">' +
      '<div class="acts"><button class="act go" id="vcGo" type="button">Take it off</button></div></div>' +
      '<div class="row"><button class="act" id="vcNo" type="button">Leave it</button></div>');

    $("vcNo").addEventListener("click", function () { back(); });
    $("vcOther").addEventListener("click", function () {
      $("vcFree").hidden = false;
      $("vcWhy").focus();
      this.disabled = true;
    });
    $("modal").querySelectorAll("[data-vc]").forEach(function (b) {
      b.addEventListener("click", function () { doVoid(b.getAttribute("data-vc"), b); });
    });
    $("vcGo").addEventListener("click", function () {
      doVoid($("vcWhy").value.trim(), this);
    });

    async function doVoid(why, btn) {
      btn.disabled = true;
      try {
        if (!why) throw new Error("Say what happened, or pick one of the reasons.");
        var r = await sb.from("treatment_chemicals").update({
          voided_at: new Date().toISOString(), voided_by: S.me.id, void_reason: why
        }).eq("id", row.id).select();
        if (r.error) throw explain(r.error);
        if (!(r.data || []).length)
          throw new Error("That didn’t save. If the sheet is signed or paid it has to be opened first.");
        S.chems = await all(function () {
          return sb.from("treatment_chemicals").select("*").order("sort_order").order("id");
        });
        closeModal();
        toast(row.product_name + " taken off — " + why.toLowerCase());
        back();
      } catch (e) {
        toast(/voided_at|void_reason/.test(e.message)
          ? "Undoing a mis-tapped material needs the latest bit of SQL run first."
          : e.message);

  async function savePayment(inv, ref, btn) {
    btn.disabled = true;
    var posted = false;
    try {
       
      var b = S.balances.filter(function (x) { return x.invoice_id === inv.id; })[0];
      if (!b) throw new Error("That invoice has moved — close this and open it again.");
      var method = $("pm").value, raw = $("amt").value, amt = readMoney(raw);
      if (amt == null) throw new Error('"' + raw + '" isn’t an amount — type it like 159.94');
      if (amt <= 0) throw new Error("Type how much they handed over.");
      if (amt > Number(b.balance) + 0.004) throw new Error("They only owe " + money(b.balance) + " on this one.");
      var ck = method === "check" ? $("ck").value.trim() : null;
      if (method === "check" && !ck) throw new Error("A check needs the number printed on it.");
      var collected = method !== "to-be-mailed";
      var r = await sb.from("payments").insert({
        invoice_id: inv.id, job_id: inv.job_id, customer_id: inv.customer_id,
        method: method, amount_collected: amt, check_number: ck,
        collected: collected, recorded_by: S.me.id, client_ref: ref
      }).select();
      if (r.error) throw explain(r.error);
       
      posted = true;
      await reload(["money", "attention"]);
      closeModal(); render();
      toast(collected

    if (t.length < 2) { qRes.classList.remove("show"); return; }
    var digits = t.replace(/\D/g, ""), hits = [];
    S.properties.forEach(function (p) {
      if (String(p.address || "").toLowerCase().indexOf(t) >= 0) {
        var c = custById(p.customer_id); if (c) hits.push({ s: 0, c: c, p: p, why: "address" });
      }
    });
    S.customers.forEach(function (c) {
      if (String(c.name || "").toLowerCase().indexOf(t) >= 0)
        hits.push({ s: 1, c: c, p: propsOf(c.id)[0], why: "name" });
      else if (digits.length >= 4 && String(c.phone || "").replace(/\D/g, "").indexOf(digits) >= 0)
        hits.push({ s: 2, c: c, p: propsOf(c.id)[0], why: "phone" });
    });
    var seen = {}, uniq = [];
    hits.sort(function (a, b) { return a.s - b.s; }).forEach(function (h) {
      var k = h.c.id + "|" + (h.p ? h.p.id : "");
      if (!seen[k]) { seen[k] = 1; uniq.push(h); }

    qRes.innerHTML = uniq.length

          customer_id: cid,
          property_id: ($("pgProp") ? $("pgProp").value : null) ||
                       ((propsOf(cid).filter(function (p) { return p.is_primary; })[0] || {}).id) || null,
          nth: Number($("pgNth").value),
          weekday: Number($("pgDow").value),
          months: ms,
          base_price: pr,
          letter_note: $("pgNote").value.trim() || null,
          active: true
        };
        var up = await sb.from("programs").upsert(row, { onConflict: "customer_id" }).select();
        if (up.error) throw explain(up.error);

var keep = EX.filter(function (e) { return e.label && e.label.trim(); });
        for (var q = 0; q < keep.length; q++) {
          if (keep[q].price == null || isNaN(Number(keep[q].price)))
            throw new Error("\u201c" + keep[q].label + "\u201d needs a price — it goes on the " +
              "letter's total, so it cannot be left blank.");
          if (keep[q].month == null || !ms.length || ms.indexOf(Number(keep[q].month)) < 0)
            throw new Error("\u201c" + keep[q].label + "\u201d is set for " +
              MONTHS[Number(keep[q].month) - 1] + ", but there is no visit that month.");
        }
        var seen = {};
        for (var w = 0; w < keep.length; w++) {
          var k = Number(keep[w].month) + "|" + keep[w].label.trim();
          if (seen[k]) throw new Error("\u201c" + keep[w].label +
            "\u201d is on " + MONTHS[Number(keep[w].month) - 1] + " twice.");
          seen[k] = 1;
        }
         
        var had = S.progExtras.filter(function (e) { return e.customer_id === cid; });
        for (var d = 0; d < had.length; d++) {
          var stillThere = keep.filter(function (e) {
            return Number(e.month) === Number(had[d].month) && e.label.trim() === had[d].label;
          }).length;
          if (!stillThere) {
            var dr = await sb.from("program_extras").delete()
              .eq("customer_id", cid).eq("month", had[d].month).eq("label", had[d].label);
            if (dr.error) throw explain(dr.error);
          }
        }
        if (keep.length) {
          var er = await sb.from("program_extras").upsert(keep.map(function (e) {
            return { customer_id: cid, month: Number(e.month), label: e.label.trim(),
                     price: Number(e.price), every_other: !!e.every_other,
                     base_year: e.every_other ? Number(e.base_year || thisYear) : null };
          }), { onConflict: "customer_id,month,label" }).select();
          if (er.error) throw explain(er.error);
        }

        S.programs = await many(sb.from("programs").select("*").eq("active", true));
        S.progExtras = await many(sb.from("program_extras").select("*"));
        LET = null;
        closeModal();
        toast(c.name + " · " + slotName(row.nth, row.weekday) +
          (keep.length ? " · with " + esc(keep.map(function (e) { return e.label; }).join(", ")) : ""));
      } catch (e) { toast(e.message); this.disabled = false; }
    });
  }
})();
</script>
