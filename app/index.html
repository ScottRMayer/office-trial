

<meta charset="utf-8">
<title>United Termite — Office</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<meta http-equiv="Content-Security-Policy" content="default-src 'none';

  style-src 'self' 'unsafe-inline';

  font-src 'self';
  connect-src 'self' https://lhochuvilhezyzxaxfof.supabase.co https://geo.nj.gov https://maps.nj.gov https://services2.arcgis.com;
  manifest-src 'self';
  form-action 'none';
  base-uri 'none';
  object-src 'none'">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="United">
<meta name="theme-color" content="#ffffff">
<style>
  :root{
    --ink:#1b211e; --ink-soft:#5c6862; --paper:#f4f6f3; --card:#fff;
    --rule:#dbe0dc; --rule-soft:#ecefec; --brand:#2f5d4a; --brand-w:#eaf1ed;
    --owed:#c2352f; --risk:#b58a06; --ok:#3d8f52; --dot:#d4dbd8;
  }
  @media (prefers-color-scheme:dark){
    :root{ --ink:#e7ece8; --ink-soft:#98a59d; --paper:#0f1311; --card:#181e1b;
      --rule:#2c3531; --rule-soft:#222a26; --brand:#7fc0a3; --brand-w:#1b2620;
      --owed:#ef6b64; --risk:#dcae2b; --ok:#5fc275; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}

  header{position:sticky;top:0;z-index:20;background:var(--card);
    border-bottom:1px solid var(--rule);padding:.55rem .9rem}
  .hrow{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
  .logo{font-family:ui-serif,Georgia,serif;font-weight:600;font-size:1rem;letter-spacing:-.01em}
  .logo small{display:block;font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600}
  .search{flex:1 1 14rem;min-width:0;position:relative}
  .search input{width:100%;font:inherit;font-size:.9rem;padding:.45rem .7rem;
    border:1px solid var(--rule);border-radius:20px;background:var(--paper);color:var(--ink)}
  .results{position:absolute;top:112%;left:0;right:0;background:var(--card);
    border:1px solid var(--rule);border-radius:8px;box-shadow:0 14px 34px -14px rgba(0,0,0,.35);
    max-height:60vh;overflow:auto;display:none;z-index:30}
  .results.show{display:block}
  .results button{display:block;width:100%;text-align:left;background:none;border:none;
    border-bottom:1px solid var(--rule-soft);padding:.55rem .8rem;font:inherit;cursor:pointer;color:var(--ink)}
  .results button:hover,.results button:focus-visible{background:var(--brand-w);outline:none}
  .who{font-size:.82rem;color:var(--ink-soft);white-space:nowrap}
  .who b{color:var(--ink)}
  nav{display:flex;gap:.25rem;overflow-x:auto;margin-top:.5rem}
  nav button{font:inherit;font-size:.86rem;font-weight:600;white-space:nowrap;
    padding:.35rem .75rem;border-radius:20px;border:1px solid transparent;
    background:none;color:var(--ink-soft);cursor:pointer}
  nav button:hover{color:var(--ink)}
  nav button.on{background:var(--brand-w);color:var(--brand);border-color:var(--rule)}
  nav button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}

  main{max-width:64rem;margin:0 auto;padding:1.2rem 1rem 5rem}
  h1{font-family:ui-serif,Georgia,serif;font-size:1.5rem;font-weight:600;margin:0 0 .15rem;letter-spacing:-.01em}
  .sub{color:var(--ink-soft);font-size:.87rem;margin:0 0 1.1rem}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:6px;
    padding:1rem 1.1rem;margin-bottom:.9rem}
  .card h2{font-family:ui-serif,Georgia,serif;font-size:1.12rem;font-weight:600;margin:0 0 .1rem}
  .card .note{color:var(--ink-soft);font-size:.84rem;margin:0 0 .85rem}

  .buckets{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));margin-bottom:.9rem}
  .bucket{border:1px solid var(--rule);border-radius:6px;background:var(--card);padding:.95rem 1.05rem}
  .bucket.owed{border-left:5px solid var(--owed)} .bucket.risk{border-left:5px solid var(--risk)}
  .bucket .lbl{font-size:.67rem;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink-soft)}
  .bucket .amt{font-size:1.85rem;font-weight:700;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;line-height:1.15;margin:.1rem 0 0}
  .bucket.owed .amt{color:var(--owed)} .bucket.risk .amt{color:var(--risk)}
  .bucket .what{font-size:.84rem;color:var(--ink-soft)}
  .bucket button.expand{margin-top:.45rem;font:inherit;font-size:.8rem;font-weight:650;
    background:none;border:none;color:var(--brand);cursor:pointer;padding:0;text-decoration:underline}

  .item{border:1px solid var(--rule);border-radius:6px;padding:.75rem .85rem;margin-bottom:.55rem;background:var(--card)}
  .item.owed{border-left:4px solid var(--owed)} .item.risk{border-left:4px solid var(--risk)}
  .item.tap{cursor:pointer} .item.tap:hover{border-color:var(--brand)}
  .item .top{display:flex;gap:.55rem;align-items:baseline;flex-wrap:wrap}
  .item .nm{font-weight:700}
  .item .amt{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .item .why,.item .dates{font-size:.82rem;color:var(--ink-soft);margin:.22rem 0 0}
  .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.55rem}
  button.act,a.act{font:inherit;font-size:.8rem;font-weight:600;padding:.34rem .7rem;border-radius:4px;
    border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;
    text-decoration:none;display:inline-block}
  button.act:hover,a.act:hover{border-color:var(--brand);color:var(--brand)}
  button.act.go{background:var(--ink);color:var(--card);border-color:var(--ink)}
  button.act.go:hover{background:var(--brand);border-color:var(--brand);color:#fff}
  button.act:focus-visible,a.act:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  button.act:disabled{opacity:.5;cursor:default}
   
  .field button.act,.field a.act,.modal button.act,.modal a.act{
    min-height:2.75rem;font-size:.9rem;padding:.5rem .95rem}

  .dot{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--dot);
    margin-right:.35rem;vertical-align:.02rem;flex:0 0 auto}
  .pill{display:inline-block;font-size:.65rem;letter-spacing:.05em;text-transform:uppercase;
    font-weight:700;padding:.14rem .45rem;border-radius:3px;background:var(--rule-soft);color:var(--ink-soft)}
  .pill.ok{background:var(--brand-w);color:var(--brand)}
  .pill.warn{color:var(--owed);background:transparent;border:1px solid var(--owed)}

  .gate{max-width:22rem;margin:12vh auto;padding:0 1rem}
  label{display:block;font-size:.71rem;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:650;margin-bottom:.25rem}
  input.f,select.f,textarea.f{width:100%;font:inherit;padding:.55rem .65rem;border:1px solid var(--rule);
    border-radius:4px;background:var(--paper);color:var(--ink);margin-bottom:.75rem}
  input.f:focus-visible,select.f:focus-visible,textarea.f:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  button.primary{font:inherit;font-weight:650;width:100%;padding:.6rem;border:none;border-radius:4px;
    background:var(--ink);color:var(--card);cursor:pointer}
  button.primary:hover{background:var(--brand)}
  button.primary:disabled{opacity:.55;cursor:default}

  .msg{padding:.7rem .85rem;border-radius:5px;font-size:.87rem;margin-bottom:.85rem;
    border:1px solid var(--rule);background:var(--card)}
  .msg.bad{border-color:var(--owed);border-left:4px solid var(--owed)}
  .msg.good{border-color:var(--ok);border-left:4px solid var(--ok)}
  .msg.warn{border-color:var(--risk);border-left:4px solid var(--risk)}

  .veil{position:fixed;inset:0;background:rgba(15,19,17,.55);display:none;align-items:center;
    justify-content:center;padding:1rem;z-index:50}
  .veil.show{display:flex}
   
  .lockveil{z-index:60;background:rgba(15,19,17,.94)}
  .modal{background:var(--card);border-radius:8px;max-width:30rem;width:100%;padding:1.15rem 1.2rem;
    max-height:90vh;overflow:auto}
  .modal h3{font-family:ui-serif,Georgia,serif;font-size:1.08rem;margin:0 0 .25rem}
  .modal .note{font-size:.84rem;color:var(--ink-soft);margin:0 0 .85rem}
  .modal .row{display:flex;gap:.5rem;margin-top:.85rem}
  .modal .row button{flex:1}

.sheetbar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;gap:.5rem;
    justify-content:center;flex-wrap:wrap;padding:.55rem .8rem;background:var(--card);
    border-top:1px solid var(--rule);box-shadow:0 -2px 10px rgba(0,0,0,.07)}
  .sheetbar button{flex:0 1 auto}
  body.hassheetbar{padding-bottom:4.2rem}
   
  @media (max-width:560px){ body.hassheetbar{padding-bottom:6.4rem} }
  @media print{ .sheetbar{display:none!important} body.hassheetbar{padding-bottom:0} }

  .toast{position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%);background:var(--ink);
    color:var(--card);padding:.6rem 1rem;border-radius:6px;font-size:.86rem;opacity:0;
    transition:opacity .18s;pointer-events:none;z-index:60;max-width:92vw;text-align:center}
  .toast.show{opacity:1}
  .empty{color:var(--ink-soft);font-size:.89rem}
  .stamp{font-size:.75rem;color:var(--ink-soft);margin-top:1.3rem;text-align:center}

table.lst{width:100%;border-collapse:collapse;font-size:.86rem;display:block;overflow-x:auto}
  table.lst th,table.lst td{border-bottom:1px solid var(--rule-soft);padding:.28rem .4rem;text-align:left}
  table.lst th{font-size:.63rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:700;white-space:nowrap}
  table.lst th.r,table.lst td.r{text-align:right}
  input.li{width:100%;min-width:6rem;font:inherit;font-size:.86rem;padding:.22rem .35rem;
    border:1px solid transparent;border-radius:3px;background:transparent;color:var(--ink)}
  input.li:hover{border-color:var(--rule)}
  input.li:focus{border-color:var(--brand);background:var(--card);outline:none}
  input.li.r{text-align:right;font-variant-numeric:tabular-nums}
  button.tgl{font:inherit;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:.14rem .5rem;border-radius:3px;cursor:pointer;
    border:1px solid var(--rule);background:var(--paper);color:var(--ink-soft)}
  button.tgl.on{background:var(--brand-w);border-color:var(--brand);color:var(--brand)}
  button.tgl:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.7rem}
  .chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.82rem;padding:.2rem .3rem .2rem .55rem;
    border:1px solid var(--rule);border-radius:14px;background:var(--paper)}
  .chip .x{font:inherit;font-size:.72rem;line-height:1;width:1.3rem;height:1.3rem;border-radius:50%;
    border:none;background:none;color:var(--ink-soft);cursor:pointer}
  .chip .x:hover{background:var(--owed);color:#fff}
  .chip .x:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  .addrow{display:flex;gap:.4rem;align-items:center}
  .addrow input{flex:1}
  button.gear{font:inherit;font-size:1rem;line-height:1;background:none;border:none;
    cursor:pointer;color:var(--ink-soft);padding:.1rem .25rem;border-radius:4px}
  button.gear:hover{color:var(--brand);background:var(--brand-w)}
  button.gear:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  select.li{width:100%;font:inherit;font-size:.84rem;padding:.22rem .3rem;
    border:1px solid transparent;border-radius:3px;background:transparent;color:var(--ink)}
  select.li:hover{border-color:var(--rule)}
  select.li:focus{border-color:var(--brand);background:var(--card);outline:none}
  select.li:disabled{opacity:.6}

.picklist{max-height:11rem;overflow:auto;border:1px solid var(--rule);border-radius:4px;
    margin-bottom:.75rem;background:var(--paper)}
  .picklist:empty{display:none}
  .pickrow{display:flex;gap:.5rem;align-items:center;width:100%;text-align:left;
    padding:.34rem .5rem;font:inherit;font-size:.86rem;background:none;border:none;
    border-bottom:1px solid var(--rule-soft);cursor:pointer;color:var(--ink)}
  .pickrow:last-child{border-bottom:none}
  .pickrow:hover{background:var(--brand-w)}
  .pickrow > span:first-of-type{flex:1;min-width:0}
  .pickamt{color:var(--ink-soft);font-size:.78rem;white-space:nowrap;
    font-variant-numeric:tabular-nums}

.bucket.call{border-left:5px solid var(--brand)}
  .bucket.call .amt{color:var(--brand)}
  .grouphdr{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    color:var(--ink-soft);padding-bottom:.3rem;border-bottom:1px solid var(--rule);margin-bottom:.55rem}
  .submonth{font-size:.78rem;font-weight:650;color:var(--ink-soft);margin:.6rem 0 .3rem}

.spanbtns{display:inline-flex;gap:.25rem}
  .week{display:grid;gap:.5rem;grid-template-columns:repeat(7,minmax(0,1fr))}
  @media (max-width:900px){ .week{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .wday{border:1px solid var(--rule);border-radius:6px;background:var(--card);
    padding:.4rem .45rem;min-height:7rem;cursor:pointer}
  .wday:hover{border-color:var(--brand)}
  .wday.istoday{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
  .wday.picked{background:var(--brand-w)}
  .whdr{font-size:.74rem;color:var(--ink-soft);display:flex;gap:.3rem;align-items:baseline;
    padding-bottom:.3rem;margin-bottom:.3rem;border-bottom:1px solid var(--rule-soft)}
  .whdr b{color:var(--ink)}
  .wcount{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.7rem;
    display:flex;gap:.25rem}
  .wcount .over{color:var(--owed);font-weight:700}

.winhdr{display:flex;align-items:baseline;gap:.6rem;margin:1.1rem 0 .5rem}
  .winhdr h2{font-family:ui-serif,Georgia,serif;font-size:1.05rem;font-weight:600;margin:0}
  .winhdr .pill{font-variant-numeric:tabular-nums}
  .techcol.pool{border-color:var(--brand);margin-bottom:.5rem}
  .techcol.pool h3{background:var(--brand-w);color:var(--brand)}
  .techcol h3 .cap{float:right;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:0;text-transform:none}
  .techcol h3 .cap.over{color:var(--owed)}
  .minilbl{font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
    color:var(--ink-soft);align-self:center;margin-right:.15rem}
  .slot .give{display:flex;gap:.2rem;flex:0 0 auto;margin-left:.3rem}
  .slot .give .act{font-size:.7rem;padding:.16rem .4rem;min-height:0}
  .chipjob{display:flex;gap:.25rem;align-items:baseline;font-size:.78rem;padding:.16rem .2rem;
    border-radius:3px;cursor:pointer;line-height:1.25}
  .chipjob:hover{background:var(--brand-w)}
  .chipjob.done{color:var(--ink-soft)}
  .chipjob.small{font-size:.72rem;padding:.1rem .15rem}
  .chipjob .who3{margin-left:auto;font-size:.62rem;font-weight:700;color:var(--ink-soft);
    border:1px solid var(--rule);border-radius:2px;padding:0 .2rem;flex:0 0 auto}
  .mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;
    background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
  .mhead{background:var(--rule-soft);font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;
    font-weight:700;color:var(--ink-soft);padding:.3rem .4rem;text-align:center}
  .mcell{background:var(--card);min-height:5.4rem;padding:.25rem .3rem;cursor:pointer}
  .mcell:hover{background:var(--brand-w)}
  .mcell.other{background:var(--paper);opacity:.55}
  .mcell.istoday{box-shadow:inset 0 0 0 2px var(--brand)}
  .mcell.picked{background:var(--brand-w)}
  .mnum{font-size:.72rem;font-variant-numeric:tabular-nums;color:var(--ink-soft);
    display:flex;align-items:baseline}
  .mcount{margin-left:auto;font-weight:700;color:var(--brand)}
  .more{font-size:.66rem;color:var(--ink-soft);padding-left:.2rem}
  @media (max-width:640px){
    .mcell{min-height:3.6rem} .chipjob.small{font-size:.6rem}
    .mgrid{font-size:.9em}
  }

.recon{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap}
  .recon .lbl{font-size:.65rem;letter-spacing:.11em;text-transform:uppercase;
    font-weight:700;color:var(--ink-soft)}
  .recon .what{font-size:.8rem;color:var(--ink-soft)}
  .recon .eq{font-size:1.7rem;color:var(--ink-soft);align-self:center;line-height:1}
  .recon .gap{flex:1;min-width:0}
  button.figure{font:inherit;font-size:1.55rem;font-weight:700;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;background:none;border:none;padding:0;cursor:pointer;
    color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);
    text-underline-offset:3px;display:block}
  button.figure:hover{text-decoration-color:var(--brand)}
  button.figure:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  button.figure.ok{color:var(--ok)} button.figure.bad{color:var(--owed)}
  button.figure.open{text-decoration-style:dotted}
  .expand-body{margin-top:.8rem;padding-top:.7rem;border-top:1px solid var(--rule-soft)}
  .bank{display:grid;gap:.1rem}
  .brow{display:grid;grid-template-columns:1fr auto;gap:.2rem .9rem;
    padding:.3rem 0;border-bottom:1px solid var(--rule-soft);font-variant-numeric:tabular-nums}
  .brow > div:last-child{font-weight:650;white-space:nowrap}
  .brow.tot{border-top:2px solid var(--ink);border-bottom:none;font-weight:800;margin-top:.2rem}
  .brow.note2{border:none;font-size:.78rem;color:var(--ink-soft)}
  .brow.note2 > div:last-child{font-weight:400}
  .bdetail{grid-column:1 / -1;font-size:.78rem;color:var(--ink-soft);
    font-variant-numeric:tabular-nums}
  @media print{
    .recon .eq{color:#000}
    button.figure{text-decoration:none;color:#000!important}
    .expand-body[hidden]{display:none}
  }

.daynav{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
  .book{display:grid;gap:.5rem}
  .techcol{border:1px solid var(--rule);border-radius:6px;background:var(--card);overflow:hidden}
  .techcol h3{margin:0;padding:.5rem .8rem;background:var(--rule-soft);font-size:.82rem;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-family:inherit;font-weight:700}
  .slot{display:flex;gap:.6rem;padding:.45rem .8rem;border-top:1px solid var(--rule-soft);
    align-items:baseline;font-size:.88rem}
  .slot .hr{width:2.6rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .slot.free{color:var(--ink-soft)}
  .slot.job{cursor:pointer} .slot.job:hover{background:var(--brand-w)}
  .slot .who2{flex:1;min-width:0;font-weight:650}
  .slot.done .who2{text-decoration:none}

.sheet{background:#fff;color:#111;border:1px solid #333;border-radius:2px;padding:.7rem .8rem;
    font-size:.78rem;line-height:1.35;max-width:52rem;margin:0 auto}
  .sheet .band{background:#3a3a3a;color:#fff;text-align:center;font-weight:700;font-size:.66rem;
    letter-spacing:.08em;padding:.12rem;margin:.5rem -.8rem .4rem;text-transform:uppercase}
  .sheet .hdr{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
  .sheet .co{font-family:ui-serif,Georgia,serif;font-weight:700;font-size:1.05rem;line-height:1.05}
  .sheet .grid2{display:grid;gap:.2rem .8rem;grid-template-columns:1fr 1fr}
  .sheet .grid4{display:grid;gap:.15rem .6rem;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}
  .sheet .fld{border-bottom:1px solid #999;min-height:1.15rem}
  .sheet .lbl2{font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:#666}
  .box{display:flex;gap:.3rem;align-items:center;cursor:pointer;font-size:.74rem;
    min-height:2.75rem;padding:.25rem .35rem;border-radius:3px;margin-bottom:.2rem}
  .box:active{background:#e6efea}
   
  .box.dead{opacity:.55;cursor:default}
  .box.dead:active{background:none}
  .chk{width:.85rem;height:.85rem;border:1px solid #555;border-radius:2px;flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;font-size:.66rem;line-height:1}
  .chk{width:1.15rem;height:1.15rem;font-size:.85rem}
  .chk.on{background:#20302b;color:#fff}
  .money{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;margin-left:auto;max-width:15rem}

var MONTHS = ["January","February","March","April","May","June","July","August",
                "September","October","November","December"];
  var mLabel = function (w) { return MONTHS[w.m - 1] + (w.y !== new Date().getFullYear() ? " " + w.y : ""); };
   
  function monthsAgo(w) {
    var now = new Date();
    return (now.getFullYear() - w.y) * 12 + (now.getMonth() + 1 - w.m);
  }
   
  function dueLabel(w) {
    var gap = monthsAgo(w);
    if (gap > 0) return mLabel(w) + " — " + plural(gap, "month") + " ago";
    if (gap === 0) return mLabel(w) + " — this month";
    return mLabel(w) + " — next month";
  }
  function whenOf(w) {
    var g = monthsAgo(w);
    return g > 0 ? "late" : (g === 0 ? "now" : "next");
  }

function nextBox() {
    var now = new Date(), y = now.getFullYear(), m = now.getMonth() + 1;
    return m === 12 ? { y: y + 1, m: 1 } : { y: y, m: m + 1 };
  }
   
  function boxOf(box) {
    var n = nextBox();
    return { y: Number(box) <= n.m ? n.y : n.y - 1, m: Number(box) };
  }
   
  function boxesDue() {
    var onProgram = {}, lastBooked = {}, callIx = {}, recallIx = {}, out = [];
    S.programs.forEach(function (p) { onProgram[p.customer_id] = 1; });
     
    S.jobs.forEach(function (j) {
      if (!j.scheduled_date || j.status === "cancelled") return;
      var mk = j.scheduled_date.slice(0, 7);
      if (!lastBooked[j.property_id] || mk > lastBooked[j.property_id])
        lastBooked[j.property_id] = mk;
    });
     
    S.calls.forEach(function (x) {
      callIx[x.property_id + "|" + x.year + "-" + (x.month < 10 ? "0" + x.month : "" + x.month)] = x;
    });
    S.recalls.forEach(function (x) { recallIx[x.property_id] = x; });
    S.properties.forEach(function (p) {
      if (!p.month_box) return;
      var c = custById(p.customer_id);
      if (!c || c.inactive_reason) return;
      if (onProgram[p.customer_id] && p.is_primary) return;
      var w = boxOf(p.month_box);
      var mk = w.y + "-" + (w.m < 10 ? "0" + w.m : "" + w.m);
       
      var since = String(p.created_at || "").slice(0, 7);
      if (since && mk < since) return;
      w.when = whenOf(w);
      var key = p.id + "|" + mk;
       
      if (lastBooked[p.id] && lastBooked[p.id] >= mk) return;
      var call = callIx[key] || null;
       
      if (call && call.outcome === "declined") return;
      out.push({ p: p, c: c, w: w, call: call, recall: recallIx[p.id] || null });
    });
     
    return out.sort(function (a, b) {
      return (a.w.y * 12 + a.w.m) - (b.w.y * 12 + b.w.m) ||
        String(a.c.name).localeCompare(String(b.c.name));
    });
  }

async function saveOutcome(b, outcome, note) {
    var up = await sb.from("calls").upsert({
      property_id: b.p.id, year: b.w.y, month: b.w.m,
      outcome: outcome, note: note || null,
      called_at: new Date().toISOString(), called_by: S.me.id
    }, { onConflict: "property_id,year,month" }).select();
    if (up.error) throw explain(up.error);
    var tries = triesOf(b);
     
    if (outcome === "no-answer") {
      tries = tries + 1;
       
      var rc = await sb.from("recalls").upsert({
        property_id: b.p.id, attempts: tries, last_try: todayISO(),
        note: note || (b.recall ? b.recall.note : null)
      }, { onConflict: "property_id" }).select();
      if (rc.error) throw explain(rc.error);
    } else if (b.recall && Number(b.recall.attempts) > 0) {
       
      tries = 0;
      var rz = await sb.from("recalls").upsert({
        property_id: b.p.id, attempts: 0, last_try: todayISO(),
        note: note || b.recall.note
      }, { onConflict: "property_id" }).select();
      if (rz.error) throw explain(rz.error);
    }
     
    if (note) {
      await sb.from("notes").insert({
        related_table: "customers", related_id: b.c.id, user_id: S.me.id,
        kind: "call", text: note
      });
    }
    await reload(["calls"]);
    return tries;
  }

function isoOf(d) {
    var z = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }
  function startOfWeek(iso) {
    var d = new Date(iso + "T12:00:00");
    d.setDate(d.getDate() - d.getDay());           
    return isoOf(d);
  }
  function startOfMonth(iso) { return iso.slice(0, 7) + "-01"; }
  function addMonths(iso, n) {
    var d = new Date(startOfMonth(iso) + "T12:00:00");
    d.setMonth(d.getMonth() + n);
    return isoOf(d);
  }
  var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

var WINDOWS = [["am", "Morning"], ["pm", "Afternoon"]];
  function windowOf(j) {
    if (j.scheduled_window) return j.scheduled_window;
    if (j.scheduled_hour != null && j.scheduled_hour !== "")
      return Number(j.scheduled_hour) < 12 ? "am" : "pm";
    return null;
  }
  function windowHours(w) {
    var s = S.settings || {};
     
    return w === "am" ? [s.am_from || 9, s.am_to || 13] : [s.pm_from || 12, s.pm_to || 17];
  }
  function windowName(w) { return w === "am" ? "Morning" : w === "pm" ? "Afternoon" : "No window set"; }
  function windowText(w) {
    if (!w) return windowName(w);
    var hh = windowHours(w);
    return windowName(w) + " · " + hr12(hh[0]) + "–" + hr12(hh[1]);
  }
  var perWindow = function () {
    return (S.settings && S.settings.slots_per_tech_per_window) || 5;
  };
   
  var slotsOf = function (j) { return Math.max(1, Number(j.slots) || 1); };
   
  function slotMinutes() {
    var st = S.settings || {};
    var am = (Number(st.am_to || 13) - Number(st.am_from || 9));
    var per = Number(st.slots_per_tech_per_window) || 5;
    var mins = Math.round((am * 60) / per);
    return mins > 0 ? mins : 48;
  }
   
  function hoursText(slots) {
    var mins = Math.max(1, Number(slots) || 1) * slotMinutes();
    var q = Math.round(mins / 15) * 15;
    if (q <= 45) return "about " + q + " minutes";
    var h = Math.floor(q / 60), r = q % 60;
    if (h >= 8) return "the whole day";
    var word = h === 1 ? "an hour" : h + " hours";
    if (r === 0) return "about " + word;
    if (r === 30) return "about " + (h === 1 ? "an hour and a half" : h + "\u00bd hours");
    return "about " + word + " " + r + " minutes";
  }
   
  function slotsInWindow(j, w) {
    var n = slotsOf(j), start = windowOf(j);
    if (!start) return 0;
    if (start === "am") return w === "am" ? Math.min(n, 5) : Math.max(0, n - 5);
    return w === "pm" ? Math.min(n, 5) : 0;
  }
  var occupies = function (j, w) { return slotsInWindow(j, w) > 0; };
  var sumSlots = function (list, w) {
    return list.reduce(function (n, j) {
      return n + (w ? slotsInWindow(j, w) : slotsOf(j));
    }, 0);
  };
   
  var lastDay = function (j) { return j.end_date || j.scheduled_date; };
  var runsDays = function (j) {
    if (!j.scheduled_date || !j.end_date) return 1;
    return Math.round((new Date(j.end_date + "T12:00:00") -
                       new Date(j.scheduled_date + "T12:00:00")) / 864e5) + 1;
  };
  function runsOn(j, iso) {
    if (!j.scheduled_date) return false;
    return j.scheduled_date <= iso && iso <= lastDay(j);
  }
  var dayNumber = function (j, iso) {
    return Math.round((new Date(iso + "T12:00:00") -
                       new Date(j.scheduled_date + "T12:00:00")) / 864e5) + 1;
  };
   
  function sizeLabel(j, iso) {
    var bits = [];
    if (slotsOf(j) >= 10) bits.push("all day");
    else if (slotsOf(j) > 5) bits.push("morning + " + (slotsOf(j) - 5));
    else if (slotsOf(j) > 1) bits.push(slotsOf(j) + " slots");
    if (runsDays(j) > 1)
      bits.push(iso ? "day " + dayNumber(j, iso) + " of " + runsDays(j)
                    : runsDays(j) + " days");
    return bits;
  }
   
  var crewOf = function (jobId) {
    return S.crew.filter(function (c) { return c.job_id === jobId; })
      .map(function (c) { return c.tech_id; });
  };
  function techsOnJob(j) {
    var out = j.assigned_to ? [j.assigned_to] : [];
    crewOf(j.id).forEach(function (id) { if (out.indexOf(id) < 0) out.push(id); });
    return out;
  }
  var onJob = function (j, techId) { return techsOnJob(j).indexOf(techId) >= 0; };
  var crewNames = function (j, exceptId) {
    return techsOnJob(j).filter(function (id) { return id !== exceptId; })
      .map(function (id) { var pp = personOf(id); return pp ? pp.name.split(" ")[0] : "?"; });
  };
   
  function exactTime(j) {
    return j.scheduled_hour == null || j.scheduled_hour === "" ? "" : hr12(j.scheduled_hour);
  }

  function jobsOn(iso) {
    return S.jobs.filter(function (j) {
      return runsOn(j, iso) && j.status !== "cancelled";
    }).sort(function (a, b) {
      var wa = windowOf(a) === "pm" ? 1 : 0, wb = windowOf(b) === "pm" ? 1 : 0;
      if (wa !== wb) return wa - wb;
      return (a.scheduled_hour || 0) - (b.scheduled_hour || 0);
    });
  }

        route.span = "day"; localStorage.setItem("ut_span", "day");

function dayBook(d) {
    var T = techs(), cap = perWindow(), all = jobsOn(d);
    var h = "";

    WINDOWS.forEach(function (W) {
      var key = W[0];
      var inWin = all.filter(function (j) { return occupies(j, key); });
      var pool = inWin.filter(function (j) { return !techsOnJob(j).length; });
      var room = T.length * cap;
       
      var used = sumSlots(pool, key) + T.reduce(function (n, t) {
        return n + sumSlots(inWin.filter(function (j) { return onJob(j, t.id); }), key);
      }, 0);

      h += '<div class="winhdr"><h2>' + esc(windowText(key)) + "</h2>" +
        '<span class="pill' + (used > room ? " warn" : "") + '">' +
        used + " of " + room + "</span></div>";

if (pool.length)
        h += '<div class="techcol pool"><h3>Not given to anybody yet (' + pool.length + ")</h3>" +
          pool.map(function (j) { return slotRow(j, true); }).join("") + "</div>";

      h += '<div class="book" style="grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))">';
      T.forEach(function (t) {
        var his = inWin.filter(function (j) { return onJob(j, t.id); });
        var mine = sumSlots(his, key);
        h += '<div class="techcol"><h3>' + esc(t.name) +
          '<span class="cap' + (mine > cap ? " over" : "") + '">' +
          mine + " of " + cap + "</span></h3>" +
          (his.length ? his.map(function (j) { return slotRow(j); }).join("")
                      : '<div class="slot free"><span>nothing yet</span></div>') +
          "</div>";
      });
      h += "</div>";
    });

var noWin = all.filter(function (j) { return !windowOf(j); });
    if (noWin.length)
      h += '<div class="winhdr"><h2>No window set</h2>' +
        '<span class="pill warn">' + noWin.length + "</span></div>" +
        '<div class="techcol pool"><h3>Booked, but nobody said which half of the day</h3>' +
        noWin.map(function (j) { return slotRow(j, true); }).join("") + "</div>";
    return h;
  }
  function slotRow(j, withAssign) {
    var c = custById(j.customer_id), p = propOfJob(j), b = balOf(j.id);
    var ar = p ? areaOf(p.area_code) : null;
    var at = exactTime(j);
    return '<div class="slot job' + (j.status === "complete" ? " done" : "") + '" data-job="' + j.id + '">' +
      (at ? '<span class="hr">' + esc(at) + "</span>" : "") +
      '<span class="who2"><span class="dot" style="background:' +
      esc((ar && ar.dot_color) || "var(--dot)") + '"></span>' + esc(c ? c.name : "?") +
      (p && !p.is_primary ? ' <span class="pill">' + esc(p.label || "2nd") + "</span>" : "") +
      sizeLabel(j, route.date).map(function (x) {
        return ' <span class="pill">' + esc(x) + "</span>";
      }).join("") +
      '<div class="dates">' + esc((linesOf(j.id)[0] || {}).service_name || j.type) +
      (techsOnJob(j).length > 1 ? " · both of them" : "") + "</div></span>" +
      '<span style="text-align:right">' +
        (j.status === "complete"
          ? (b && Number(b.balance) > 0.004
              ? '<span class="pill warn">' + money(b.balance) + " owed</span>"
              : '<span class="pill ok">done</span>')
          : (j.status === "rained-out" ? '<span class="pill">🌧 rained out</span>'

function weekView(d) {
    var start = startOfWeek(d), today = todayISO();
    var room = techs().length * perWindow();
    var h = '<div class="week">';
    for (var i = 0; i < 7; i++) {
      var iso = shiftISO(start, i), js = jobsOn(iso);
      h += '<div class="wday' + (iso === today ? " istoday" : "") +
        (iso === d ? " picked" : "") + '" data-open="' + iso + '">' +
        '<div class="whdr"><b>' + DOW[i] + "</b> " + esc(fmtDate(iso)) +
        '<span class="wcount">' +
        (js.length
          ? WINDOWS.map(function (W) {
              var n = js.filter(function (j) { return windowOf(j) === W[0]; }).length;
              return n ? '<span class="' + (n > room ? "over" : "") + '">' +
                W[0].toUpperCase() + " " + n + "</span>" : "";
            }).filter(Boolean).join(" ") || js.length
          : "—") + "</span></div>";
      h += js.length
        ? js.map(function (j) {
            var c = custById(j.customer_id), t = personOf(j.assigned_to);
            var p = propOfJob(j), ar = p ? areaOf(p.area_code) : null;
            return '<div class="chipjob' + (j.status === "complete" ? " done" : "") +
              '" data-job="' + j.id + '">' +
              '<span class="dot" style="background:' + esc((ar && ar.dot_color) || "var(--dot)") + '"></span>' +
              "<b>" + esc(exactTime(j) || (windowOf(j) || "?").toUpperCase()) + "</b> " +
              esc(c ? c.name : "?") +
              (t ? ' <span class="who3">' + esc(t.name.slice(0, 1)) + "</span>" : "") +
              "</div>";
          }).join("")
        : '<div class="empty" style="font-size:.78rem">nothing booked</div>';
      h += "</div>";
    }
    return h + "</div>";
  }

function monthView(d) {
    var first = startOfMonth(d), today = todayISO();
    var gridStart = startOfWeek(first);
    var monthNum = first.slice(0, 7);
    var cells = [], i;
     
    for (i = 0; i < 42; i++) cells.push(shiftISO(gridStart, i));
    var total = S.jobs.filter(function (j) {
      return j.scheduled_date && j.scheduled_date.slice(0, 7) === monthNum && j.status !== "cancelled";
    }).length;

    var h = '<div class="daynav noprint" style="margin-top:-.4rem">' +
      '<span class="pill">' + plural(total, "job") + " booked this month</span>";
     
    var due = boxesDue().filter(function (b) {
      return b.w.y === Number(first.slice(0, 4)) && b.w.m === Number(first.slice(5, 7));
    });
    if (due.length)
      h += '<span class="pill warn">' + due.length + " due this month, not booked yet</span>";
    h += "</div>";

    h += '<div class="mgrid">' + DOW.map(function (n) {
      return '<div class="mhead">' + n + "</div>";
    }).join("");
    cells.forEach(function (iso) {
      var js = jobsOn(iso), inMonth = iso.slice(0, 7) === monthNum;
      h += '<div class="mcell' + (inMonth ? "" : " other") + (iso === today ? " istoday" : "") +
        (iso === d ? " picked" : "") + '" data-open="' + iso + '">' +
        '<div class="mnum">' + Number(iso.slice(8, 10)) +
        (js.length ? '<span class="mcount">' + js.length + "</span>" : "") + "</div>" +
        js.slice(0, 4).map(function (j) {
          var c = custById(j.customer_id);
          var p = propOfJob(j), ar = p ? areaOf(p.area_code) : null;
          return '<div class="chipjob small' + (j.status === "complete" ? " done" : "") +
            '" data-job="' + j.id + '">' +
            '<span class="dot" style="background:' + esc((ar && ar.dot_color) || "var(--dot)") + '"></span>' +
            esc(c ? c.name : "?") + "</div>";
        }).join("") +
        (js.length > 4 ? '<div class="more">+' + (js.length - 4) + " more</div>" : "") +
        "</div>";
    });
    return h + "</div>";
  }

function renderField() {
    var who = route.tech || S.me.id;
    var d = route.date;
    var mine = S.jobs.filter(function (j) {
      return onJob(j, who) && runsOn(j, d) && j.status !== "cancelled";
    }).sort(function (a, b) {
      var wa = windowOf(a) === "pm" ? 1 : 0, wb = windowOf(b) === "pm" ? 1 : 0;
      if (wa !== wb) return wa - wb;
      return (a.scheduled_hour || 0) - (b.scheduled_hour || 0);
    });

var carried = S.jobs.filter(function (j) {
      if (!onJob(j, who) || j.status === "complete" || j.status === "cancelled") return false;
      if (lastDay(j) >= d) return false;    
      return j.status === "rained-out" || !!sheetOf(j.id);
    });

var waiting = isOffice()
      ? S.jobs.filter(function (j) {
          return !j.assigned_to && j.scheduled_date === d && j.status !== "cancelled";
        }).sort(function (a, b) {
          var wa = windowOf(a) === "pm" ? 1 : 0, wb = windowOf(b) === "pm" ? 1 : 0;
          return wa - wb;
        })
      : [];

    var p = personOf(who) || S.me;
    var h = missingBanner() + '<div class="field">';
    h += "<h1>" + esc(p.name) + "’s day</h1>" +

      '<div class="daynav noprint">' +
        '<button class="act" data-day="-1" type="button">‹ ' + fmtDate(shiftISO(d, -1)) + "</button>" +
        '<button class="act" data-day="1" type="button">' + fmtDate(shiftISO(d, 1)) + " ›</button>" +
        (d !== todayISO() ? '<button class="act" data-day="0" type="button">Today</button>' : "") +
        (isOffice() && techs().length > 1
          ? techs().map(function (t) {
              return '<button class="act' + (t.id === who ? " go" : "") + '" data-tech="' + t.id + '">' +
                esc(t.name.split(" ")[0]) + "</button>";
            }).join("")
          : "") +
      "</div>";

    if (waiting.length)
      h += '<div class="card" style="border-left:4px solid var(--brand)">' +
        "<h2>Waiting to be given out (" + waiting.length + ")</h2>" +
        '<p class="note">Tap a name to give it out.</p>' +
        waiting.map(function (j) {
          var c = custById(j.customer_id), pr = propOfJob(j);
          var ar = pr ? areaOf(pr.area_code) : null;
          return '<div class="item"><div class="top">' +
            '<span class="dot" style="background:' + esc((ar && ar.dot_color) || "var(--dot)") + '"></span>' +
            '<span class="nm">' + esc(c ? c.name : "?") + "</span>" +
            '<span class="pill">' + esc(windowName(windowOf(j))) + "</span>" +
            (exactTime(j) ? '<span class="pill">at ' + esc(exactTime(j)) + "</span>" : "") +
            "</div>" +
            '<div class="why">' + esc(pr ? pr.address : "") + " · " +
            esc(linesOf(j.id).map(function (l) { return l.service_name; }).join(" + ") || j.type) +
            "</div>" +
            (crewNames(j, j.assigned_to).length
              ? '<div class="why"><b>Still on it: ' +
                esc(crewNames(j, j.assigned_to).join(", ")) +
                "</b> — open it to take them off</div>"
              : "") +
            '<div class="acts">' +
            techs().map(function (t) {
              return '<button class="act' + (t.id === S.me.id ? " go" : "") + '" data-take="' +
                j.id + "|" + t.id + '" type="button">' +
                (t.id === S.me.id ? "I’ll take it" : esc(t.name.split(" ")[0])) + "</button>";
            }).join("") +
            '<button class="act" data-job="' + j.id + '" type="button">Look at it</button>' +
            "</div></div>";
        }).join("") + "</div>";

    if (carried.length) {
      h += '<div class="card" style="border-left:4px solid var(--risk)"><h2>Still carrying</h2>' +

        carried.map(function (j) {
          var c = custById(j.customer_id), pr = propOfJob(j);
          var days = Math.round((new Date(d + "T12:00:00") - new Date(j.scheduled_date + "T12:00:00")) / 864e5);
          return '<div class="item tap" data-job="' + j.id + '"><div class="top">' +
            '<span class="nm">' + esc(c ? c.name : "?") + "</span>" +
            '<span class="pill">' + (j.status === "rained-out" ? "rained out" : "sheet written") + "</span>" +
            '<span class="amt">' + plural(days, "day") + " ago</span></div>" +
            '<div class="why">' + esc(pr ? pr.address : "") + "</div></div>";
        }).join("") + "</div>";
    }

    h += !mine.length
      ? '<div class="card"><p class="empty">Nothing booked for you this day.</p></div>'
      : mine.map(function (j) {
          var c = custById(j.customer_id), pr = propOfJob(j), b = balOf(j.id);
          var ar = pr ? areaOf(pr.area_code) : null;
          var sh = sheetOf(j.id), tr = trOf(j.id);
          var chips = [];
          if (sh && sh.signed_on) chips.push('<span class="pill ok">signed</span>');
          if (tr) chips.push('<span class="pill ok">record filed</span>');
          if (b && Number(b.collected) > 0)
            chips.push('<span class="pill ' + (Number(b.balance) > 0.004 ? "warn" : "ok") + '">' +
              (Number(b.balance) > 0.004 ? "part paid" : "paid") + "</span>");
          if (j.status === "complete") chips.push('<span class="pill ok">complete</span>');
          if (j.status === "rained-out") chips.push('<span class="pill">🌧 rained out</span>');
          return '<div class="item tap" data-job="' + j.id + '" style="border-left:4px solid ' +
            esc((ar && ar.dot_color) || "var(--brand)") + '">' +
            '<div class="top"><span class="nm">' +
            (exactTime(j) ? esc(exactTime(j)) + " · " : "") +
            esc(c ? c.name : "?") + "</span>" +
            '<span class="pill">' + esc(windowName(windowOf(j))) + "</span>" + chips.join(" ") +
            '<span class="amt">' + (b ? money(b.total) : "—") + "</span></div>" +
            '<div class="why">' + esc(pr ? pr.address : "") +
            (pr && !pr.is_primary ? " — <b>" + esc(pr.label || "second address") + ", not their own house</b>" : "") +
            "</div>" +
            '<div class="dates">' + esc(linesOf(j.id).map(function (l) { return l.service_name; }).join(" + ") || j.type) +
            " · " + esc(hoursText(slotsOf(j))) + "</div>" +
            (j.notes ? '<div class="dates">From the office: <b>' + esc(j.notes) + "</b></div>" : "") +
            "</div>";
        }).join("");
    h += "</div>" + stamp();
    app.innerHTML = h;
    app.querySelectorAll("[data-day]").forEach(function (b) {
      b.addEventListener("click", function () {
        route.date = b.dataset.day === "0" ? todayISO() : shiftISO(route.date, Number(b.dataset.day));
        renderField();
      });
    });
    app.querySelectorAll("[data-tech]").forEach(function (b) {
      b.addEventListener("click", function () { route.tech = b.dataset.tech; renderField(); });
    });
    app.querySelectorAll("[data-job]").forEach(function (b) {
      b.addEventListener("click", function () { jobModal(b.dataset.job); });
    });
    wireTake();
  }

function jobModal(jobId) {

    var c = custById(j.customer_id), p = propOfJob(j), b = balOf(j.id), inv = invOf(j.id);
    var sh = sheetOf(j.id), tr = trOf(j.id);
    var ls = linesOf(j.id);

    h += '<div class="card" style="margin:.9rem 0 0;background:var(--brand-w);border:none">' +

      '<div class="dates">' + (b ? money(b.total) + " with tax" +
         
        (inv && Number(inv.discount) > 0 ? " · after " + money(inv.discount) + " off" : "") +

      "</div></div>";

if (isOffice()) {
      var win = windowOf(j);
      h += '<div class="acts" style="margin-top:.9rem">' +

        (j.assigned_to
          ? '<button class="act" data-give="" type="button">Back to the pool</button>'
          : '<span class="pill warn">nobody yet</span>') +

      h += '<div class="acts" style="margin-top:.5rem">' +
        '<span class="minilbl">When</span>' +
        '<button class="act" id="mvBtn" type="button">Another day…</button>' +
        WINDOWS.map(function (W) {
          return win === W[0]
            ? '<span class="pill ok">' + esc(W[1]) + "</span>"
            : '<button class="act" data-win="' + W[0] + '" type="button">' + esc(W[1]) + "</button>";
        }).join("") +
        (exactTime(j) ? '<span class="pill">at ' + esc(exactTime(j)) + "</span>" : "") +
        "</div>";
       
      h += '<div class="acts" style="margin-top:.5rem">' +
        '<span class="minilbl">Takes</span>' +
        [1, 2, 3, 4, 5].map(function (n) {
          return slotsOf(j) === n
            ? '<span class="pill ok">' + n + (n === 1 ? " slot" : " slots") +
              " \u00b7 " + hoursText(n) + "</span>"
            : '<button class="act" data-slots="' + n + '" type="button" title="' +
              esc(hoursText(n)) + '">' + n + "</button>";
        }).join("") +
         
        (slotsOf(j) >= 10
          ? '<span class="pill ok">all day</span>'
          : '<button class="act" data-allday="1" type="button">All day</button>') +
        (slotsOf(j) > 5 && slotsOf(j) < 10
          ? '<span class="pill">morning + ' + (slotsOf(j) - 5) + " of the afternoon</span>" : "") +
        "</div>";
       
      h += '<div class="acts" style="margin-top:.5rem">' +
        '<span class="minilbl">Runs</span>' +
        [1, 2, 3, 4, 5].map(function (n) {
          return runsDays(j) === n
            ? '<span class="pill ok">' + plural(n, "day") + "</span>"
            : '<button class="act" data-days="' + n + '" type="button">' + n + "</button>";
        }).join("") +
        (runsDays(j) > 1
          ? '<span class="empty" style="font-size:.72rem">' +
            esc(fmtDate(j.scheduled_date)) + " to " + esc(fmtDate(lastDay(j))) + "</span>"
          : "") +
        "</div>";

var others = techs().filter(function (t) { return t.id !== j.assigned_to; });
      var crew = crewOf(j.id);
       
      var withIds = others.map(function (t) { return t.id; }).concat(
        crew.filter(function (cid) {
          return cid !== j.assigned_to && others.every(function (t) { return t.id !== cid; });
        }));
      if (withIds.length)
        h += '<div class="acts" style="margin-top:.5rem">' +
          '<span class="minilbl">With</span>' +
          (j.assigned_to
            ? withIds.map(function (tid) {
                var pp2 = personOf(tid), nm2 = pp2 ? pp2.name.split(" ")[0] : "somebody";
                return crew.indexOf(tid) >= 0
                  ? '<button class="act go" data-crew="off|' + tid + '" type="button">' +
                    esc(nm2) + " ✓</button>"
                  : '<button class="act" data-crew="on|' + tid + '" type="button">＋ ' +
                    esc(nm2) + "</button>";
              }).join("")
            : (crew.length
                ? crew.map(function (id) {
                    var pp = personOf(id);
                    return '<button class="act go" data-crew="off|' + id + '" type="button">' +
                      esc(pp ? pp.name.split(" ")[0] : "?") + " ✓ — take off</button>";
                  }).join("") +
                  '<span class="empty" style="font-size:.72rem">still on a job nobody ' +
                  "is holding — give it out, or take them off</span>"
                : '<span class="empty" style="font-size:.72rem">nobody yet, so nobody ' +
                  "second either</span>")) +
          (techsOnJob(j).length > 1
            ? '<span class="pill ok">both of them, ' + slotsOf(j) + " each</span>" : "") +
          "</div>";
    }

h += '<details style="margin-top:.7rem"><summary style="cursor:pointer;font-size:.86rem">' +
      "What happened here before</summary>" +
      '<div id="hxBox" style="margin-top:.5rem"><p class="empty">Reading the file\u2026</p></div>' +
      "</details>";

    h += '<div class="acts" style="margin-top:.7rem">' +
      (S.menu.length ? '<button class="act" data-act="addsvc">＋ Add a service</button>' : "") +
      (needsRecord ? '<button class="act' + (tr ? "" : " go") + '" data-act="record">' +
        (tr ? "Treatment record ✓" : "Fill the treatment record") + "</button>" : "") +
      '<button class="act' + (sh && sh.signed_on ? "" : " go") + '" data-act="sign">' +
        (sh && sh.signed_on ? "Signed ✓" : "Get a signature") + "</button>" +
       
      (b && (b.voided_at || b.charge_withdrawn)
        ? '<span class="pill warn">' +
          (b.voided_at ? "voided — never owed" : "charge withdrawn") + "</span>"
        : b && Number(b.balance) > 0.004
          ? '<button class="act go" data-act="pay">Take payment</button>'
          : '<span class="pill ok">nothing owed</span>') +
       
      (isOffice() && b && !b.voided_at && !b.charge_withdrawn
        ? '<button class="act" data-act="notowed">Not asking for it…</button>'
        : "") +
       
      (canDiscount(inv)
        ? '<button class="act" data-act="disc">' + discountLabel(inv) + "</button>"
        : "") +
      "</div>";

if (tr) {
      var recChems = chemsOf(tr.id);
      h += '<div class="why" style="margin-top:.55rem">' +
        "<b>On the record:</b> " +
        esc((tr.target_pests || []).join(", ") || "no pest named") + " · " +
        esc((tr.application_locations || []).join(", ") || "nowhere named") + " · " +
        (recChems.length
          ? esc(recChems.map(function (r) {
              return r.product_name + (r.amount ? " " + r.amount : "");
            }).join(", "))
          : "<b>no product</b>") + "</div>";
    }

    if (j.status !== "complete") {
      h += '<div class="row"><button class="primary" data-act="complete" type="button">Mark the job complete</button></div>';
      if (needsRecord && !tr)
        h += '<p class="note" style="margin-top:.5rem">The treatment record has to be filled in first — ' +
             "what was applied, how much, and where.</p>";
    } else {
      h += '<div class="msg good">Marked complete ' + fmtDate(j.completed_date) + "</div>";
    }
    h += '<div class="row"><button class="act" data-act="close" type="button">Close</button>' +
         (j.status === "scheduled"
           ? '<button class="act" data-act="rain" type="button">Rained out — keeping the sheet</button>' : "") +
         "</div>";

    openModal(h);
    houseHistory(j.customer_id, "hxBox");
    var A = function (n) { return $("modal").querySelector('[data-act="' + n + '"]'); };
    A("close").addEventListener("click", closeModal);
    A("sheet").addEventListener("click", function () { closeModal(); go("sheet", j.id); });
    if (A("addsvc")) A("addsvc").addEventListener("click", function () { addServiceModal(j); });

    if (A("pay")) A("pay").addEventListener("click", function () {

    $("modal").querySelectorAll("[data-win]").forEach(function (b) {

async function setCrew(j, techId, on, btn) {
    btn.disabled = true;
    try {

  function initSig(id) {
    var cv = $(id); if (!cv) return;
    SIG = { cv: cv, strokes: [] };
    drawSig();
    var drawing = false, cur = null;
    var pos = function (e) {
      var r = cv.getBoundingClientRect(), pt = (e.touches && e.touches[0]) || e;
      return { x: Math.round((pt.clientX - r.left) * (cv.width / r.width)),
               y: Math.round((pt.clientY - r.top) * (cv.height / r.height)) };
    };
    var down = function (e) { drawing = true; cur = []; SIG.strokes.push(cur);
      var p = pos(e); cur.push(p.x, p.y); e.preventDefault(); };
    var move = function (e) { if (!drawing) return; var p = pos(e);
      var n = cur.length;
      if (n && Math.abs(cur[n - 2] - p.x) < 2 && Math.abs(cur[n - 1] - p.y) < 2) return;
      cur.push(p.x, p.y); drawSig(); e.preventDefault(); };
    var up = function () { if (!drawing) return; drawing = false;
      if (cur && cur.length < 4) SIG.strokes.pop(); cur = null; drawSig(); };
    if (window.PointerEvent) {
      cv.onpointerdown = down; cv.onpointermove = move;
      cv.onpointerup = up; cv.onpointerleave = up; cv.onpointercancel = up;
    } else {
      cv.onmousedown = down; cv.onmousemove = move; cv.onmouseup = up;
      cv.ontouchstart = down; cv.ontouchmove = move; cv.ontouchend = up;
    }
  }
  function drawSig() {
    var cv = SIG.cv; if (!cv) return;
    var x = cv.getContext("2d");
    x.clearRect(0, 0, cv.width, cv.height);
    x.lineWidth = 3; x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#1c2321";
    SIG.strokes.forEach(function (s) {
      if (s.length < 4) return;
      x.beginPath(); x.moveTo(s[0], s[1]);
      for (var i = 2; i < s.length; i += 2) x.lineTo(s[i], s[i + 1]);
      x.stroke();
    });
  }
  function sigSVG(sig, w) {
    if (!sig) return "";
    if (typeof sig === "string")
      return '<img src="' + esc(sig) + '" alt="signature" style="max-width:' + w + 'px;background:#fff">';
    var st = (sig.strokes || []).filter(function (s) { return s && s.length >= 4; });
    if (!st.length) return "";
    return '<svg viewBox="0 0 ' + (sig.w || 600) + " " + (sig.h || 200) +
      '" style="width:100%;max-width:' + w + 'px;height:auto;background:#fff" aria-label="signature">' +
      st.map(function (s) {
        var pts = []; for (var i = 0; i < s.length; i += 2) pts.push(s[i] + "," + s[i + 1]);
        return '<polyline points="' + pts.join(" ") +
          '" fill="none" stroke="#1c2321" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
      }).join("") + "</svg>";
  }

      var found = matFound(chemRows);
      var list = S.products.filter(function (x) { return x.active !== false || found(x); });
      var blocks = chunk(list, 4), deep = 0, i, k, m, r, nm, ep, html = "";
      for (k = 0; k < blocks.length; k++)
        if (blocks[k].length > deep) deep = blocks[k].length;
      for (i = 0; i < deep; i++) {
        html += "<tr>";
        for (k = 0; k < 4; k++) {
          m = blocks[k] ? blocks[k][i] : null;
          if (!m) { html += "<td></td><td></td><td></td>"; continue; }
          r = found(m);
          nm = r ? (r.product_name || m.name) : m.name;
          ep = r ? r.epa_number : m.epa_number;
          html += "<td>" + esc((r && r.percent) || "") + "</td>" +
            '<td><div class="matname' + (r ? " on" : "") + '">' + chkBox(!!r) +
            "<span>" + esc(nm) +
            (ep ? '<span class="epa">EPA #' + esc(ep) + "</span>" : "") +
            "</span></div></td><td>" + esc((r && r.amount) || "") + "</td>";
        }
        html += "</tr>";
      }
      return html;
    }
    function matUsedRows(chemRows) {
      return '<tr><th style="width:3rem">%</th>' +
        "<th>Product / EPA registration #</th><th style=\"width:6rem\">Amount</th></tr>" +
        (chemRows.length
          ? chemRows.map(function (r) {
              return "<tr><td>" + esc(r.percent || "") + "</td><td>" + esc(r.product_name) +
                (r.epa_number ? " — EPA #" + esc(r.epa_number) : "") + "</td><td>" +
                esc(r.amount || "") + "</td></tr>";
            }).join("")
          : '<tr><td colspan="3" style="color:#666">No pesticide applied on this visit.</td></tr>');
    }
    function wireMaterials() {
      var tb = $("matBody"); if (!tb) return;
      tb.querySelectorAll("[data-mat]").forEach(function (el) {
        var fire = function () {
          var m = S.products.filter(function (x) { return x.id === el.getAttribute("data-mat"); })[0];
          if (m) tickWrite(el, function () { return fileMaterial(m, null, null); });
        };
        el.addEventListener("click", fire);
        el.addEventListener("keydown", function (e) {
          if (e.key === " " || e.key === "Enter") { e.preventDefault(); fire(); }
        });
      });
       
      tb.querySelectorAll("[data-filed]").forEach(function (el) {
        el.addEventListener("click", function () {
          var row = chems.filter(function (r) { return r.id === el.getAttribute("data-filed"); })[0];
          if (!row) return;
           
          if (sheetIsOpen(j)) untickChem(row, el, function () { renderSheet(j.id); });
          else voidChemModal(row, j, function () { renderSheet(j.id); });
        });
      });
      tb.querySelectorAll("[data-chem]").forEach(function (el) {
        el.addEventListener("change", async function () {
          el.disabled = true;
          var patch = {};
          patch[el.getAttribute("data-col")] = el.value.trim() || null;
          var r = await sb.from("treatment_chemicals").update(patch)
            .eq("id", el.getAttribute("data-chem")).select();
          el.disabled = false;
          if (r.error) { toast(explain(r.error).message); return; }
          if (!(r.data || []).length) {
            toast("That didn’t save — the sheet may be closed for changes."); return;
          }
           
          var saved = (r.data || [])[0] || {};
          var typed = el.value.trim();
          var col = el.getAttribute("data-col");
          var msg = "Saved";
          if (typed && col === "amount" && "amount_qty" in saved) {
            if (saved.amount_qty == null)
              msg = "Saved — but '" + typed + "' is not a quantity the yearly total can " +
                    "add up. '90 gal' or '1/4 gal' can be.";
            else if (saved.amount_unit == null)
              msg = "Saved — but there's no unit on it, so it's a number and not an " +
                    "amount. Add gal, oz or lb.";
          } else if (typed && col === "percent" && "percent_num" in saved &&
                     saved.percent_num == null) {
            msg = "Saved — but '" + typed + "' isn't a strength the record can report. " +
                  "A mix rate like '2 oz per gal' is not a %.";
          }
           
          toast(msg);
          await reload(["jobs"]);
          renderSheet(j.id);
        });
      });
    }
  }

var syncRow = function (n) {
      var sel = $("ciP" + n), box = $("ciC" + n);
      if (!sel || !box) return;
      var p = S.products.filter(function (x) { return x.id === sel.value; })[0];
      box.value = p ? (p.chemical_name || "") : "";
      box.readOnly = !!(p && btrimv(p.chemical_name));
    };
    var wireRow = function (n) {
      var sel = $("ciP" + n);
      if (sel) sel.addEventListener("change", function () { syncRow(n); });
      syncRow(n);
    };
    wireRow(1);

    $("ciAdd").addEventListener("click", function () {
      rows += 1;
      $("ciRows").insertAdjacentHTML("beforeend", rowHTML(rows));
      wireRow(rows);
    });
    $("ciNo").addEventListener("click", closeModal);
    $("ciGo").addEventListener("click", async function () {
      this.disabled = true;
      var btn = this;
      try {
        var when = $("ciWhen").value;
        if (!when) throw new Error("When is it being issued?");
        var list = [], i, n;
        for (n = 1; n <= rows; n++) {
          var sel = $("ciP" + n); if (!sel || !sel.value) continue;
          var p = S.products.filter(function (x) { return x.id === sel.value; })[0];
          var chem = btrimv($("ciC" + n).value);
          var on = $("ciD" + n).value;
          if (!chem)
            throw new Error("\u201c" + (p ? p.name : "That product") + "\u201d needs its " +
              "chemical name \u2014 the sheet prints it, and a disclosure that does not " +
              "name what is going down is not one. It is on the label.");
          if (!on)
            throw new Error("\u201c" + (p ? p.name : "That product") + "\u201d needs a " +
              "proposed date. The fourteen days are counted from it.");
          list.push({ product_id: p ? p.id : null, brand_name: p ? p.name : "",
                      chemical_name: chem, proposed_on: on, sort_order: list.length,
                      typed: !(p && btrimv(p.chemical_name)) });
        }
        if (!list.length) throw new Error("A sheet has to list at least one product.");

        var propSel = $("ciProp");
        var r = await sb.from("consumer_sheets").insert({
          customer_id: cid,
          property_id: propSel && propSel.value ? propSel.value : null,
          issued_on: when,
          given_how: $("ciHow").value,
          issued_by: S.me.id
        }).select();
        if (r.error) throw explain(r.error);
        var sheet = (r.data || [])[0];
        if (!sheet) throw new Error("That didn\u2019t save. Issuing a sheet is the office\u2019s to do.");

        var ri = await sb.from("consumer_sheet_items").insert(list.map(function (l) {
          return { sheet_id: sheet.id, product_id: l.product_id, brand_name: l.brand_name,
                   chemical_name: l.chemical_name, proposed_on: l.proposed_on,
                   sort_order: l.sort_order };
        })).select();
        if (ri.error) {
           
          var un = await sb.from("consumer_sheets").delete().eq("id", sheet.id).select();
          var stranded = !!(un.error || !(un.data || []).length);
          var why = explain(ri.error);
          throw new Error(why.message +
            (stranded
              ? " — and the empty sheet dated " + fmtDate(when) + " could not be " +
                "removed, which is an admin’s to do. Ask for it to be taken off."
              : ""));
        }

var stuck = 0, refused = 0;
        for (i = 0; i < list.length; i++) {
          if (!list[i].typed || !list[i].product_id) continue;
          var up = await sb.from("pesticide_products")
            .update({ chemical_name: list[i].chemical_name })
            .eq("id", list[i].product_id).select();
          if (up.error || !(up.data || []).length) refused += 1; else stuck += 1;
        }

        closeModal();
        await reload(["cis"]);
        await reloadLists();
        CISDOC = { cid: cid, id: sheet.id };
        toast("Sheet issued" +
          (stuck ? " \u00b7 " + plural(stuck, "chemical name") + " added to the product list" : "") +
          (refused ? " \u00b7 " + plural(refused, "chemical name") +
            " saved on this sheet only \u2014 an admin can add it to the product list" : ""));
        renderCIS(cid);
      } catch (e) { toast(e.message); btn.disabled = false; }
    });
  }

function cisTearModal(x, cid) {
    openModal("<h3>The signed portion</h3>" +
      '<p class="note">Issued ' + esc(fmtDate(x.issued_on)) + ". The date the " +
      "customer signed is the one on the slip; the date it came back is when it " +
      "reached the office. Either is enough for it to count as on file.</p>" +
      '<label for="ctSign">Customer signed on</label>' +
      '<input id="ctSign" class="f" type="date" value="' + esc(x.signed_on || "") + '">' +
      '<label for="ctBack">Reached the office</label>' +
      '<input id="ctBack" class="f" type="date" value="' + esc(x.returned_on || "") + '">' +
      '<div class="row"><button class="primary" id="ctGo" type="button">Save it</button>' +
      '<button class="act" id="ctNo" type="button">Leave it</button></div>');
    $("ctNo").addEventListener("click", closeModal);
    $("ctGo").addEventListener("click", async function () {
      this.disabled = true;
      try {
        var sg = $("ctSign").value || null, bk = $("ctBack").value || null;
        if (sg && sg < x.issued_on)

function parseCSV(text) {
    var rows = [], row = [], val = "", q = false, i = 0;
    text = String(text).replace(/^﻿/, "");           
    while (i < text.length) {
      var c = text.charAt(i);
      if (q) {
        if (c === '"') {
          if (text.charAt(i + 1) === '"') { val += '"'; i += 2; continue; }
          q = false; i++; continue;
        }
        val += c; i++; continue;
      }
      if (c === '"') { q = true; i++; continue; }
      if (c === ",") { row.push(val); val = ""; i++; continue; }
      if (c === "\r") { i++; continue; }
      if (c === "\n") { row.push(val); rows.push(row); row = []; val = ""; i++; continue; }
      val += c; i++;
    }
    if (val !== "" || row.length) { row.push(val); rows.push(row); }
     
    while (rows.length && rows[rows.length - 1].every(function (x) { return !String(x).trim(); }))
      rows.pop();
     
    rows.unterminated = q;
    return rows;
  }

var IMP_FIELDS = [
    ["name",        "Last name / how it is filed", true,  ["last", "name", "customer", "lastname"]],
    ["first_name",  "How they are addressed",      false, ["first", "salutation", "title", "firstname"]],
     
    ["street_no",   "Street number, if it has its own column", false, ["#", "streetno", "street no", "house no"]],
     
    ["address",     "Service address",             false, ["address", "street", "addr"]],
    ["city",        "Town",                        false, ["city", "town"]],
    ["state",       "State",                       false, ["state", "st"]],
    ["zip",         "Zip",                         false, ["zip", "postal", "zipcode"]],
    ["phone",       "Phone",                       false, ["phone", "tel", "home", "mobile", "cell"]],
    ["email",       "Email",                       false, ["email", "e-mail"]],
    ["bill_to",     "Billing address, if different", false, ["bill", "mailing", "owner"]],
    ["bill_city",   "Billing town, if different",  false, ["billcity", "billtown", "ownercity", "mailcity"]],
    ["bill_zip",    "Billing zip, if different",   false, ["billzip", "ownerzip", "mailzip"]],
    ["area_code",   "Community",                   false, ["area", "community", "code", "dev"]],
    ["month_box",   "Month box",                   false, ["month", "box", "mo"]],

  function guessColumn(header, want) {
    var h = header.map(function (x) { return String(x).toLowerCase().trim(); });
    for (var w = 0; w < want.length; w++) {
      for (var i = 0; i < h.length; i++) if (h[i] === want[w]) return i;
    }
    for (var w2 = 0; w2 < want.length; w2++) {
      for (var j = 0; j < h.length; j++) if (h[j].indexOf(want[w2]) >= 0) return j;
    }
    return -1;
  }

var AREA_ALIASES = {
    "HH": "HH", "HOLIDAY HEIGHTS": "HH",
    "HCS": "HCS", "HC8": "HCS", "HOLIDAY CITY SOUTH": "HCS",
    "HCW": "HCW", "HOLIDAY CITY WEST": "HCW",
    "HCC": "HCC", "HOLIDAY CITY CAREFREE": "HCC", "CAREFREE": "HCC",
    "HCB": "HCB", "HOLIDAY CITY BERKELEY": "HCB", "BERKELEY": "HCB",
    "SRPN": "SRPN", "SILVER RIDGE PARK NORTH": "SRPN",
    "SRPW": "SRPW", "SILVER RIDGE PARK WEST": "SRPW",
    "SRPE": "SRPE", "SILVER RIDGE PARK EAST": "SRPE",
    "WESTERLY": "Westerly", "SILVER RIDGE PARK WESTERLY": "Westerly",
    "SIL": "Sil", "SILVERTON": "Sil",
    "MAN": "Man", "MANCHESTER": "Man",
    "BRICK": "Brick", "BRICKTOWN": "Brick",
    "FR": "FR", "FORKED RIVER": "FR",
    "TR": "TR", "TOMS RIVER": "TR"
  };

function areaKey(raw) {
    return String(raw || "").toUpperCase().replace(/[^A-Z0-9 ]/g, " ")
      .replace(/\s+/g, " ").trim();
  }

function normalizeArea(raw, codes, names) {
    var k = areaKey(raw);
    if (!k) return null;
    var guess = AREA_ALIASES[k];
    if (guess && codes[areaKey(guess)]) return codes[areaKey(guess)];
    if (codes[k]) return codes[k];
    if (names[k]) return names[k];
    return null;
  }

function parseFtCode(svc) {
    var m = /(^|[^A-Za-z])FT\s*["”'’]?\s*(\d{2})(?:\s*(\d+)\s*y(?:rs?|ears?)?)?/i
      .exec(String(svc || ""));
    if (!m) return null;
    var term = m[3] ? parseInt(m[3], 10) : 0;
    return 'FT" ' + m[2] + (term ? " " + term + " yr" + (term > 1 ? "s" : "") : "");
  }

function parseYear(raw) {
    var s = String(raw || "").replace(/[^0-9]/g, "");
    if (s.length !== 2 && s.length !== 4) return null;
    var y = parseInt(s, 10);
    if (s.length === 2) y = y > 50 ? 1900 + y : 2000 + y;
    return y >= 1970 && y <= new Date().getFullYear() + 1 ? y : null;
  }

if (IMP.report) {

  function takeCSV(text, source) {
    var rows = parseCSV(text);
    if (rows.length < 2) { toast("That needs a heading row and at least one row under it."); return; }
     
    if (rows.unterminated) {
      toast("There is a quote mark “ in the file that is never closed, so the lines " +
            "after it ran together. Nothing was read. Open it in the spreadsheet, save " +
            "as CSV again, and try once more.");
      return;
    }
    var head = rows[0].map(function (x) { return String(x).trim(); });
    var map = {};
    IMP_FIELDS.forEach(function (f) { map[f[0]] = guessColumn(head, f[3]); });
     
    if (map.bill_to === map.address) map.bill_to = -1;
     
    if (map.service === map.address) map.service = -1;
    if (map.street_no === map.address) map.street_no = -1;
    if (map.state === map.name || map.state === map.first_name ||
        map.state === map.address) map.state = -1;
    IMP = { head: head, rows: rows.slice(1), map: map, source: source, report: null };
    IMP.report = checkImport();
    renderImport();
    window.scrollTo(0, 0);
  }

function checkImport() {
    var m = IMP.map, out = { create: [], dupe: [], bad: [], skip: [], gap: [], warn: [] };
    var pick = function (row, key) {
      var i = m[key];
      return i >= 0 && i < row.length ? String(row[i]).trim() : "";
    };
     
    var codes = {}, names = {};
    S.areas.forEach(function (a) {
      codes[areaKey(a.code)] = a.code;
      if (a.name) names[areaKey(a.name)] = a.code;
    });
    var here = {};
    S.customers.forEach(function (c) {
      var addr = (propsOf(c.id)[0] || {}).address || c.address || "";
      here[(c.name + "|" + addr).toLowerCase().replace(/\s+/g, " ")] = 1;
    });
    var seen = {}, badArea = {}, badMonth = 0, badYear = 0;

var NEEDED = [
      ["address",      "No column is the service address, so every row is filed " +
                       "under “(no street address yet)”."],
      ["month_box",    "No column is the month box. Nobody lands on a calling month " +
                       "— and the vendor rows cannot be found either, because the " +
                       "“zzzz” they are sorted with is in that column."],
      ["area_code",    "No column is the community. That is the calling order, the " +
                       "folder-dot colour and the price exceptions, for all of them."],
      ["service",      "No column is the SERVICE wording. The FT codes are read out " +
                       "of it, so no folder gets its ★, and nothing keeps what the " +
                       "list actually said."],
      ["year_started", "No column is the year they became a customer."],
      ["phone",        "No column is the phone number."],
      ["city",         "No column is the town."],
      ["zip",          "No column is the zip."]
    ];
    NEEDED.forEach(function (need) {
      if (m[need[0]] < 0)
        out.gap.push(need[1] + " Point it at one above if the file has it.");
    });

var ragged = [];
    IMP.rows.forEach(function (row, n) {
      if (row.length !== IMP.head.length) ragged.push(n + 2);
    });
    if (ragged.length) {
      out.warn.push(plural(ragged.length, "line") + " does not line up with the headings " +
        "(line " + ragged.slice(0, 5).join(", ") + (ragged.length > 5 ? "…" : "") +
        "). Check those lines in the spreadsheet before bringing this in.");
    }

    IMP.rows.forEach(function (row, n) {
      var name = pick(row, "name");
      if (!name) { out.bad.push(n + 2); return; }
      var rawM = pick(row, "month_box");

if (/z{2,}/i.test(rawM) || /^z{3,}/i.test(name)) {
        out.skip.push({ line: n + 2, name: name,
          why: "sorted to the bottom with “zzzz” — a vendor or a magazine" });
        return;
      }
      if (name.toUpperCase() === "AAA") {
        out.skip.push({ line: n + 2, name: name,
          why: "the placeholder at the top of the list" });
        return;
      }

var no = pick(row, "street_no"), addr = pick(row, "address");
      if (no && (!addr || addr.toLowerCase().indexOf(no.toLowerCase() + " ") !== 0))
        addr = addr ? no + " " + addr : no;

      var key = (name + "|" + addr).toLowerCase().replace(/\s+/g, " ");
      if (here[key]) { out.dupe.push(name); return; }
      if (seen[key]) { out.dupe.push(name); return; }
      seen[key] = 1;

      var rawArea = pick(row, "area_code");
      var area = normalizeArea(rawArea, codes, names);
      if (rawArea && !area) badArea[rawArea] = (badArea[rawArea] || 0) + 1;

      var mb = null;
      if (rawM) {
        var num = parseInt(rawM.replace(/[^0-9]/g, ""), 10);
        if (!num) {
          var idx = MONTHS.map(function (x) { return x.toLowerCase().slice(0, 3); })
            .indexOf(rawM.toLowerCase().slice(0, 3));
          if (idx >= 0) num = idx + 1;
        }
        if (num >= 1 && num <= 12) mb = num; else badMonth++;
      }

var svc = pick(row, "service");
      var ft = pick(row, "ft_code") || parseFtCode(svc);
      var rawY = pick(row, "year_started"), yr = parseYear(rawY);
      if (rawY && !yr) badYear++;

      out.create.push({
        name: name,
        first_name: pick(row, "first_name") || null,
        address: addr || null,
        city: pick(row, "city") || null,
        state: pick(row, "state") || null,
        zip: pick(row, "zip") || null,
        phone: pick(row, "phone") || null,
        email: pick(row, "email") || null,
        notes: pick(row, "notes") || null,
        legacy_service_text: svc || null,
        year_started: yr,
        bill_to: pick(row, "bill_to") || null,
        bill_city: pick(row, "bill_city") || null,
        bill_zip: pick(row, "bill_zip") || null,
        area_code: area,
        month_box: mb,
        ft_code: ft || null,
        had_full_treatment: !!ft
      });
    });

    Object.keys(badArea).forEach(function (k) {
      out.warn.push('Nothing matches the community "' + k + '" — ' +
        plural(badArea[k], "row") + " will come in without one. Add it under " +
        "Communities first if it should exist.");
    });
    if (badMonth) out.warn.push(plural(badMonth, "row") + " has a month box that is not " +
      "a month — it will come in without one.");
    if (badYear) out.warn.push(plural(badYear, "row") + " has a year that is not a year " +
      "— it comes in without one rather than with a made-up one.");
    if (out.skip.length) out.warn.push(plural(out.skip.length, "row") + " is not a " +
      "customer and will be left out. They are listed below — read them.");
    if (out.bad.length) out.warn.push(plural(out.bad.length, "row") +
      " has no name and will be left out (line " + out.bad.slice(0, 5).join(", ") +
      (out.bad.length > 5 ? "…" : "") + ").");
    var noAddr = out.create.filter(function (c) { return !c.address; }).length;
    if (noAddr) out.warn.push(plural(noAddr, "row") + " has no address — the customer is " +
      'brought in with "(no street address yet)" so it can be filled in later.');
    return out;
  }

async function runImport(btn) {
    btn.disabled = true;
    var list = IMP.report.create, done = 0, failed = [], PAGE_N = 100;
    var say = function (msg) { $("impProgress").innerHTML = '<div class="msg">' + msg + "</div>"; };
    say("Starting…");
    try {
      for (var start = 0; start < list.length; start += PAGE_N) {
        var batch = list.slice(start, start + PAGE_N);
        var ins = await sb.from("customers").insert(batch.map(function (c) {
           
          return { name: c.name, first_name: c.first_name, address: c.address,
                   city: c.city, state: c.state || "NJ", zip: c.zip,
                   phone: c.phone, email: c.email, notes: c.notes,
                   legacy_service_text: c.legacy_service_text,
                   year_started: c.year_started, created_by: S.me.id };
        })).select();
        if (ins.error) throw explain(ins.error);
        var made = ins.data || [];

var byKey = {};
        batch.forEach(function (c) {
          byKey[(c.name + "|" + (c.address || "")).toLowerCase()] = c;
        });
        var ids = made.map(function (x) { return x.id; });
        var props = await many(sb.from("properties").select("id,customer_id,address")
          .in("customer_id", ids).eq("is_primary", true));

var bills = [];
        made.forEach(function (cust) {
          var src = byKey[(cust.name + "|" + (cust.address || "")).toLowerCase()];
          if (src && src.bill_to && src.bill_to !== src.address)
             
            bills.push({ id: cust.id, name: cust.name, address: src.bill_to,
                         city: src.bill_city || src.city || null,
                         zip: src.bill_zip || src.zip || null });
        });
        if (bills.length) {
          var bu = await sb.from("customers").upsert(bills, { onConflict: "id" }).select();
          if (bu.error) failed.push("billing addresses: " + bu.error.message);
        }

var patch = [];
        props.forEach(function (pr) {
          var cust = made.filter(function (x) { return x.id === pr.customer_id; })[0];
          if (!cust) return;
          var src = byKey[(cust.name + "|" + (cust.address || "")).toLowerCase()];
          if (!src) return;
          patch.push({ id: pr.id, customer_id: pr.customer_id, address: pr.address,
                       is_primary: true, area_code: src.area_code,
                       month_box: src.month_box, ft_code: src.ft_code,
                       had_full_treatment: src.had_full_treatment });
        });
        if (patch.length) {
          var up = await sb.from("properties").upsert(patch, { onConflict: "id" }).select();
          if (up.error) failed.push("addresses: " + up.error.message);
        }

        done += made.length;
        say("Brought in <b>" + done + "</b> of " + list.length + "…");
      }
      S.customers = await all(function () { return sb.from("customers").select("*").order("name").order("id"); });
      S.properties = await all(function () { return sb.from("properties").select("*").order("id"); });
      say("<b>" + plural(done, "customer") + " brought in.</b>" +
        (failed.length
          ? " Some extras did not save: " + esc(failed.join("; ")) +
            " — the people are all here, check the Communities and month boxes."
          : " Communities, month boxes, FT codes, the year they started and the " +
            "SERVICE column’s own wording all came with them."));
      toast(plural(done, "customer") + " brought in");
      IMP = null;
    } catch (e) {
      say('<b style="color:var(--owed)">Stopped after ' + done + " of " + list.length +
        ".</b> " + esc(e.message) +
        "<br>The ones already brought in are here and will be skipped if you run it " +
        "again, so it is safe to fix the problem and start over.");
      btn.disabled = false;
    }
  }

              code = ctx.status || 0;
              var b = await ctx.json();
              said = (b && (b.error || b.message)) || "";
              kind = (b && b.code) || "";
            }
