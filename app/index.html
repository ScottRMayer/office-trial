var LET = null;    

  function letYear() { return route.year; }

  async function loadLetters(y) {
    var miss = function (e) {
       
      return e && (e.code === "42883" || e.code === "PGRST202" ||
                   /program_year|program_letter|does not exist|not find/i.test(e.message || ""));
    };
    var a = await sb.rpc("program_year", { p_year: y });
    if (a.error) {
      if (miss(a.error)) {
        LET = { year: y, visits: [], rows: [], tpl: {}, absent: true };
        return;
      }
      throw explain(a.error);
    }
    var b = await sb.rpc("program_letter", { p_year: y });
    if (b.error) throw explain(b.error);
    var t = await sb.from("templates").select("*");
    var tpl = {};
    (t.data || []).forEach(function (r) { tpl[r.key] = r; });
    LET = { year: y, visits: a.data || [], rows: b.data || [], tpl: tpl, at: new Date() };
  }

  function visitsFor(cid) {
    return LET.visits.filter(function (v) { return v.customer_id === cid; })
      .sort(function (x, y) { return x.month - y.month; });
  }

function fmtLetter(iso) {
    if (!iso) return "—";
    return new Date(iso + "T12:00:00").toLocaleDateString(undefined,
      { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  }
  function fmtShort(iso) {
    if (!iso) return "—";
    return new Date(iso + "T12:00:00").toLocaleDateString(undefined,
      { month: "short", day: "numeric" });
  }

  async function renderLetters() {
    if (!isOffice()) return renderDashboard();
    var y = letYear();
    if (!LET || LET.year !== y) {
      app.innerHTML = '<div class="msg">Laying out ' + y + "…</div>";
      try { await loadLetters(y); }
      catch (e) { app.innerHTML = '<div class="msg bad">' + esc(e.message) + "</div>"; return; }
    }

    var h = "<h1>The " + y + " schedule letters</h1>";

    if (LET.absent) {
      app.innerHTML = h + '<div class="msg warn"><b>The database cannot lay a year out yet.</b><br>' +
        "Run <code>supabase/migrations/0024_the_year_in_advance.sql</code> and reload. " +
        "Everything else works without it.</div>";
      return;
    }

    var rows = LET.rows;
    var needs = rows.filter(function (r) { return Number(r.needs_dates) > 0; });
    var gone  = rows.filter(function (r) { return r.inactive_reason; });
    var sent  = rows.filter(function (r) { return r.sent_at; });
    var ack   = rows.filter(function (r) { return r.acknowledged_on; });
     
    var ready = rows.filter(function (r) {
      return Number(r.needs_dates) === 0 && !r.inactive_reason;
    });
    var owed = rows.reduce(function (t, r) { return t + (Number(r.total) || 0); }, 0);
    var inBook = bookState(ready, y);

    h += '<div class="daynav noprint">' +
      '<button class="act" data-yr="-1" type="button">‹ ' + (y - 1) + "</button>" +
      '<b style="font-variant-numeric:tabular-nums">' + y + "</b>" +
      '<button class="act" data-yr="1" type="button">' + (y + 1) + " ›</button>" +
      '<span style="flex:1"></span>' +
      (ready.length
        ? '<button class="act go" id="printAll" type="button">Print ' +
          plural(ready.length, "letter") + "</button>"
        : "") +
      (ready.length
        ? ' <button class="act" id="bookYear" type="button">Put ' + y +
          " in the book</button>"
        : "") + "</div>";

var elsewhere = rows.filter(function (r) { return r.bill_to && !r.inactive_reason; });
    if (elsewhere.length)
      h += '<div class="msg warn"><b>' + plural(elsewhere.length, "letter") +
        " post to a different address than the one serviced</b> — " +
        elsewhere.map(function (r) { return esc(r.customer_name); }).join(", ") +
        ". Check the town on each customer record is the <b>mailing</b> town " +
        "before printing.</div>";

    h += '<div class="buckets" style="margin-bottom:.8rem">' +
      '<div class="bucket"><div class="lbl">On the programme</div><div class="amt">' +
        rows.length + '</div><div class="what">' + money(owed) + " for the year</div></div>" +
      (needs.length
        ? '<div class="bucket owed"><div class="lbl">Need a date chosen</div><div class="amt">' +
          needs.length + '</div><div class="what">a visit lands on a day nobody works</div></div>'
        : "") +
      '<div class="bucket call"><div class="lbl">Ready to post</div><div class="amt">' +
        ready.length + '</div><div class="what">dates settled</div></div>' +
      '<div class="bucket"><div class="lbl">Posted</div><div class="amt">' + sent.length +
        '</div><div class="what">' + ack.length + " called back</div></div>" +
       
      '<div class="bucket' + (inBook.done < inBook.want ? " risk" : "") + '">' +
        '<div class="lbl">In the book</div><div class="amt">' + inBook.done + "</div>" +
        '<div class="what">of ' + plural(inBook.want, "settled visit") +
        (inBook.done < inBook.want ? " — the rest are only on paper" : "") +
        "</div></div></div>";

    if (gone.length) {
      h += '<div class="msg warn"><b>' + plural(gone.length, "person") +
        " on the programme is marked as no longer a customer</b>, so no letter is " +
        "prepared for them: " +
        gone.map(function (r) {
          return esc(r.customer_name) + " (" + esc(r.inactive_reason) + ")";
        }).join(", ") +
        ". Take them off the programme, or clear the reason if they are back.</div>";

        "A customer joins it from their own record.</div>";
    } else {
      h += '<table class="lst"><tr><th>Customer</th><th>Where</th><th>The year</th>' +
        '<th class="r">Total</th><th>Where it stands</th><th></th></tr>' +
        rows.map(function (r) {
          var vs = visitsFor(r.customer_id);
          var blocked = Number(r.needs_dates) > 0 || !!r.inactive_reason;
          var status = r.acknowledged_on
            ? '<span class="pill ok">called back ' + esc(fmtShort(r.acknowledged_on)) + "</span>"
            : (r.sent_at
                ? '<span class="pill">posted</span>'
                : (blocked ? '<span class="pill bad">not ready</span>'
                           : '<span class="pill">ready</span>'));
          return '<tr class="lrow' + (blocked ? " blocked" : "") + '">' +
            "<td><b>" + esc(r.customer_name) + "</b>" +
              (r.first_name ? '<div class="why">' + esc(r.first_name) + "</div>" : "") + "</td>" +
            "<td>" + esc(r.service_address) +
              '<div class="why">' + esc(r.area_name || r.area_code || "no community") +
              (r.bill_to ? " · bill to " + esc(r.bill_to) : "") + "</div></td>" +
            "<td>" + vs.map(function (v) {
                return '<button class="datechip" type="button" data-pick="' + v.customer_id +
                  '|' + v.month + '" title="' + esc(fmtLetter(v.visit_date)) + '">' +
                  esc(fmtShort(v.visit_date)) +
                  (v.needs_a_date ? " ⚠" : (v.moved ? " ✎" : "")) + "</button>";
              }).join(" · ") +
              (vs.some(function (v) { return v.extras && v.extras.length; })
                ? '<div class="why">with ' + esc(vs.reduce(function (a, v) {
                    return a.concat(v.extras || []); }, []).join(", ")) + "</div>"
                : "") + "</td>" +
            '<td class="r">' + money(r.total) +
              '<div class="why">' + money(r.subtotal) + " + " + money(r.tax) + " tax</div></td>" +
            "<td>" + status + "</td>" +
            '<td class="r"><button class="act" data-see="' + r.customer_id + '" type="button">' +
              "Read it</button>" +
              (blocked ? "" :
                (r.sent_at
                  ? (r.acknowledged_on ? ""
                      : ' <button class="act" data-ack="' + r.customer_id + '" type="button">They called</button>')
                  : ' <button class="act go" data-sent="' + r.customer_id + '" type="button">Posted</button>')) +

var BOOK_ODD = [];

  async function bookYearRun(make, svc, btn) {
    btn.disabled = true;
    BOOK_ODD = [];
    var y = LET.year, put = 0, skipped = 0, failed = 0;
     
    var promised = {};
    make.forEach(function (m) { promised[m.r.customer_id] = m.r; });
    var say = function (m) { $("byProgress").innerHTML = '<p class="note">' + m + "</p>"; };

    for (var i = 0; i < make.length; i += 100) {
      var chunk = make.slice(i, i + 100);
      say("Putting " + (i + 1) + "–" + Math.min(i + 100, make.length) +
          " of " + make.length + " in…");
      var jobs = chunk.map(function (m) {
        var pg = progOf(m.r.customer_id) || {};
        return {
          customer_id: m.r.customer_id,
          property_id: pg.property_id ||
            ((propsOf(m.r.customer_id).filter(function (p) { return p.is_primary; })[0] || {}).id) || null,
          type: "recurring-service",
          status: "scheduled",
          scheduled_date: m.v.visit_date,
          scheduled_window: pg.preferred_window || "am",
          scheduled_hour: pg.preferred_hour || null,
          slots: 1,
           
          assigned_to: null,
          notes: pg.letter_note || null,
          from_program: true,
          program_year: y,
          program_month: m.v.month,
          created_by: S.me.id
        };
      });

      var r = await sb.from("jobs").insert(jobs).select();
      if (r.error) {
         
        if (r.error.code === "23505") {
          for (var k = 0; k < jobs.length; k++) {
            var one = await sb.from("jobs").insert(jobs[k]).select();
            if (one.error) {
              if (one.error.code === "23505") skipped++; else failed++;
              continue;
            }
            put++;
            await bookYearLines((one.data || [])[0], chunk[k], svc);
          }
          continue;
        }
        say("Stopped after " + put + ": " + esc(explain(r.error).message));
        btn.disabled = false;
        await reload(["jobs", "money"]);
        return;
      }
      var made = r.data || [];
      for (var n = 0; n < made.length; n++) {
        put++;
        await bookYearLines(made[n], chunk[n], svc);
      }
    }

    await reload(["jobs", "money", "attention"]);
    LET = null;
    closeModal();
    if (BOOK_ODD.length) {
       
      toast(plural(BOOK_ODD.length, "extra") + " went in without a price and " +
        "was left off: " + BOOK_ODD.slice(0, 3).map(function (o) {
          return o.name + " " + fmtShort(o.when) + " (" + o.label + ")";
        }).join(", ") + (BOOK_ODD.length > 3 ? " and more" : "") +
        ". Check those visits before they are worked.");
    } else {
      toast(plural(put, "job") + " in the book for " + y +
        (skipped ? " · " + skipped + " were already there" : "") +
        (failed ? " · " + failed + " would not save" : ""));
    }
    renderLetters();
  }

async function bookYearLines(job, m, svc) {
    if (!job) return;
    var pg = progOf(m.r.customer_id) || {};
    var per = pg.base_price == null
      ? Number((S.settings || {}).program_price || 65) : Number(pg.base_price);
    var lines = [{
      job_id: job.id,
      service_id: svc ? svc.id : null,
      service_name: svc ? svc.name : "Pest Control Service - Pre-Scheduled Program",
      price: per,
      sort_order: 1
    }];
     
    (m.v.extras || []).forEach(function (label, i) {
      var e = S.progExtras.filter(function (x) {
        return x.customer_id === m.r.customer_id &&
               Number(x.month) === Number(m.v.month) && x.label === label;
      })[0];
      var cat = S.catalog.filter(function (x) { return x.name === label; })[0];
       
      if (!e) {
        BOOK_ODD.push({ name: m.r.customer_name, when: m.v.visit_date, label: label });
        return;
      }
      lines.push({ job_id: job.id, service_id: cat ? cat.id : null,
                   service_name: label, price: Number(e.price) || 0, sort_order: i + 2 });
    });
    var lr = await sb.from("job_lines").insert(lines);
    if (lr.error) {
       
      toast("A visit went in without its price — open " + fmtShort(m.v.visit_date) +
            " for " + m.r.customer_name + " and add the service.");
    }
  }

var exList = [];

    });
    var exRows = [], exSum = 0, exKnown = true;
    (function () {

        });
      });
      exRows = order.map(function (k) { return seen[k]; });

      "</div>";

var out = esc(body);

    }).join("");

    var when = new Date(LET.year - 1, 10, 1);    
     
    var lines = function (parts) {

    return '<div class="letter">' +

        "</div></div>" +
      '<div class="lto">' + esc(when.toLocaleDateString(undefined,
          { month: "long", day: "numeric", year: "numeric" })) + "<br><br>" +
        "<b>" + esc(r.first_name || r.customer_name) + "</b><br>" +
         
        (function () {

          return lines([r.bill_to || r.service_address,

        })() + "</div>" +
       
      out + "</div>";

function addrLine(street, city, state, zip) {

    if (zip && String(zip).trim()) townish = (townish ? townish + " " : "") + zip;

function printBlock(holderId, cls, html) {
    $(holderId).innerHTML = html;
    document.body.classList.add(cls);
    var off = function () {
      document.body.classList.remove(cls);
      $(holderId).innerHTML = "";
      window.removeEventListener("afterprint", off);
    };
    window.addEventListener("afterprint", off);
    window.print();
     
    setTimeout(function () { if (document.body.classList.contains(cls)) off(); }, 2000);
  }
  function printLetters(rows) {
    if (!rows.length) { toast("Nothing is ready to print."); return; }
    printBlock("letterPrint", "letters", rows.map(letterHTML).join(""));

var LABELS_PER_SHEET = 30;               

function labelYear(m) {
    var now = new Date();
    return Number(m) >= now.getMonth() + 1 ? now.getFullYear() : now.getFullYear() + 1;
  }
  var addrKey = function (s) {
    return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]/g, "");
  };
   
  function mailTo(c, p) {
    if (c.address && addrKey(c.address) !== addrKey(p.address))
      return { street: c.address, city: c.city, state: c.state, zip: c.zip };
    return { street: p.address || c.address, city: p.city || c.city,
             state: c.state, zip: p.zip || c.zip };
  }

  function labelRows(m) {
    var onProgram = {}, out = [];
    S.programs.forEach(function (p) { onProgram[p.customer_id] = 1; });
    S.properties.forEach(function (p) {
      if (Number(p.month_box) !== Number(m)) return;
      var c = custById(p.customer_id);
       
      if (!c || c.inactive_reason) return;
       
      if (onProgram[p.customer_id] && p.is_primary) return;
      out.push({ p: p, c: c, ar: areaOf(p.area_code), to: mailTo(c, p) });
    });
     
    return out.sort(function (a, b) {
      return ((a.ar ? Number(a.ar.route_order) : 999) - (b.ar ? Number(b.ar.route_order) : 999)) ||
        String(a.p.area_code || "").localeCompare(String(b.p.area_code || "")) ||
        String(a.p.address || "").localeCompare(String(b.p.address || ""));
    });
  }

  function labelHTML(r) {
     
    return '<div class="lcell"><div class="lnm">' +
      esc((r.c.first_name ? r.c.first_name + " " : "") + r.c.name) + "</div><div>" +
      esc(r.to.street) + "</div><div>" +
      esc(addrLine("", r.to.city, r.to.state || "NJ", r.to.zip)) + "</div></div>";
  }
   
  function labelSheets(rows) {
    var out = "", i;
    for (i = 0; i < rows.length; i += LABELS_PER_SHEET) {
      out += '<div class="lsheet"><div class="lgrid">' +
        rows.slice(i, i + LABELS_PER_SHEET).map(labelHTML).join("") + "</div></div>";
    }

var SNAP_BUCKET = "job-photos";

async function shrinkImage(file, maxPx) {
    var url = URL.createObjectURL(file);
    try {
      var img = await new Promise(function (ok, bad) {
        var i = new Image();
        i.onload = function () { ok(i); };
        i.onerror = function () { bad(new Error("That file is not an image the browser can read.")); };
        i.src = url;
      });
      var w = img.naturalWidth, hh = img.naturalHeight;
      var scale = Math.min(1, maxPx / Math.max(w, hh));
      var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(hh * scale));
      var cv = document.createElement("canvas");
      cv.width = cw; cv.height = ch;
      cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
      var blob = await new Promise(function (ok) { cv.toBlob(ok, "image/jpeg", 0.82); });
       
      return blob || file;
    } finally { URL.revokeObjectURL(url); }
  }

    var up = String(a || "").toUpperCase()
      .replace(/[.,#]/g, " ")
      .replace(/\s+/g, " ").trim();
    var bits = up.split(" ");
    var num = "";
    if (bits.length && /^\d+[A-Z]?$/.test(bits[0])) num = bits.shift();
    var core = bits.filter(function (b) {
      return ST_TYPES.indexOf(b) < 0 && DIRS.indexOf(b) < 0 && b !== "";
    }).join(" ");
     
    core = core.replace(/^(MT|MOUNT|ST|SAINT)\s+/, "");
    return { num: num, core: core, whole: up };
  }

  function sameAddress(a, b) {
    var x = addrParts(a), y = addrParts(b);
    return x.num === y.num && x.core === y.core && x.num !== "";
  }

async function esri(url, params) {
    var body = new URLSearchParams();
    Object.keys(params).forEach(function (k) { body.append(k, params[k]); });
    body.append("f", "json");
    var r = await fetch(url, { method: "POST", body: body,
      headers: { "Content-Type": "application/x-www-form-urlencoded" } });
    if (!r.ok) throw new Error("The map service did not answer (" + r.status + ").");
    var j = await r.json();
    if (j.error) throw new Error(j.error.message || "The map service refused that.");
    return j;
  }

  function sqlLit(v) { return String(v).replace(/'/g, "''"); }

function inRing(x, y, ring) {
    var inside = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
   
  function ringAreaSqFt(ring) {
    var FT_PER_DEG_LAT = 364000;
    var lat0 = ring.reduce(function (t, q) { return t + q[1]; }, 0) / ring.length;
    var ftLon = FT_PER_DEG_LAT * Math.cos(lat0 * Math.PI / 180);
    var a = 0;
    for (var i = 0; i < ring.length - 1; i++) {
      var x1 = ring[i][0] * ftLon, y1 = ring[i][1] * FT_PER_DEG_LAT;
      var x2 = ring[i + 1][0] * ftLon, y2 = ring[i + 1][1] * FT_PER_DEG_LAT;
      a += x1 * y2 - x2 * y1;
    }
    return Math.abs(a) / 2;
  }

  function ringCentroid(ring) {
    var x = 0, y = 0, n = 0;
    ring.forEach(function (p) { x += p[0]; y += p[1]; n++; });
    return [x / n, y / n];
  }

function measureDoubts(lot, bldg, assessed, drawn, candidates, pin) {
    var why = [];
    var bits = String(pin == null ? "" : pin).split("_");
     
    if (candidates > 1)
      why.push(candidates + " parcel records could be this address");
    if (bits.length > 3 && String(bits[3]).replace(/\s/g, "") !== "")
      why.push("the tax record carries a unit qualifier, so this is one unit of several");
    if (lot && bldg && bldg > lot * 0.45)
      why.push("the outline covers over 45% of the lot, which usually means a whole attached block");
    if (assessed && drawn && Math.abs(assessed - drawn) > assessed * 0.2)
      why.push("the tax record and the drawn lot disagree by more than a fifth");
    if (lot && bldg && bldg < lot * 0.08)
      why.push("the outline is under 8% of the lot, so it is taking in common land or the wrong building");
    return why.length ? why.join(" \u00b7 ") : null;
  }

async function measureByText(addr) {
    var want = addrParts(addr);
    if (!want.num || !want.core) {
      return { found: false, why: "That address has no house number to match on." };
    }
    var muni = TOWNSHIPS.map(function (m) { return "PAMS_PIN LIKE '" + m + "%'"; }).join(" OR ");
    var pj = await esri(PARCELS, {
      where: "(" + muni + ") AND UPPER(ST_ADDRESS) LIKE '" + sqlLit(want.num) +
             " %" + sqlLit(want.core) + "%'",
      geometry: THEIR_BOX, geometryType: "esriGeometryEnvelope", inSR: "4326",
      spatialRel: "esriSpatialRelIntersects",
      outFields: "ST_ADDRESS,CALC_ACRE,LAND_DESC,PAMS_PIN,BLDG_DESC",
      returnGeometry: "true", outSR: "4326", resultRecordCount: "25"
    });
    var cands = pj.features || [];
    if (!cands.length) {
      return { found: false, why: "Neither the state's address list nor the tax records " +
        "have that address in Manchester, Berkeley or Toms River. Check the spelling, " +
        "or put the figures in by hand." };
    }
    var exact = cands.filter(function (f) { return sameAddress(f.attributes.ST_ADDRESS, addr); });
    var pick = exact.length === 1 ? exact[0] : cands[0];
    var at = pick.attributes;
    var ring = (pick.geometry && pick.geometry.rings && pick.geometry.rings[0]) || null;
    var assessed = Math.round((Number(at.CALC_ACRE) || 0) * 43560) || null;
    var drawn = ring ? Math.round(ringAreaSqFt(ring)) : null;

    var out = {
      found: true, lot_sq_ft: assessed || drawn, bldg_sq_ft: null,
      lot_assessed: assessed, lot_drawn: drawn,
      matched_address: at.ST_ADDRESS || null, matched_parcel: at.PAMS_PIN || null,
       
      confidence: exact.length === 1 && cands.length === 1 ? "likely" : "uncertain",
      candidates: cands.length, lot_desc: at.LAND_DESC || null,
      bldg_desc: at.BLDG_DESC || null, buildings: 0,
      geocoded_to: null, geocode_score: 0, point_on_building: false,
      by_text: true
    };
    if (!ring) { out.confidence = "uncertain"; return out; }

    var xs = ring.map(function (q) { return q[0]; });
    var ys = ring.map(function (q) { return q[1]; });
    var pad = 0.00005;
    var box = [Math.min.apply(null, xs) - pad, Math.min.apply(null, ys) - pad,
               Math.max.apply(null, xs) + pad, Math.max.apply(null, ys) + pad].join(",");
    var sj = await esri(STRUCTS, {
      geometry: box, geometryType: "esriGeometryEnvelope", inSR: "4326",
      spatialRel: "esriSpatialRelIntersects", where: "1=1",
      outFields: "PROP_ADDR,SQFEET,PRIM_OCC,OCC_CLS",
      returnGeometry: "true", outSR: "4326"
    });
    var homes = [];
    (sj.features || []).forEach(function (f) {
      var r0 = f.geometry && f.geometry.rings && f.geometry.rings[0];
      if (!r0) return;
      var c = ringCentroid(r0);
      if (inRing(c[0], c[1], ring)) homes.push(f.attributes);
    });
    homes.sort(function (a, b) { return Number(b.SQFEET) - Number(a.SQFEET); });
    out.buildings = homes.length;
    if (homes.length) {
      out.bldg_sq_ft = Math.round(Number(homes[0].SQFEET));
      out.bldg_addr = homes[0].PROP_ADDR || null;
      out.bldg_use = homes[0].PRIM_OCC || null;
       
      if (homes.length > 1) out.confidence = "uncertain";
      out.doubt = measureDoubts(out.lot_sq_ft, out.bldg_sq_ft, assessed, drawn,
                                cands.length, at.PAMS_PIN);
      if (out.doubt) out.confidence = "uncertain";
    } else {
      out.confidence = "uncertain";
    }
    return out;
  }

  async function measureAddress(addr, city, zip) {
    var want = addrParts(addr);
    if (!want.num) throw new Error("That address has no house number to look up.");
     
    var line = [addr, city || "", "NJ", zip || ""].filter(function (x) {
      return String(x).trim();
    }).join(", ");

var gj = await esri(NJGEO, { SingleLine: line, outSR: "4326", maxLocations: "3" });
    var cand = (gj.candidates || [])[0];
     
    if (!cand || !cand.location) return await measureByText(addr);
    var pt = { x: cand.location.x, y: cand.location.y, spatialReference: { wkid: 4326 } };
    var score = Number(cand.score) || 0;

var pj = await esri(PARCELS, {
      geometry: JSON.stringify(pt), geometryType: "esriGeometryPoint", inSR: "4326",
      spatialRel: "esriSpatialRelIntersects",
      outFields: "ST_ADDRESS,CALC_ACRE,LAND_DESC,PAMS_PIN,BLDG_DESC",
      returnGeometry: "true", outSR: "4326"
    });
    var cands = pj.features || [];
     
    if (!cands.length) return await measureByText(addr);
    var pick = cands[0];
     
    var confidence = score >= 99 ? "exact" : (score >= 90 ? "likely" : "uncertain");
     
    if (TOWNSHIPS.indexOf(String(pick.attributes.PAMS_PIN || "").slice(0, 4)) < 0)
      confidence = "uncertain";
     
    if (confidence === "exact" && !(Number(pick.attributes.CALC_ACRE) > 0)) confidence = "likely";

    var at = pick.attributes;
    var ring = (pick.geometry && pick.geometry.rings && pick.geometry.rings[0]) || null;
    var assessed = Math.round((Number(at.CALC_ACRE) || 0) * 43560) || null;
    var drawn = ring ? Math.round(ringAreaSqFt(ring)) : null;
     
    var lot = assessed || drawn;

    var out = {
      found: true,
      lot_sq_ft: lot,
      bldg_sq_ft: null,
      lot_assessed: assessed,
      lot_drawn: drawn,
      matched_address: at.ST_ADDRESS || null,
      matched_parcel: at.PAMS_PIN || null,
      confidence: confidence,
      candidates: cands.length,
      lot_desc: at.LAND_DESC || null,
      bldg_desc: at.BLDG_DESC || null,
      buildings: 0,
      geocoded_to: cand.address || null,
      geocode_score: score,
      point_on_building: false
    };
    if (!ring) { out.confidence = "uncertain"; return out; }

var sj = await esri(STRUCTS, {
      geometry: JSON.stringify(pt), geometryType: "esriGeometryPoint", inSR: "4326",
      spatialRel: "esriSpatialRelIntersects", where: "1=1",
      outFields: "PROP_ADDR,SQFEET,PRIM_OCC,OCC_CLS",
      returnGeometry: "false", outSR: "4326"
    });
    var homes = (sj.features || []).map(function (f) { return f.attributes; })
      .filter(function (a) { return Number(a.SQFEET) > 0; })
      .sort(function (a, b) { return Number(b.SQFEET) - Number(a.SQFEET); });
    out.point_on_building = homes.length > 0;

if (!homes.length && ring) {
      var xs = ring.map(function (q) { return q[0]; });
      var ys = ring.map(function (q) { return q[1]; });
      var pad = 0.00005;
      var box = [Math.min.apply(null, xs) - pad, Math.min.apply(null, ys) - pad,
                 Math.max.apply(null, xs) + pad, Math.max.apply(null, ys) + pad].join(",");
      var s2 = await esri(STRUCTS, {
        geometry: box, geometryType: "esriGeometryEnvelope", inSR: "4326",
        spatialRel: "esriSpatialRelIntersects", where: "1=1",
        outFields: "PROP_ADDR,SQFEET,PRIM_OCC,OCC_CLS",
        returnGeometry: "true", outSR: "4326"
      });
      (s2.features || []).forEach(function (f) {
        var r0 = f.geometry && f.geometry.rings && f.geometry.rings[0];
        if (!r0) return;
        var c = ringCentroid(r0);
        if (inRing(c[0], c[1], ring)) homes.push(f.attributes);
      });
      homes.sort(function (a, b) { return Number(b.SQFEET) - Number(a.SQFEET); });
      if (homes.length) out.confidence = "uncertain";
    }
    out.buildings = homes.length;
    if (homes.length) {
      out.bldg_sq_ft = Math.round(Number(homes[0].SQFEET));
      out.bldg_addr = homes[0].PROP_ADDR || null;
      out.bldg_use = homes[0].PRIM_OCC || null;
       
      out.doubt = measureDoubts(lot, out.bldg_sq_ft, assessed, drawn,
                                cands.length, at.PAMS_PIN);
      if (out.doubt) out.confidence = "uncertain";
    } else {
      out.confidence = "uncertain";
    }
    return out;
  }

  function sqft(n) {
    return n == null ? "—" : Number(n).toLocaleString() + " sq ft";
  }

var BASIS_LABEL = { yard_sq_ft: "Yard", bldg_sq_ft: "Building footprint",
                      crawl_sq_ft: "Crawl space" };
  function areaFor(p, basis) {
    if (!p || !basis || basis === "flat") return null;
    return p[basis] == null ? null : Number(p[basis]);
  }
  function rateOf(svc) {
    if (!svc || !svc.price_basis || svc.price_basis === "flat") return null;
    return svc.price_per_sq_ft == null ? null : Number(svc.price_per_sq_ft);
  }

function minOf(svc) {
    if (!svc || !svc.price_basis || svc.price_basis === "flat") return null;
    if (svc.price_minimum == null) return null;
    var m = Number(svc.price_minimum);
    return isNaN(m) || m <= 0 ? null : m;
  }
  function rate4(n) {
    return n == null ? "\u2014" : "$" + Number(n).toFixed(4) + " a sq ft";
  }
   
  function fromArea(rate, area, min) {
    if (rate == null || area == null) return null;
     
    var ten = Math.round(Number(rate) * 10000) * Math.round(Number(area));
    var cents = Math.floor(ten / 100);
    if (ten - cents * 100 >= 50) cents += 1;    
    return Math.max(cents / 100, min == null ? 0 : Number(min));
  }
   
  function creditNeeded(basis, p) {
    if (basis === "bldg_sq_ft" || basis === "yard_sq_ft") return true;
    if (basis === "crawl_sq_ft")
      return !!(p && p.crawl_basis && p.crawl_basis !== "measured on site");
    return false;
  }

    return MONTHS[Number(iso.slice(5, 7)) - 1] + " " + iso.slice(0, 4);

  async function loadMonthClose(mon) {
    var y = Number(mon.slice(0, 4)), m = Number(mon.slice(5, 7));
    var absent = false;
    var row = await many(sb.from("months_closed").select("*").eq("year", y).eq("month", m));
    var f = await sb.rpc("month_figures", { p_year: y, p_month: m });
    var it = await sb.rpc("month_open_items", { p_year: y, p_month: m });
    if (f.error) {
      if (f.error.code === "42501") throw explain(f.error);
      absent = true;
    }
    MC = { mon: mon, y: y, m: m, row: row[0] || null,
           fig: (f.data || [])[0] || null, items: it.error ? [] : (it.data || []),
           absent: absent, at: new Date() };
  }

  function wireMonthClose() {
    app.querySelectorAll("[data-mon]").forEach(function (b) {
      b.addEventListener("click", function () {
        route.mon = addMonths(route.mon, Number(b.getAttribute("data-mon")));
        MC = null; renderMonthClose();
      });
    });
     
    if ($("mcPick"))
      $("mcPick").addEventListener("change", function () {
        if (!/^\d{4}-\d{2}$/.test(this.value)) return;
        route.mon = this.value + "-01";
        MC = null; renderMonthClose();
      });
    if ($("mcDay")) $("mcDay").addEventListener("click", function () { go("close"); });
    if ($("mcPest")) $("mcPest").addEventListener("click", function () {
      go("pesticide", new Date().getFullYear());
    });
    if ($("mcShut")) $("mcShut").addEventListener("click", function () { shutMonth(this); });
     
    if ($("mcRefresh")) $("mcRefresh").addEventListener("click", function () {
      MC = null; renderMonthClose();
    });
    if ($("mcOpen")) $("mcOpen").addEventListener("click", function () { openMonthModal(); });
  }

  async function loadPesticide(y) {
    var from = y + "-01-01", to = y + "-12-31", absent = false;
    var u = await sb.rpc("pesticide_used",      { p_from: from, p_to: to });
    var g = await sb.rpc("pesticide_used_gaps", { p_from: from, p_to: to });
     
    if (u.error) {
      if (u.error.code === "42501") throw explain(u.error);
      absent = true;
    }
    var recs = [], pct = [];
    if (!absent) {
       
      recs = await all(function () {
        return sb.from("v_application_records").select("*")
          .gte("applied_on", from).lte("applied_on", to)
          .order("applied_on").order("sort_order");
      });
      pct = await soft(sb.from("v_percent_written_by_product").select("*")
                         .order("product_name"),
                       "v_percent_written_by_product",
                       "what strength has been written per product \u2014 run 0049");
    }
    PU = { year: y, used: u.error ? [] : (u.data || []),
           gaps: g.error ? [] : (g.data || []),
           pct: pct, recs: recs, absent: absent, at: new Date() };
  }

  async function exportBook(btn) {
    btn.disabled = true;
    var was = btn.textContent;
    var out = { exported_at: new Date().toISOString(), exported_by: S.me.name,
                app_version: "hosted", tables: {}, refused: {} };
    try {
      for (var i = 0; i < EXPORT_TABLES.length; i++) {
        var t = EXPORT_TABLES[i];
        btn.textContent = "Reading " + t + "… (" + (i + 1) + " of " + EXPORT_TABLES.length + ")";
         
        var rows = [], from = 0, bad = null;
        for (;;) {
          var r = await sb.from(t).select("*").range(from, from + 999);
          if (r.error) { bad = r.error.message || String(r.error.code); break; }
          var got = r.data || [];
          rows = rows.concat(got);
          if (got.length < 1000) break;
          from += 1000;
        }
        if (bad) out.refused[t] = bad; else out.tables[t] = rows;
      }
      var counted = Object.keys(out.tables).reduce(function (n, k) {
        return n + out.tables[k].length;
      }, 0);
      out.row_count = counted;
      var blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
       
      a.download = "united-termite-backup-" + todayISO() + ".json";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
      var missed = Object.keys(out.refused);
      toast(plural(counted, "row") + " downloaded" +
            (missed.length ? " — " + plural(missed.length, "table") + " refused, named in the file" : "") +
            ". Keep it somewhere safe.");
    } catch (e) {
      toast(e.message);
    } finally {
      btn.disabled = false; btn.textContent = was;
    }
  }

      '<label for="nName">Name</label><input id="nName" class="f">' +
      (svc
        ? '<label for="nGrp">Which column it sits in</label>' +
          '<input id="nGrp" class="f" list="g2" placeholder="e.g. Pest &amp; general">' +
          '<datalist id="g2">' + Object.keys(groups).map(function (g) {
            return '<option value="' + esc(g) + '">';
          }).join("") + "</datalist>" +
          '<label for="nPrice">Price — leave empty if it is priced on the job</label>' +
          '<input id="nPrice" class="f" inputmode="decimal" placeholder="e.g. 75.00">'
        : '<label for="nEpa">EPA registration number</label>' +
          '<input id="nEpa" class="f" placeholder="leave empty if none is printed">') +
      '<div class="row"><button class="primary" id="nGo" type="button">Add it</button>' +
      '<button class="act" id="nNo" type="button">Cancel</button></div>');
    $("nNo").addEventListener("click", closeModal);
    $("nGo").addEventListener("click", async function () {
      var name = $("nName").value.trim();
      if (!name) { toast("It needs a name."); $("nName").focus(); return; }
      this.disabled = true;
      try {
        if (svc) {
          var raw = $("nPrice").value.trim(), pr = raw === "" ? 0 : readMoney(raw);
          if (pr === null) throw new Error("That price didn’t read as a number.");
          var r = await sb.from("service_catalog").insert({
            name: name, price: pr, sheet_group: $("nGrp").value.trim() || null,
            on_render_sheet: true, active: true
          });
          if (r.error) throw explain(r.error);
        } else {
          var r2 = await sb.from("pesticide_products").insert({
            name: name, epa_number: $("nEpa").value.trim() || null,
            active: true, sort_order: S.products.length + 1
          });
          if (r2.error) throw explain(r2.error);
        }
        closeModal(); toast(name + " added");
        await reloadLists(); renderLists();
      } catch (e) {
        toast(/duplicate key/i.test(e.message) ? "There is already one with that name." : e.message);
        this.disabled = false;
      }
    });
  }

function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  var CARRY_DAYS = 90;    

function tzOffsetMs(tz, when) {
    var f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hour12: false,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit" });
    var p = {};
    f.formatToParts(when).forEach(function (x) { p[x.type] = x.value; });
    return Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second) - when.getTime();
  }
   
  function dayStartISO(iso) {
    var tz = (S.settings && S.settings.business_tz) || "America/New_York";
    var wall = new Date(iso + "T00:00:00Z");
    try {
      var t = new Date(wall.getTime() - tzOffsetMs(tz, wall));
      return new Date(wall.getTime() - tzOffsetMs(tz, t)).toISOString();
    } catch (e) {
       
      return wall.toISOString();
    }
  }

  async function renderClose(D) {
    app.innerHTML = '<div class="msg">Adding up ' + esc(fmtLong(D)) + "…</div>";

    var pays = [], revs = [], revPays = [], owedBack = [];
    var work = [], openToday = [], carriedRaw = [];
    var invBy = {}, balBy = {}, linesBy = {}, sheetBy = {};
    try {
       
      pays = await many(sb.from("payments")
        .select("*")
        .gte("collected_at", dayStartISO(D))
        .lt("collected_at", dayStartISO(shiftISO(D, 1)))
        .order("collected_at"));
      revs = await many(sb.from("payment_reversals")
        .select("id,payment_id,kind,amount,reason,effective_on,created_by")
        .is("undone_at", null).eq("effective_on", D));
       
      owedBack = await soft(sb.from("v_refunds_owed").select("*")
                             .order("overpaid", { ascending: false }),
                           "v_refunds_owed",
                           "the list of refunds owed \u2014 run " +
                           "supabase/migrations/0050_a_charge_that_should_not_be_there.sql");

work = await many(sb.from("jobs").select("*")
        .eq("status", "complete").eq("completed_date", D));
      openToday = await many(sb.from("jobs").select("*")
        .eq("scheduled_date", D).in("status", ["scheduled", "rained-out", "no-access"]));
      carriedRaw = await many(sb.from("jobs").select("*")
        .gte("scheduled_date", shiftISO(D, -CARRY_DAYS)).lt("scheduled_date", D)
        .in("status", ["scheduled", "rained-out", "no-access"]).order("scheduled_date"));

var ids = {};
      work.concat(openToday, carriedRaw).forEach(function (j) { ids[j.id] = 1; });
      pays.forEach(function (p) { if (p.job_id) ids[p.job_id] = 1; });
      if (revs.length) {
        revPays = await many(sb.from("payments")
          .select("id,invoice_id,customer_id,job_id,method,check_number,amount_collected,collected_at")
          .in("id", revs.map(function (x) { return x.payment_id; })));
        revPays.forEach(function (p) { if (p.job_id) ids[p.job_id] = 1; });
      }
      var idList = Object.keys(ids);
      if (idList.length) {
        (await many(sb.from("invoices").select("*").in("job_id", idList)))
          .forEach(function (i) { invBy[i.job_id] = i; });
        (await many(sb.from("v_invoice_balances").select("*").in("job_id", idList)))
          .forEach(function (b) { balBy[b.job_id] = b; });
        (await many(sb.from("job_lines").select("*").in("job_id", idList)))
          .forEach(function (l) { (linesBy[l.job_id] = linesBy[l.job_id] || []).push(l); });
        (await many(sb.from("job_sheets").select("job_id,signed_on,notes").in("job_id", idList)))
          .forEach(function (s) { sheetBy[s.job_id] = s; });
      }
    } catch (e) {
      app.innerHTML = '<div class="msg bad"><b>Couldn’t add up the day.</b><br>' +
        esc(e.message) + "<br>Nothing here is a real figure — reload before acting on it.</div>";
      return;
    }

if (!S.customers.length && !work.length && !pays.length) {
      app.innerHTML = '<div class="msg bad"><b>Nothing loaded.</b><br>' +
        "This is not an empty day — the app could not read the data. Reload, and if " +
        "it keeps happening your access may have been switched off.</div>";
      return;
    }

    var lines = function (id) { return linesBy[id] || []; };
    var svc = function (id) {
      return lines(id).map(function (l) { return l.service_name; }).join(" + ");
    };
    var who = function (id) { var c = custById(id); return c ? c.name : "?"; };

var noInvoice = [], excluded = [], counted = [];
    work.forEach(function (j) {
      var inv = invBy[j.id];
      if (!inv) { noInvoice.push(j); return; }
       
      if (inv.voided_at || inv.charge_withdrawn) { excluded.push({ j: j, inv: inv }); return; }
      counted.push({ j: j, inv: inv, bal: balBy[j.id] });
    });
    var completed = r2(counted.reduce(function (t, x) { return t + Number(x.inv.total || 0); }, 0));
    var recorded  = r2(counted.reduce(function (t, x) { return t + Number(x.bal ? x.bal.collected : 0); }, 0));
    var unaccounted = r2(counted.reduce(function (t, x) { return t + Number(x.bal ? x.bal.balance : x.inv.total); }, 0));
     
    var overpaid = r2(counted.reduce(function (t, x) { return t + Number(x.bal ? x.bal.overpaid : 0); }, 0));
    var excludedTotal = r2(excluded.reduce(function (t, x) { return t + Number(x.inv.total || 0); }, 0));
    var taxDue  = r2(counted.reduce(function (t, x) { return t + Number(x.inv.tax || 0); }, 0));
    var taxable = r2(counted.reduce(function (t, x) {
      return t + (Number(x.inv.subtotal || 0) - Number(x.inv.discount || 0));
    }, 0));

    var faults = (unaccounted > 0.004) || (overpaid > 0.004) || noInvoice.length > 0;
    var balanced = !faults;
    var nothingYet = !counted.length && !noInvoice.length && !excluded.length;

var inDrawer = pays.filter(function (p) { return p.collected; });
    var promised = pays.filter(function (p) { return !p.collected && !p.cancelled_at; });
    var by = function (m) { return inDrawer.filter(function (p) { return p.method === m; }); };
    var sum = function (rows) {
      return r2(rows.reduce(function (t, p) { return t + Number(p.amount_collected || 0); }, 0));
    };
    var cash = by("cash"), checks = by("check"), cards = by("card");
    var mailed = by("to-be-mailed"), other = by("other");
    var drawerGross = r2(sum(cash) + sum(checks) + sum(mailed) + sum(other));

var dayStart = dayStartISO(D), dayEnd = dayStartISO(shiftISO(D, 1));
    var revInfo = revs.map(function (r) {
      var p = revPays.filter(function (x) { return x.id === r.payment_id; })[0] || null;
      var sameDay = !!(p && p.collected_at >= dayStart && p.collected_at < dayEnd);
      var isCard = !!(p && p.method === "card");
      return { r: r, p: p, sameDay: sameDay, isCard: isCard,
               bucket: isCard ? "card" : (sameDay ? "drawer" : "earlier") };
    });
    var backDrawer = r2(revInfo.filter(function (x) { return x.bucket === "drawer"; })
      .reduce(function (t, x) { return t + Number(x.r.amount || 0); }, 0));
    var backCard = r2(revInfo.filter(function (x) { return x.bucket === "card"; })
      .reduce(function (t, x) { return t + Number(x.r.amount || 0); }, 0));
    var backEarlier = r2(revInfo.filter(function (x) { return x.bucket === "earlier"; })
      .reduce(function (t, x) { return t + Number(x.r.amount || 0); }, 0));
    var drawer = r2(drawerGross - backDrawer);

    var voidJobs = {};
    excluded.forEach(function (x) { voidJobs[x.j.id] = x.inv; });

var h = "<h1>Daily Close — " + esc(fmtLong(D)) + "</h1>" +
      '<p class="sub">Work finished, against money recorded.</p>';

    h += '<div class="daynav noprint">' +
      '<button class="act" data-cday="-1" type="button">‹ ' + esc(fmtDate(shiftISO(D, -1))) + "</button>" +
       
      '<input type="date" id="cdayPick" class="f" aria-label="Go to a day" ' +
        'style="max-width:9.5rem;display:inline-block;margin:0" value="' + esc(D) + '">' +
      '<button class="act" data-cday="1" type="button">' + esc(fmtDate(shiftISO(D, 1))) + " ›</button>" +
      (D !== todayISO() ? '<button class="act" data-cday="today" type="button">Back to today</button>' : "") +
      '<span style="flex:1"></span>' +
      '<span class="empty" style="font-size:.78rem">Sheets come back the next day — ' +
      "close the day they belong to.</span>" +
      '<button class="act" id="cmonth" type="button">Close the month…</button>' +
      '<button class="act" id="cprint" type="button">🖨 Print</button></div>';

var third = nothingYet ? { lbl: "Nothing to reconcile", val: money(0), cls: " ok" }
      : balanced ? { lbl: "Reconciled", val: money(0), cls: " ok" }
      : null;

    h += '<div class="card" style="border-left:5px solid ' +
      (balanced || nothingYet ? "var(--ok)" : "var(--owed)") + '">' +
      '<div class="recon">' +
        '<div><div class="lbl">Work completed</div>' +
          '<button class="figure" data-exp="work" type="button">' + money(completed) + "</button>" +
          '<div class="what">' + plural(counted.length, "job") + " finished this day" +
          (excluded.length ? ", " + excluded.length + " not counted" : "") + "</div></div>" +
        '<div class="eq">' + (balanced || nothingYet ? "=" : "≠") + "</div>" +
        '<div><div class="lbl">Payments recorded</div>' +
          '<button class="figure" data-exp="paid" type="button">' + money(recorded) + "</button>" +
          '<div class="what">against those same jobs</div></div>' +
        '<div class="gap"></div>' +
        '<div style="text-align:right">' +
        (third
          ? '<div class="lbl">' + third.lbl + "</div>" +
            '<button class="figure' + third.cls + '" data-exp="gap" type="button">' +
            third.val + "</button>"
           
          : (unaccounted > 0.004
              ? '<div class="lbl">⚠ Unaccounted</div>' +
                '<button class="figure bad" data-exp="gap" type="button">' +
                money(unaccounted) + "</button>"
              : "") +
            (overpaid > 0.004
              ? '<div class="lbl" style="margin-top:.3rem">⚠ Over-collected</div>' +
                '<button class="figure bad" data-exp="over" type="button">' +
                money(overpaid) + "</button>"
              : "") +
            (unaccounted <= 0.004 && overpaid <= 0.004 && noInvoice.length
              ? '<div class="lbl">⚠ Cannot be reconciled</div>' +
                '<div class="figure bad">' + plural(noInvoice.length, "job") + "</div>"
              : "")) +
        "</div>" +
      "</div>";

    if (nothingYet)
      h += '<div class="msg" style="margin:.7rem 0 0">Nothing marked finished this day, ' +
        "so there is nothing to reconcile. Money taken today still shows below.</div>";
    else if (balanced)
      h += '<div class="msg good" style="margin:.7rem 0 0">Day balances. Every job finished ' +
        "this day has its payment in.</div>";
    else {
      if (unaccounted > 0.004)
        h += '<div class="msg bad" style="margin:.7rem 0 0"><b>' + money(unaccounted) +
          " of work finished this day has no payment recorded.</b> Check it before the " +
          "sheet gets filed — this is the catch that used to need a sharp eye.</div>";
      if (overpaid > 0.004)
        h += '<div class="msg warn" style="margin:.7rem 0 0"><b>' + money(overpaid) +
          " more was collected than was invoiced.</b> Either money is owed back or the " +
          "sheet was charged wrong. It is shown on its own because it does not cancel " +
          "out a shortfall on another job." +
          '<div style="margin-top:.4rem">' +
          counted.filter(function (x) { return x.bal && Number(x.bal.overpaid) > 0.004; })
            .map(function (x) {
              return "<b>" + esc(who(x.j.customer_id)) + "</b> — invoiced " + money(x.inv.total) +
                ", collected " + money(x.bal.collected) + ", <b>" +
                money(x.bal.overpaid) + " over</b>" +
                (Number(x.inv.discount) > 0
                  ? " (a " + money(x.inv.discount) + " " +
                    esc(x.inv.discount_reason || "discount") + " came off after the fact)"
                  : "");
            }).join("<br>") + "</div></div>";
      if (unaccounted > 0.004 && overpaid > 0.004)
        h += '<p class="note" style="margin:.5rem 0 0">' + money(completed) + " completed − " +
          money(recorded) + " recorded = " + money(unaccounted) + " short − " +
          money(overpaid) + " over. The two are separate jobs and do not cancel out.</p>";
    }

    h += '<p class="note" style="margin:.6rem 0 0">Tax included, both sides. ' +
      "<b>Payments recorded is everything ever collected on those invoices</b>, not just " +
      "today’s money.</p>";

if (owedBack.length) {
      var owedTotal = r2(owedBack.reduce(function (t, x) {
        return t + Number(x.overpaid || 0);
      }, 0));
      h += '<div class="card"><h2>Refunds owed \u2014 ' + money(owedTotal) + "</h2>" +
        '<p class="note">More was collected than the invoice comes to, on ' +
        plural(owedBack.length, "sheet") + ". Not today\u2019s figure and not part of " +
        "the day above \u2014 this is every one on the book, whenever it happened. " +
        "Usually a charge that came off after the customer had already paid.</p>" +
        '<table class="lst"><tr><th>Who</th><th class="r">Invoiced</th>' +
        '<th class="r">Collected</th><th class="r">Owed back</th></tr>' +
        owedBack.map(function (x) {
          return "<tr><td>" + esc(x.customer_name || "?") +
            (x.completed_date
              ? ' <span class="dates">finished ' + esc(fmtDate(x.completed_date)) + "</span>"
              : "") + "</td>" +
            '<td class="r">' + money(x.total) + "</td>" +
            '<td class="r">' + money(x.collected) + "</td>" +
            '<td class="r"><b>' + money(x.overpaid) + "</b></td></tr>";
        }).join("") + "</table></div>";
    }

    h += '<div id="exp-work" class="expand-body" hidden>' +
      (counted.length
        ? counted.map(function (x) { return closeLine(x, "total"); }).join("")
        : '<div class="empty">Nothing finished this day.</div>') + "</div>";
    h += '<div id="exp-paid" class="expand-body" hidden>' +
      (counted.filter(function (x) { return x.bal && Number(x.bal.collected) > 0; }).length
        ? counted.filter(function (x) { return x.bal && Number(x.bal.collected) > 0; })
            .map(function (x) { return closeLine(x, "collected"); }).join("")
        : '<div class="empty">No money recorded against this day’s jobs.</div>') + "</div>";
    h += '<div id="exp-gap" class="expand-body" hidden>' +
      (counted.filter(function (x) { return x.bal && Number(x.bal.balance) > 0.004; }).length
        ? counted.filter(function (x) { return x.bal && Number(x.bal.balance) > 0.004; })
            .map(function (x) { return closeLine(x, "balance"); }).join("")
        : '<div class="empty">Nothing outstanding on this day’s jobs.</div>') + "</div>";
    h += '<div id="exp-over" class="expand-body" hidden>' +
      counted.filter(function (x) { return x.bal && Number(x.bal.overpaid) > 0.004; })
        .map(function (x) { return closeLine(x, "overpaid"); }).join("") + "</div>";
    h += "</div>";

if (excluded.length)
      h += '<div class="card"><h2>' + plural(excluded.length, "finished job") +
        " not counted — " + money(excludedTotal) + "</h2>" +
        '<p class="note">On neither side of the figures above. Money may still have been ' +
        "taken against them.</p>" +
        excluded.map(function (x) {
          var b = balBy[x.j.id];
          var vd = !!x.inv.voided_at;
          var got = b ? Number(b.collected) || 0 : 0;
          var by = personOf(vd ? x.inv.voided_by : x.inv.charge_withdrawn_by);
          var why = vd ? x.inv.void_reason : x.inv.charge_withdrawn_reason;
          return '<div class="item' + (vd && got > 0.004 ? " owed" : "") + '">' +
            '<div class="top"><span class="nm">' + esc(who(x.j.customer_id)) + "</span>" +
            '<span class="pill warn">' + (vd ? "voided — never owed" : "charge withdrawn") +
            "</span>" +
            '<span class="amt">' + money(x.inv.total) + "</span></div>" +
            '<div class="why">' + esc(svc(x.j.id)) +
            (why ? " · " + esc(why) : "") +
            (by ? " · " + esc(by.name) : "") +
            (got > 0.004
              ? (vd
                  ? " · <b>" + money(got) + " was collected against an invoice that was never " +
                    "owed</b> — give it back or move it onto the right sheet"
                  : " · " + money(got) + " was collected and kept")
              : "") +
            "</div></div>";
        }).join("") + "</div>";

if (noInvoice.length)
      h += '<div class="card" style="border-left:5px solid var(--owed)">' +
        "<h2>" + plural(noInvoice.length, "finished job") + " with no invoice</h2>" +
        '<p class="note">Nothing to check the money against. An invoice is normally ' +
        "raised when a job is booked.</p>" +
        noInvoice.map(function (j) {
          return '<div class="item owed"><div class="top"><span class="nm">' +
            esc(who(j.customer_id)) + '</span><span class="pill warn">no invoice</span>' +
            '<span class="amt">—</span></div><div class="why">' + esc(svc(j.id)) +
            "</div></div>";
        }).join("") + "</div>";

h += '<div class="card"><h2>What should go to the bank — ' + money(drawer) + "</h2>" +
      '<p class="note">Money that changed hands <b>this day</b>, whichever day the job ' +
      "was done.</p>";
    if (!inDrawer.length && !promised.length && !revs.length) {
      h += '<div class="empty">No money recorded this day.</div>';
    } else {
      h += '<div class="bank">' +
        bankRow("Cash", cash, sum(cash), null) +
        bankRow("Checks", checks, sum(checks), function (p) {
          return "#" + esc(p.check_number || "no number") + " " + esc(who(p.customer_id));
        }) +
        (mailed.length ? bankRow("To be mailed", mailed, sum(mailed), function (p) {
          return esc(who(p.customer_id));
        }) : "") +
        (other.length ? bankRow("Other", other, sum(other), function (p) {
          return esc(who(p.customer_id));
        }) : "") +
        (backDrawer > 0.004
          ? '<div class="brow"><div>Less given back in cash or by check</div><div>−' +
            money(backDrawer) + "</div>" +
            '<div class="bdetail">' + revInfo.filter(function (x) { return x.bucket === "drawer"; })
              .map(function (x) {
                return esc(x.p ? who(x.p.customer_id) : "?") + " " + esc(x.r.kind) + " " +
                  money(x.r.amount);
              }).join(" · ") + "</div></div>"
          : "") +
        '<div class="brow tot"><div>Drawer to bank</div><div>' + money(drawer) + "</div></div>" +
        (cards.length || backCard > 0.004
          ? bankRow("Cards run", cards, sum(cards), function (p) {
              return esc(p.processor) + " " +
                (p.processor_txn_id ? "…" + esc(String(p.processor_txn_id).slice(-6)) : "no reference") +
                " " + esc(who(p.customer_id));
            }) +
            (backCard > 0.004
              ? '<div class="brow"><div>Card money given back</div><div>−' + money(backCard) +
                "</div>" + '<div class="bdetail">' +
                revInfo.filter(function (x) { return x.bucket === "card"; }).map(function (x) {
                  return esc(x.p ? who(x.p.customer_id) : "?") + " " + esc(x.r.kind) + " " +
                    money(x.r.amount);
                }).join(" · ") + "</div></div>"
              : "") +
            '<div class="brow note2"><div>Cards settle through the processor, not the ' +
            "drawer — none of this is part of the figure above.</div><div></div></div>"
          : "") +
        "</div>";
      if (promised.length)
        h += '<div class="msg warn" style="margin-top:.8rem"><b>' +
          plural(promised.length, "payment") + " written down but not in yet — " +
          money(sum(promised)) + ".</b><br>" +
          promised.map(function (p) {
            return esc(who(p.customer_id)) + " · " + esc(p.method);
          }).join("<br>") +
          "<br>A card number on a sheet is not money until the card is run, so these are " +
          "not in the deposit.</div>";
      if (backEarlier > 0.004)
        h += '<div class="msg warn" style="margin-top:.8rem"><b>' + money(backEarlier) +
          " given back against money taken on an earlier day.</b><br>" +
          revInfo.filter(function (x) { return x.bucket === "earlier"; }).map(function (x) {
            return esc(x.p ? who(x.p.customer_id) : "?") + " · " + esc(x.r.kind) + " · " +
              money(x.r.amount) + " — " + esc(x.r.reason) +
              (x.p ? " (taken " + esc(fmtDate(String(x.p.collected_at).slice(0, 10))) + ")" : "");
          }).join("<br>") +
          "<br>It belongs to this day, but it was never part of this day’s takings — so it " +
          "is not in the figure above either. It puts the money back on what those jobs owe.</div>";
      if (revs.length)
        h += '<p class="note" style="margin-top:.7rem">Anything given back goes back onto ' +
          "what the job owes.</p>";

var LINE_VOID_REASONS = ["Ticked by mistake", "Wrong service", "Not carried out"];

  function voidLineModal(row, j, back) {
    back = back || function () { go("sheet", j.id); };
    var inv = invOf(j.id), b = balOf(j.id);
    var sub = r2(inv ? inv.subtotal : 0);
    var rate = Number(inv ? inv.tax_rate : 0) || 0;
    var already = r2(inv ? inv.discount : 0);
    var collected = r2(b ? b.collected : 0);
    var price = r2(row.price);
     
    var net = r2(sub - price - already);
    if (net < 0) net = 0;
    var tax = r2(net * rate), tot = r2(net + tax), owed = r2(tot - collected);

    var moneyLine = collected > 0.004
      ? "They have already paid <b>" + money(collected) + "</b>. Taking this line off " +
        "leaves the bill at <b>" + money(tot) + "</b>, so " +
        (owed < -0.004
          ? "<b>" + money(-owed) + " becomes money to give back</b> \u2014 it shows on the " +
            "Refunds owed list until somebody actually refunds it, and giving it back is " +
            "its own record with a name on it."
          : owed > 0.004
            ? money(owed) + " is still owed."
            : "nothing is owed either way.")
      : "Nothing has been paid on this sheet yet, so this takes <b>" +
        (price > 0 ? money(price) : "the unpriced line") + "</b> off what they owe. " +
        "The new total would be <b>" + money(tot) + "</b>.";

    openModal("<h3>Take " + esc(row.service_name) + " off the sheet?</h3>" +
      '<p class="note">' +
      (price > 0 ? money(price) : "priced on the job") +
      " \u00b7 the sheet comes to " + money(sub) + " before tax</p>" +
      '<div class="msg warn">' + moneyLine +
      " What was applied on this visit does not change.</div>" +
      '<p class="note">Not deleted. The line stays on the sheet with a rule through it, ' +
      "your name and this reason, so a reprint years from now still says what was " +
      "charged and why it came off.</p>" +
      '<div class="acts" style="margin-bottom:.3rem">' +
      LINE_VOID_REASONS.map(function (w, i) {
        return '<button class="act' + (i === 0 ? " go" : "") + '" data-vl="' + esc(w) +
          '" type="button">' + esc(w) + "</button>";
      }).join("") +
      '<button class="act" id="vlOther" type="button">Something else\u2026</button></div>' +
      '<div id="vlFree" hidden><label for="vlWhy">What happened?</label>' +
      '<input id="vlWhy" class="f" placeholder="say what happened">' +
      '<div class="acts"><button class="act go" id="vlGo" type="button">Take it off</button>' +
      "</div></div>" +
      '<div class="row"><button class="act" id="vlNo" type="button">Leave it on</button></div>');

    $("vlNo").addEventListener("click", function () { back(); });
    $("vlOther").addEventListener("click", function () {
      $("vlFree").hidden = false;
      $("vlWhy").focus();
      this.disabled = true;
    });
    $("modal").querySelectorAll("[data-vl]").forEach(function (btn) {
      btn.addEventListener("click", function () { doVoid(btn.getAttribute("data-vl"), btn); });
    });
    $("vlGo").addEventListener("click", function () { doVoid($("vlWhy").value.trim(), this); });

    async function doVoid(why, btn) {
      btn.disabled = true;
      try {
        if (!why) throw new Error("Say what happened, or pick one of the reasons.");
         
        var r = await sb.from("job_lines").update({
          voided_at: new Date().toISOString(), voided_by: S.me.id, void_reason: why
        }).eq("id", row.id).is("voided_at", null).select();
        if (r.error) throw explain(r.error);
        if (!(r.data || []).length)
          throw new Error("That line is still on the sheet. If it is signed or paid, open " +
            "it for corrections first \u2014 the opening is recorded on the folder.");
        await reload(["jobs", "money", "attention"]);
        closeModal();
        toast(row.service_name + " taken off \u2014 " + why.toLowerCase());
        back();
      } catch (e) {
         
        var cm = closedMonthMsg(e);
        toast(cm ? cm
          : /voided_at|void_reason|voided_by/.test(e.message)
            ? "Taking a charge off the sheet needs the latest bit of SQL run first \u2014 " +
              "0050_a_charge_that_should_not_be_there.sql."
            : e.message);
        btn.disabled = false;
      }
    }
  }

        var on = $("rd").value || todayISO();
        if (amt == null || amt <= 0) throw new Error("How much came back?");
        if (amt > Number(p.amount_collected) + 0.004)
          throw new Error("That is more than the " + money(p.amount_collected) + " taken.");
        if (!reason) throw new Error("Say why.");
        var r = await sb.from("payment_reversals").insert({
          payment_id: p.id, kind: kind, amount: amt,
          reason: reason, effective_on: on, created_by: S.me.id
        }).select();
        if (r.error) throw explain(r.error);
        if (!(r.data || []).length)
          throw new Error("That didn’t save. If the month is closed, it has to be reopened first.");
        done = true;
         
        var wdFail = null;
        if (kind === "refund" && wd) {
          var iu = await sb.from("invoices").update({
            charge_withdrawn: true, charge_withdrawn_at: new Date().toISOString(),
            charge_withdrawn_by: S.me.id, charge_withdrawn_reason: reason
          }).eq("id", p.invoice_id).eq("charge_withdrawn", false).select();
          if (iu.error)
            wdFail = closedMonthMsg(iu.error) ||
              (/charge_withdrawn_/.test(iu.error.message || "")
                ? "withdrawing a charge needs the latest bit of SQL run first."
                : explain(iu.error).message);
          else if (!(iu.data || []).length)
            wdFail = "the invoice did not move — it may be voided or withdrawn already.";
        }
        await reload(["money", "attention"]);
        closeModal();
        toast(wdFail

      } catch (e) {
        if (done) { closeModal(); toast("Recorded — the screen couldn’t refresh. Reload to see it."); return; }
        toast(e.message);
        this.disabled = false;
      }
    });
  }

function canDiscount(inv) {
    return isOffice() && !!inv && !inv.voided_at && !inv.charge_withdrawn &&
           Number(inv.subtotal) > 0;

var DISCOUNT_REASONS = ["Goodwill", "They complained", "Coupon",
                          "Priced too high", "The owner agreed it"];

  async function discountModal(invoiceId, back) {
    back = back || function () { closeModal(); render(); };
    var inv = S.invoices.filter(function (i) { return i.id === invoiceId; })[0];
    if (!inv) { toast("Couldn’t find that invoice — reload."); return; }

    var c = custById(inv.customer_id);

var rows;

    openModal("<h3>Take money off — " + esc(c ? c.name : "") + "</h3>" +
      '<p class="note">Service fee <b>' + money(sub) + "</b> before tax" +

      (room > 0.004

          '<div id="dcPrev" class="note" style="margin:-.5rem 0 .75rem">' + hint + "</div>" +
          '<label for="dcWhy">Why</label>' +
          '<input id="dcWhy" class="f" placeholder="what you told them">' +
          '<div class="acts" style="margin:-.4rem 0 .8rem">' +

            return '<button class="act" data-why="' + esc(w) + '" type="button">' +

          }).join("") + "</div>"
        : '<div class="msg warn">The whole service fee is already off, so there is ' +
          "nothing left to take." +
          (already > sub + 0.004
            ? " The sheet counts only " + money(sub) + " of the " + money(already) +

      rows.map(function (a) {
        return '<div class="item"><div class="top"><span class="nm">' + esc(a.reason) +

          '<div class="dates">' + esc(fmtDate(String(a.created_at).slice(0, 10))) +
          (personOf(a.created_by) ? " · " + esc(personOf(a.created_by).name) : "") + "</div>" +
          '<div class="acts"><button class="act" data-off="' + a.id +
          '" type="button">Put it back on</button></div></div>';
      }).join("") +
       
      (rows.length > 1
        ? '<p class="note">The sheet prints them as one line — <b>Less ' +
          esc(inv.discount_reason || "discount") + "</b>.</p>"
        : "") +
      '<div class="row">' +
      (room > 0.004
        ? '<button class="primary" id="dcGo" type="button">Take it off</button>'
        : "") +
      '<button class="act" id="dcNo" type="button">' +
      (room > 0.004 ? "Cancel" : "Close") + "</button></div>");

    $("dcNo").addEventListener("click", function () { back(); });

if ($("dcAmt")) {
      var preview = function () {
        var raw = $("dcAmt").value;
        var d = readDiscount(raw, sub);
        if (d == null) {
          $("dcPrev").innerHTML = raw.replace(/\s/g, "") === ""
            ? hint
            : "That is not an amount. Type it like <b>45.50</b>, or <b>10%</b>.";
          return;
        }
        if (d.amount > room + 0.004) {
          $("dcPrev").innerHTML = "<b>" + money(d.amount) + "</b> is more than the " +
            money(room) + " left on this sheet.";
          return;
        }
        var net = r2(sub - already - d.amount);
        var tax = r2(net * rate), tot = r2(net + tax), owed = r2(tot - collected);
        $("dcPrev").innerHTML =
          (d.pct == null ? "" : d.pct + "% of " + money(sub) + " is ") +
          "<b>" + money(d.amount) + "</b> off · " + money(tot) + " with tax · " +
          (owed > 0.004 ? money(owed) + " still owed"
            : owed < -0.004 ? "<b>" + money(-owed) + " to give back</b>"
            : "nothing owed");
      };
      $("dcAmt").addEventListener("input", preview);
    }

    $("modal").querySelectorAll("[data-why]").forEach(function (b) {
      b.addEventListener("click", function () {
        $("dcWhy").value = b.getAttribute("data-why");
        $("dcAmt").focus();
      });
    });

    if ($("dcGo")) $("dcGo").addEventListener("click", async function () {
      this.disabled = true;
      var posted = false;
      try {
         
        var raw = $("dcAmt").value, why = $("dcWhy").value.trim();
        var d = readDiscount(raw, sub);
        if (d == null) throw new Error('"' + raw + '" isn’t an amount — type it like 45.50, or 10%.');
        if (d.amount <= 0) throw new Error("How much comes off?");
         
        if (d.amount > room + 0.004)
          throw new Error(already > 0
            ? "Only " + money(room) + " is left to take off — " + money(already) + " already is."
            : "That is more than the " + money(sub) + " on the sheet.");
        if (!why) throw new Error("Say why — it prints on the sheet as “Less …”.");
        var r = await sb.from("invoice_adjustments").insert({
          invoice_id: inv.id, amount: d.amount, reason: why, created_by: S.me.id
        }).select();
        if (r.error) throw explain(r.error);
        if (!(r.data || []).length)
          throw new Error("That didn’t save — taking money off is the office’s to do.");
        posted = true;
        await reload(["money", "attention"]);
        back();
        toast(money(d.amount) + " off — " + why.toLowerCase());
      } catch (e) {
        if (posted) { back(); toast("It came off — the screen couldn’t refresh. Reload to see it."); return; }
        toast(e.message);
        this.disabled = false;
      }
    });

    $("modal").querySelectorAll("[data-off]").forEach(function (b) {
      b.addEventListener("click", async function () {
        b.disabled = true;
        var a = rows.filter(function (x) { return x.id === b.getAttribute("data-off"); })[0];
        var done = false;
        try {
           
          var r = await sb.from("invoice_adjustments").update({
            removed_at: new Date().toISOString(), removed_by: S.me.id
          }).eq("id", a.id).is("removed_at", null).select();
          if (r.error) throw explain(r.error);
          if (!(r.data || []).length)
            throw new Error("Nothing moved — it may already be back on.");
          done = true;
          await reload(["money", "attention"]);
          back();
          toast(money(a.amount) + " back on the bill.");
        } catch (e) {
          if (done) { back(); toast("It went back on — the screen couldn’t refresh. Reload to see it."); return; }
          toast(e.message);
          b.disabled = false;
        }
      });
    });
  }

var VOID_INV_REASONS = ["Raised by mistake", "Billed on another sheet",
                          "The visit never happened"];
  var WITHDRAW_REASONS = ["Goodwill", "We got it wrong", "Not worth chasing"];

  function notOwedModal(invoiceId, back) {
    var inv = S.invoices.filter(function (i) { return i.id === invoiceId; })[0];
    if (!inv) { toast("Couldn’t find that invoice — reload."); return; }
    var c = custById(inv.customer_id);
    var j = inv.job_id ? jobById(inv.job_id) : null;
    var b = S.balances.filter(function (x) { return x.invoice_id === inv.id; })[0] || null;
    var got = b ? Number(b.collected) || 0 : 0;
    var owed = b ? Number(b.balance) || 0 : Number(inv.total) || 0;
    var mode = null;
    var leave = back || closeModal;

    function head() {
      return "<h3>Not asking for this money — " + esc(c ? c.name : "") + "</h3>" +
        '<p class="note">' +
        (j && j.scheduled_date ? esc(fmtDate(j.scheduled_date)) + " · " : "") +
        money(inv.total) + " invoiced" +
        (got > 0.004 ? " · " + money(got) + " in" : "") +
        (owed > 0.004 ? " · " + money(owed) + " owed" : " · nothing owed") + "</p>";
    }

function draw() {
      if (inv.voided_at || inv.charge_withdrawn) {
        openModal(head() +
          '<div class="msg warn"><b>' +
          (inv.voided_at ? "This invoice is already voided."
                         : "This charge is already withdrawn.") + "</b>" +
          ((inv.voided_at ? inv.void_reason : inv.charge_withdrawn_reason)
            ? "<br>" + esc(inv.voided_at ? inv.void_reason : inv.charge_withdrawn_reason)
            : "") + "</div>" +
          '<div class="row"><button class="act" id="noNo" type="button">Close</button></div>');
        $("noNo").addEventListener("click", leave);
        return;
      }
      if (mode) return drawReason();
      openModal(head() +
        '<div class="msg"><b>The work happened. We are not asking to be paid.</b><br>' +
        "It stays on their record as work done, comes off what they owe, and is out of the " +
        "month’s takings." +
        (got > 0.004
          ? "<br>The " + money(got) + " already in stays in. This only stops us asking for " +
            "the " + money(owed) + " left."
          : "") +
        '<div class="acts" style="margin-top:.5rem">' +
        (owed > 0.004
          ? '<button class="act go" id="noWd" type="button">Withdraw the charge</button>'
          : '<span class="pill">nothing owed — giving money back is a refund on the ' +
            "payment</span>") +
        "</div></div>" +
        '<div class="msg"><b>It should never have been raised.</b><br>' +
        "Nothing was ever owed. It stays void even if services are added to the sheet " +
        "afterwards, so do not use it for a visit that is still going to happen." +
        (got > 0.004
          ? "<br><b>" + money(got) + " has been collected against it.</b> Nothing was owed, " +
            "so that money belongs somewhere else — give it back, or put it on the right " +
            "sheet, under Payment issue on the Daily Close."
          : "") +
        '<div class="acts" style="margin-top:.5rem">' +
        (got > 0.004
          ? '<span class="pill warn">money is in — it cannot be voided</span>'
          : '<button class="act" id="noVd" type="button">Void the invoice</button>') +
        "</div></div>" +
        '<div class="row"><button class="act" id="noNo" type="button">Leave it</button></div>');
      $("noNo").addEventListener("click", leave);
      if ($("noWd")) $("noWd").addEventListener("click", function () { mode = "withdraw"; draw(); });
      if ($("noVd")) $("noVd").addEventListener("click", function () { mode = "void"; draw(); });
    }

function drawReason() {
      var vd = mode === "void";
      var reasons = vd ? VOID_INV_REASONS : WITHDRAW_REASONS;
      openModal(head() +
        '<div class="msg ' + (vd ? "bad" : "warn") + '"><b>' +
        (vd ? "Void " + money(inv.total) + " — it was never owed."
            : "Not asking for " + money(owed) + " — the work still happened.") + "</b><br>" +
        (vd ? "The sheet bills for nothing and the invoice reads void."
            : "The sheet still shows the work. It comes off what they owe.") + "</div>" +
        "<label>Why</label>" +
        '<div class="acts" style="margin-bottom:.3rem">' +
        reasons.map(function (r, i) {
          return '<button class="act' + (i === 0 ? " go" : "") + '" data-nr="' + esc(r) +
            '" type="button">' + esc(r) + "</button>";
        }).join("") +
        '<button class="act" id="noOther" type="button">Something else…</button></div>' +
        '<div id="noFree" hidden><label for="noWhy">What happened?</label>' +
        '<input id="noWhy" class="f" placeholder="say why">' +
        '<div class="acts"><button class="act go" id="noGo" type="button">' +
        (vd ? "Void it" : "Withdraw it") + "</button></div></div>" +
        '<div class="row"><button class="act" id="noBack" type="button">Back</button></div>');
      $("noBack").addEventListener("click", function () { mode = null; draw(); });
      $("noOther").addEventListener("click", function () {
        $("noFree").hidden = false; $("noWhy").focus(); this.disabled = true;
      });
      $("modal").querySelectorAll("[data-nr]").forEach(function (btn) {
        btn.addEventListener("click", function () { doIt(btn.getAttribute("data-nr"), btn); });
      });
      $("noGo").addEventListener("click", function () { doIt($("noWhy").value.trim(), this); });
    }

    async function doIt(why, btn) {
      btn.disabled = true;
      try {
        if (!why) throw new Error("Say why, or pick one of the reasons.");
         
        var fresh = await many(sb.from("v_invoice_balances").select("*").eq("invoice_id", inv.id));
        var nowGot = fresh.length ? Number(fresh[0].collected) || 0 : got;
        var nowOwed = fresh.length ? Number(fresh[0].balance) || 0 : owed;
        if (mode === "void" && nowGot > 0.004)
          throw new Error(money(nowGot) + " has been collected against this. Give it back or " +
            "move it onto the right sheet first — voiding it would leave that money with " +
            "nothing behind it.");
        if (mode === "withdraw" && nowOwed <= 0.004)
          throw new Error("Nothing is owed on this any more, so there is nothing to withdraw. " +
            "To give money back, record a refund on the payment.");
        var patch = mode === "void"
          ? { voided_at: new Date().toISOString(), voided_by: S.me.id, void_reason: why }
          : { charge_withdrawn: true, charge_withdrawn_at: new Date().toISOString(),
              charge_withdrawn_by: S.me.id, charge_withdrawn_reason: why };
         
        var q = sb.from("invoices").update(patch).eq("id", inv.id);
        q = mode === "void" ? q.is("voided_at", null) : q.eq("charge_withdrawn", false);
        var r = await q.select();
        if (r.error) throw explain(r.error);
        if (!(r.data || []).length)
          throw new Error("Nothing moved. Somebody may have done it already — reload and look.");
        await reload(["money", "attention"]);
        closeModal();
        toast(mode === "void"
          ? "Voided — " + money(inv.total) + " was never owed."
          : "Not asking for it — " + money(nowOwed) + " off what they owe.");
        render();
      } catch (e) {
        toast(closedMonthMsg(e) ||
          (/charge_withdrawn_/.test(e.message)
            ? "Withdrawing a charge needs the latest bit of SQL run first."
            : e.message));
        btn.disabled = false;
      }
    }

    draw();
  }

        this.disabled = false;
      }
    });
  }
