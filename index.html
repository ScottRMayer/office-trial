<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e5a4f">
<title>United Termite — Office</title>
<style>
  /* ---------- palette / reset ---------- */
  :root{
    --ink:#1c2321; --ink-soft:#5b6b66; --line:#dfe5e2; --line-soft:#eef2f0;
    --bg:#f4f6f5; --card:#ffffff; --brand:#0e5a4f; --brand-soft:#e6f1ee;
    --accent:#0e5a4f;
    /* the calendar colour code — mirrored exactly, do not rename */
    --cal-salmon:#f4a58f;   /* Right in area (core Holiday City / Silver Ridge) */
    --cal-lgreen:#a9d99b;   /* Silverton */
    --cal-dgreen:#3f7d54;   /* Out of area */
    --cal-gray:#c3cbc8;     /* Cancellations */
    --cal-blue:#8fb4e0;     /* Bigger jobs — termite/vapor/half+ day */
    --warn:#b4552d; --gold:#caa23a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%;line-height:1.4}
  button{font-family:inherit}
  a{color:var(--brand)}

  /* ---------- shell ---------- */
  header.topbar{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
       display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;padding-top:max(.55rem,env(safe-area-inset-top))}
  header.topbar .logo{font-weight:700;letter-spacing:.2px;font-size:1.02rem;white-space:nowrap}
  header.topbar .logo small{display:block;font-weight:500;opacity:.8;font-size:.66rem;letter-spacing:.4px}
  header.topbar .spacer{flex:1}
  header.topbar .who{font-size:.78rem;opacity:.9}
  header.topbar .whobtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
       color:#fff;font-size:.78rem;padding:.3rem .6rem;border-radius:999px;cursor:pointer;min-height:36px;white-space:nowrap}
  header.topbar .whobtn:hover{background:rgba(255,255,255,.26)}
  /* screen lock — hides the book when the device is left sitting */
  .lockscreen{position:fixed;inset:0;background:var(--brand);z-index:60;display:none;
       align-items:center;justify-content:center;padding:1.5rem}
  .lockscreen.show{display:flex}
  .lockcard{background:#fff;border-radius:16px;padding:1.6rem;max-width:24rem;text-align:center;
       box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .demo-flag{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;
       font-size:.64rem;padding:.15rem .45rem;border-radius:999px;letter-spacing:.3px}

  header.topbar .gsearch{position:relative;flex:1;max-width:460px;margin:0 .2rem}
  header.topbar .gsearch input{width:100%;border:none;border-radius:999px;padding:.5rem .95rem;font-size:.9rem;
       background:rgba(255,255,255,.16);color:#fff;outline:none;min-height:40px}
  header.topbar .gsearch input::placeholder{color:rgba(255,255,255,.72)}
  header.topbar .gsearch input:focus{background:#fff;color:var(--ink)}
  .gresults{position:absolute;top:calc(100% + .35rem);left:0;right:0;background:#fff;color:var(--ink);
       border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.20);overflow:hidden;display:none;z-index:40}
  .gresults.show{display:block}
  .gres-item{display:flex;align-items:center;gap:.6rem;padding:.55rem .8rem;cursor:pointer;border-bottom:1px solid var(--line-soft)}
  .gres-item:last-child{border-bottom:none}
  .gres-item:hover{background:var(--brand-soft)}
  .gres-item .nm{font-weight:700}
  .gres-item .meta{font-size:.76rem;color:var(--ink-soft)}
  .gres-empty{padding:.75rem .8rem;color:var(--ink-soft);font-size:.85rem}

  nav.tabs .badge{display:inline-block;min-width:1.15rem;height:1.15rem;line-height:1.15rem;text-align:center;
       background:var(--warn);color:#fff;border-radius:999px;font-size:.68rem;margin-left:.35rem;padding:0 .32rem;vertical-align:1px}
  .queue-item.link{cursor:pointer}
  .queue-item.link:hover{background:var(--brand-soft)}

  nav.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);
       overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav.tabs button{flex:0 0 auto;background:none;border:none;padding:.85rem 1.05rem;font-size:.92rem;color:var(--ink-soft);
       border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;min-height:48px}
  nav.tabs button.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  /* ---- navigation: 5 daily tabs + a grouped "Everything else" menu ---- */
  .navwrap{position:sticky;top:0;z-index:16;background:var(--card)}
  /* pinned to the right edge so it never scrolls out of reach on a narrow screen */
  nav.tabs .morebtn{margin-left:auto;position:sticky;right:0;display:flex;align-items:center;gap:.35rem;
       color:var(--brand);font-weight:600;background:var(--card);box-shadow:-10px 0 12px -6px rgba(0,0,0,.10)}
  nav.tabs .morebtn .chev{font-size:.7rem;transition:transform .15s}
  nav.tabs .morebtn.open .chev{transform:rotate(180deg)}
  nav.tabs .morebtn.active{border-bottom-color:var(--brand)}
  .morepanel{position:absolute;right:.5rem;top:100%;z-index:30;display:none;
       background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.20);
       padding:.65rem;width:min(34rem,calc(100vw - 1rem));max-height:min(70vh,32rem);overflow:auto}
  .morepanel.show{display:block}
  .mp-grp{font-size:.62rem;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft);
       margin:.55rem .25rem .25rem;font-weight:700}
  .mp-grp:first-child{margin-top:.1rem}
  .mp-items{display:grid;grid-template-columns:1fr 1fr;gap:.3rem}
  @media(max-width:560px){.mp-items{grid-template-columns:1fr}}
  .mp-item{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;text-align:left;
       background:none;border:1px solid transparent;border-radius:10px;padding:.5rem .6rem;cursor:pointer;
       min-height:52px;justify-content:center;width:100%}
  .mp-item:hover{background:var(--brand-soft);border-color:#cfe2dc}
  .mp-item.active{background:var(--brand-soft);border-color:var(--brand)}
  .mp-item .mp-label{font-weight:650;font-size:.92rem;color:var(--ink);display:flex;align-items:center;gap:.35rem}
  .mp-item .mp-hint{font-size:.74rem;color:var(--ink-soft);line-height:1.25}

  main{max-width:1080px;margin:0 auto;padding:1rem;padding-bottom:4rem}
  h2.screen-title{margin:.2rem 0 .1rem;font-size:1.28rem}
  .sub{color:var(--ink-soft);font-size:.86rem;margin:0 0 1rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .pad{padding:1rem}
  .row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:9px;padding:.6rem .95rem;font-size:.9rem;cursor:pointer;min-height:44px}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .btn.mini{padding:.4rem .7rem;min-height:44px;font-size:.84rem}
  .muted{color:var(--ink-soft)}
  .pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;padding:.16rem .5rem;border-radius:999px;background:var(--line-soft);color:var(--ink-soft)}

  /* area dot (placeholder colours — to confirm) */
  .dot{display:inline-block;width:.72rem;height:.72rem;border-radius:50%;border:1px solid rgba(0,0,0,.15);vertical-align:-1px}

  /* ---------- Today / book ---------- */
  .daynav{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}
  .daynav .date{font-weight:600;font-size:1.05rem}
  .book{display:grid;grid-template-columns:3.2rem repeat(var(--techcols,2),1fr);gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .book .colhead{background:var(--brand-soft);color:var(--brand);font-weight:700;padding:.5rem;text-align:center;font-size:.9rem;border-bottom:1px solid var(--line)}
  .book .colhead.time{background:#eef2f0;color:var(--ink-soft)}
  .book .tcell{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);min-height:60px;padding:3px}
  .book .timecell{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line);font-size:.72rem;color:var(--ink-soft);padding:.35rem .3rem;text-align:right;background:#fafbfb}
  .book .noon{background:#f0efe9;color:var(--gold);text-align:center;font-size:.72rem;font-weight:600}
  .job{border-radius:7px;padding:.38rem .45rem;font-size:.86rem;color:#20302b;height:100%;cursor:pointer;position:relative;border:1px solid rgba(0,0,0,.08)}
  .job .cust{font-weight:700;line-height:1.18}
  .job .meta{font-size:.74rem;opacity:.88}
  /* the colour's name in words — hidden on screen, printed so a grey-scale
     printout still says which colour each job was */
  .colname{display:none;font-size:.62rem;color:#333}
  /* cancelled = a line through it on that date, exactly like the book */
  .job.struck .cust,.job.struck .meta{text-decoration:line-through;opacity:.65}

  /* ---------- the week ---------- */
  .weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:.25rem;align-items:start}
  @media(max-width:820px){.weekgrid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:560px){.weekgrid{grid-template-columns:repeat(2,1fr)}}
  .wkcol{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:6rem}
  .wkcol.istoday{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .wkhead{padding:.3rem .35rem;border-bottom:1px solid var(--line-soft);cursor:pointer;background:#fafbfb}
  .wkhead:hover{background:var(--brand-soft)}
  .wkdow{font-size:.6rem;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft)}
  .wknum{font-size:1.05rem;font-weight:800;line-height:1.05}
  .wkcount{font-size:.62rem;color:var(--ink-soft)}
  .wkbar{height:3px;background:var(--line-soft);border-radius:2px;margin-top:.2rem;overflow:hidden}
  .wkbar i{display:block;height:100%}
  .wkhol{font-size:.58rem;color:var(--warn);font-weight:700;margin-top:.15rem}
  .wkareas{display:flex;gap:.15rem;margin-top:.22rem;align-items:center}
  .wkareas .dot{width:.5rem;height:.5rem}
  .wkbody{padding:.2rem}
  .wkjob{display:flex;align-items:center;gap:.2rem;font-size:.66rem;border-radius:5px;
       padding:.16rem .22rem;margin-bottom:.15rem;cursor:pointer;color:#20302b;border:1px solid rgba(0,0,0,.07)}
  .wkjob:hover{filter:brightness(.96)}
  .wkjob.struck .wkname{text-decoration:line-through;opacity:.7}
  .wktime{font-weight:700;min-width:.85rem}
  .wkname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .wkarea{font-size:.56rem;opacity:.8}
  .wkmark{font-size:.55rem;font-weight:800}
  .wktech{font-size:.55rem;background:rgba(255,255,255,.6);border-radius:3px;padding:0 .15rem;font-weight:700}
  .wkempty{color:var(--ink-soft);font-size:.7rem;text-align:center;padding:.5rem 0}

  /* ---------- the month ---------- */
  .monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:.2rem}
  .modow{font-size:.6rem;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft);
       text-align:center;padding:.2rem 0;font-weight:700}
  .mocell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:4.4rem;
       padding:.25rem .3rem;cursor:pointer;display:flex;flex-direction:column;gap:.15rem}
  .mocell:hover{border-color:var(--brand);background:var(--brand-soft)}
  .mocell.outside{opacity:.4}
  .mocell.istoday{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .morow{display:flex;justify-content:space-between;align-items:center}
  .monum{font-weight:700;font-size:.85rem}
  .mocount{font-size:.6rem;background:var(--line-soft);color:var(--ink-soft);border-radius:999px;padding:0 .3rem;font-weight:700}
  .mocount.full{background:#fbe9e3;color:var(--warn)}
  .mohol{font-size:.55rem;color:var(--warn);font-weight:700;line-height:1.1}
  .mobars{display:flex;flex-wrap:wrap;gap:.12rem;align-items:center;margin-top:auto}
  .mobars i{display:block;height:.42rem;flex:1 1 40%;min-width:.8rem;border-radius:2px;border:1px solid rgba(0,0,0,.06)}
  .momore{font-size:.55rem;color:var(--ink-soft)}
  @media(max-width:560px){.mocell{min-height:3.4rem}.monum{font-size:.75rem}}
  .job .st{position:absolute;top:2px;right:4px;font-size:.62rem;font-weight:700}
  .legend{display:flex;gap:.7rem;flex-wrap:wrap;margin:.6rem 0 0;font-size:.72rem;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:.3rem}
  .swatch{width:.8rem;height:.8rem;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.1)}

  /* ---------- state chips ---------- */
  .states{display:inline-flex;gap:.25rem}
  .stchip{width:2.2rem;height:2.2rem;border-radius:8px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;color:var(--ink-soft);background:#fff}
  .stchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.stchip{cursor:pointer;padding:0}
  .modal{position:relative}
  .modal-x{position:absolute;top:.4rem;right:.5rem;width:44px;height:44px;border:none;background:none;font-size:1.25rem;color:var(--ink-soft);cursor:pointer;border-radius:10px;z-index:2}
  .modal-x:hover{background:var(--line-soft)}

  /* ---------- customers ---------- */
  .clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.7rem}
  .ccard{cursor:pointer}
  .ccard:hover{border-color:var(--brand)}
  .ccard .name{font-weight:700}
  .search{width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:10px;font-size:1rem;margin-bottom:.9rem}
  .star{color:var(--gold)}
  .timeline{border-left:2px solid var(--line);margin:.4rem 0 0 .3rem;padding-left:.85rem}
  .tl-item{position:relative;padding:.35rem 0;font-size:.85rem}
  .tl-item::before{content:"";position:absolute;left:-1.02rem;top:.62rem;width:.5rem;height:.5rem;border-radius:50%;background:var(--brand)}
  .tl-item.call::before{background:#c9c2b0}
  .tl-item.quote::before{background:var(--gold)}
  .tl-item.money::before{background:var(--warn)}
  .tl-item.money{color:var(--warn)}
  .tl-who{font-size:.66rem;color:var(--ink-soft);background:var(--line-soft);padding:.05rem .3rem;
       border-radius:999px;margin-left:.3rem;white-space:nowrap}
  .tl-edit{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:.85rem;
       padding:.1rem .3rem;border-radius:5px;opacity:.45;margin-left:.2rem}
  .tl-item:hover .tl-edit{opacity:1}
  .tl-edit:hover{background:var(--line-soft);color:var(--brand)}
  @media(hover:none){.tl-edit{opacity:.8}}
  .tl-date{font-weight:600}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;font-size:.88rem}
  .kv dt{color:var(--ink-soft)}
  .kv dd{margin:0}

  /* ---------- render sheet ---------- */
  .rs{background:#fff;border:1px solid var(--ink);border-radius:6px;max-width:760px;margin:0 auto;font-size:.82rem}
  .rs .rs-head{text-align:center;border-bottom:2px solid var(--ink);padding:.6rem}
  .rs .rs-head .co{font-weight:800;font-size:1.05rem;letter-spacing:.3px}
  .rs .rs-head .lic{font-size:.66rem;color:#333}
  .rs .rs-title{text-align:center;font-weight:800;letter-spacing:2px;padding:.3rem;background:#f3f1ea;border-bottom:1px solid var(--ink)}
  .rs-sec{border-bottom:1px solid #cfcfcf;padding:.5rem .6rem}
  .rs-sec h4{margin:0 0 .35rem;font-size:.7rem;letter-spacing:.6px;color:#6a6a6a;text-transform:uppercase}
  .rs-grid{display:grid;grid-template-columns:1fr 1fr;gap:.15rem .8rem;font-size:.8rem}
  .rs-line{display:flex;justify-content:space-between;border-bottom:1px dotted #ccc;padding:.12rem 0}
  .chk{display:inline-block;width:.85rem;height:.85rem;border:1px solid #555;border-radius:2px;text-align:center;line-height:.8rem;font-size:.7rem;margin-right:.3rem;vertical-align:-1px}
  .chk.x{background:#20302b;color:#fff}
  .materials{columns:2;font-size:.7rem;color:#333}
  /* the real form's bands, checkbox columns and materials table */
  .rs-band{background:#3a3a3a;color:#fff;text-align:center;font-weight:700;font-size:.7rem;
       letter-spacing:1px;padding:.12rem;margin:-.5rem -.6rem .4rem;text-transform:uppercase}
  .fcols{display:grid;grid-template-columns:repeat(4,1fr);gap:.1rem .5rem;font-size:.72rem}
  .fcols.five{grid-template-columns:repeat(5,1fr)}
  @media(max-width:700px){.fcols,.fcols.five{grid-template-columns:1fr 1fr}}
  .fbox{padding:.06rem 0;border-radius:3px;line-height:1.3}
  .rs .fbox{cursor:default}
  .fbox.on{font-weight:650}
  .rs-sec .fbox[onclick]{cursor:pointer}
  .rs-sec .fbox[onclick]:hover{background:#eef4f2}
  .fline{width:100%;border:none;border-bottom:1px solid #999;font-size:.7rem;padding:.1rem 0;background:none;font-family:inherit}
  .fnotes{width:100%;min-height:4.2rem;border:1px solid #ccc;border-radius:3px;font-size:.72rem;padding:.25rem;
       font-family:inherit;resize:vertical;background:none}
  .mattable{width:100%;border-collapse:collapse;font-size:.62rem}
  .mattable th{background:#f0f0f0;border:1px solid #bbb;padding:.1rem .2rem;font-size:.58rem}
  .mattable td{border:1px solid #ccc;padding:.05rem .15rem;vertical-align:middle}
  .mattable td:nth-child(1),.mattable td:nth-child(3),.mattable td:nth-child(4),.mattable td:nth-child(6){width:2.6rem}
  .matname{line-height:1.15}
  .matname.on{background:#eef4f2;font-weight:650}
  .rs-sec .matname[onclick]{cursor:pointer}
  .rs-sec .matname[onclick]:hover{background:#eef4f2}
  .matname .epa{display:block;color:#777;font-size:.55rem}
  .fcell{width:100%;border:none;background:none;font-size:.62rem;font-family:inherit;text-align:center}
  .fcellv{display:block;text-align:center;font-size:.62rem}
  .legalblk{font-size:.6rem;color:#555;line-height:1.35}
  .money{display:grid;grid-template-columns:1fr auto;gap:.15rem .8rem;max-width:300px;margin-left:auto;font-size:.85rem}
  .money .tot{font-weight:800;border-top:1px solid var(--ink);padding-top:.2rem}
  .filecode{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}

  /* ---------- calls / routing ---------- */
  .calls-wrap{display:grid;grid-template-columns:1.15fr 1fr;gap:1rem}
  @media(max-width:820px){.calls-wrap{grid-template-columns:1fr}}
  .queue-item{display:flex;align-items:center;gap:.6rem;padding:.6rem;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .queue-item:hover{background:var(--brand-soft)}
  .queue-item.done{opacity:.5}
  .assist{position:sticky;top:4.5rem}
  .assist .hit{border-left:3px solid var(--cal-salmon);padding:.4rem .6rem;margin:.4rem 0;background:#fbf8f6;border-radius:0 8px 8px 0;font-size:.83rem}
  .assist .big{font-weight:700;color:var(--brand)}

  .toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:10px;font-size:.88rem;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none}
  .toast.show{opacity:1}

  .banner{background:var(--brand-soft);border:1px solid #cfe2dc;color:#28453e;border-radius:10px;padding:.7rem .9rem;font-size:.84rem;margin-bottom:1rem}

  .modal-bg{position:fixed;inset:0;background:rgba(20,30,26,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:1rem}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow:auto}

  /* mailing labels + postcards */
  .label-sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:.15rem;background:#fff;border:1px solid var(--line);border-radius:8px;padding:.4rem}
  .label{border:1px dashed #d8d8d8;border-radius:4px;padding:.5rem .6rem;font-size:.8rem;line-height:1.3;min-height:2.6rem}
  .postcard{border:1px solid var(--ink);border-radius:8px;padding:1rem 1.2rem;max-width:540px;margin:.6rem auto;background:#fff;page-break-after:always}
  /* Avery 5160 registration: 3 across, 10 down, 2.625in x 1in, .1875in side margin */
  .label-sheet.avery{grid-template-columns:repeat(3,2.625in);gap:0;padding:0;border:none;justify-content:center}
  .label-sheet.avery .label{width:2.625in;height:1in;border:1px dotted #e2e2e2;border-radius:0;
       padding:.12in .18in;font-size:9.5pt;line-height:1.22;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
  @media print{
    .label-sheet.avery{margin:0}
    .label-sheet.avery .label{border-color:transparent}
  }
  .postcard .stamp{float:right;border:1px dashed #bbb;width:3rem;height:3.4rem;font-size:.52rem;color:#aaa;text-align:center;padding-top:.55rem;border-radius:3px}
  .barrow{display:flex;gap:.6rem;align-items:center;margin:.28rem 0;flex-wrap:nowrap}

/* ---- REAL numbers, counted from the book ----
   The month-box load is how many properties are actually due each month, and
   revenue is what's actually been done. No invented figures. */
function monthLoad(){
  const out=new Array(12).fill(0);
  CUST.forEach(c=>{
    if(c.inactive) return;
    if(c.preSched){ [5,6,7,8,9].forEach(m=>out[m-1]++); return; }
    propList(c).forEach(p=>{ if(p.month>=1&&p.month<=12) out[p.month-1]++; });
  });
  return out;
}
/* money COLLECTED — a card that bounced or was never run is not revenue */
function revenueByMonth(year){
  const out=new Array(12).fill(0);
  for(const d in SCHED){
    const dt=parseISO(d); if(dt.getFullYear()!==year) continue;
    for(const t in SCHED[d]) for(const tm in SCHED[d][t]){
      const s=SCHED[d][t][tm];
      if(s.cid && s.done && !s.cancelled && s.pay && s.pay.run) out[dt.getMonth()]+=slotTotal(s);
    }
  }
  return out;
}
function jobsByMonth(year){
  const out=new Array(12).fill(0);
  for(const d in SCHED){
    const dt=parseISO(d); if(dt.getFullYear()!==year) continue;
    for(const t in SCHED[d]) for(const tm in SCHED[d][t]){
      const s=SCHED[d][t][tm]; if(s.cid && s.done && !s.cancelled) out[dt.getMonth()]++;
    }
  }
  return out;
}
/* what kind of work the money came from — counted, not assumed */
function serviceMix(year){
  const buckets={"Pest & termite":0,"Crawlspace & building envelope":0,"Home services":0};
  const which=svc=>/termite|pest|spray|ant|bee|rodent|mice|cricket|roach|spider|tick|bait/i.test(svc)?"Pest & termite"
    :/vapor|insulation|waterproof|crawl|mold|fungus|vent(?!.*dryer)|foundation vent|exclusion/i.test(svc)?"Crawlspace & building envelope"
    :"Home services";
  let total=0;
  for(const d in SCHED){
    const dt=parseISO(d); if(dt.getFullYear()!==year) continue;
    for(const t in SCHED[d]) for(const tm in SCHED[d][t]){
      const s=SCHED[d][t][tm]; if(!s.cid||!s.done||s.cancelled||!(s.pay&&s.pay.run)) continue;
      slotLines(s,"").forEach(l=>{ buckets[which(l.service)]+=l.price; total+=l.price; });
    }
  }
  return {buckets, total};
}

  try{

function viewMonth(dateArg){
  const date=(dateArg&&/^\d{4}-\d{2}-\d{2}$/.test(dateArg))?dateArg:TODAY_ISO;
  const anchor=parseISO(date);
  const y=anchor.getFullYear(), m=anchor.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const gridStart=sundayOf(first);
  const weeks=Math.ceil((last.getDate()+first.getDay())/7);
  const cells=[...Array(weeks*7)].map((_,i)=>iso(addDays(gridStart,i)));
  const prevM=iso(new Date(y,m-1,1)), nextM=iso(new Date(y,m+1,1));
  const cap=dayCapacity();
  let monthJobs=0, monthMoney=0;
  cells.forEach(d=>{ if(parseISO(d).getMonth()!==m) return;
    allDayJobs(d).filter(x=>!x.s.cancelled).forEach(x=>{monthJobs++; monthMoney+=slotTotal(x.s);}); });
  /* how many folders are due to be CALLED this month — the other half of her month */
  const dueThisMonth=propsDue(m+1).length;

  const cell=dISO=>{
    const dt=parseISO(dISO); const inMonth=dt.getMonth()===m;
    const jobs=allDayJobs(dISO); const live=jobs.filter(x=>!x.s.cancelled);
    const hol=holidayHit(dt);
    const load=Math.round(live.length/cap*100);
    const isToday=dISO===TODAY_ISO;
    return `<div class="mocell${inMonth?'':' outside'}${isToday?' istoday':''}" onclick="location.hash='today/${dISO}'">
      <div class="morow">
        <span class="monum">${dt.getDate()}</span>
        ${live.length?`<span class="mocount${load>=90?' full':''}">${live.length}</span>`:''}
      </div>
      ${hol?`<div class="mohol">${hol}</div>`:''}
      <div class="mobars">
        ${jobs.slice(0,5).map(({s})=>{
          const c=byIdSafe(s.cid), jp=propAt(c,s.pid);
          const cc=calColor({area:jp.area,big:s.big,cancelled:s.cancelled});
          return `<i style="background:${cc.v}" title="${escapeHtml(c.name)}"></i>`;}).join("")}
        ${jobs.length>5?`<span class="momore">+${jobs.length-5}</span>`:''}
      </div>
    </div>`;
  };

  main.innerHTML="";
  main.appendChild(el(`<div>
    <h2 class="screen-title">${["January","February","March","April","May","June","July","August","September","October","November","December"][m]} ${y}</h2>
    <p class="sub">${monthJobs} job${monthJobs===1?'':'s'} booked${monthMoney?` · ${money(monthMoney)} of work`:''} · ${dueThisMonth} folder${dueThisMonth===1?'':'s'} due to be called this month. Tap any day to open the book.</p>
    ${bookSwitcher('month',date)}
    <div class="daynav noprint">
      <button class="btn ghost mini" onclick="location.hash='month/${prevM}'">‹ ${MONTHS[(m+11)%12]}</button>
      <button class="btn ghost mini" onclick="location.hash='month/${nextM}'">${MONTHS[(m+1)%12]} ›</button>
      ${(y===THIS_YEAR&&m===THIS_MONTH-1)?'':`<button class="btn ghost mini" onclick="location.hash='month'">This month</button>`}
      <span style="flex:1"></span>
      <button class="btn ghost mini" onclick="window.print()">🖨 Print the month</button>
    </div>
    <div class="monthgrid">
      ${DOW_SHORT.map(d=>`<div class="modow">${d}</div>`).join("")}
      ${cells.map(cell).join("")}
    </div>
    <div class="legend">
      <strong style="color:var(--ink)">Calendar colours:</strong>
      <span><i class="swatch" style="background:var(--cal-salmon)"></i>Right in area</span>
      <span><i class="swatch" style="background:var(--cal-lgreen)"></i>Silverton</span>
      <span><i class="swatch" style="background:var(--cal-dgreen)"></i>Out of area</span>
      <span><i class="swatch" style="background:var(--cal-blue)"></i>Bigger job</span>
      <span><i class="swatch" style="background:var(--cal-gray)"></i>Cancelled</span>
      <span style="flex:1"></span><span>A red count means the day is full</span>
    </div>
  </div>`));
}

/* REAL upcoming work, straight out of the book — this is what lets her say
   "we'll already be on your street Tuesday". Derived, never a fixed list. */
function upcomingBookings(days){
  const out=[];
  const horizon=days||21;
  for(let i=0;i<=horizon;i++){
    const key=iso(addDays(TODAY,i)); const day=SCHED[key]; if(!day) continue;
    for(const tech in day) for(const tm in day[tech]){
      const s=day[tech][tm]; if(!s.cid||s.cancelled) continue;
      const cu=byId(s.cid); if(!cu) continue;
      const pr=propAt(cu,s.pid);
      out.push({date:key, day:fmtDayShort(key), area:pr.area, cust:cu.name,
        addr:pr.addr, tech, time:tm, sort:i*100+tmVal(tm)});
    }
  }
  return out.sort((a,b)=>a.sort-b.sort);
}
function pickCall(id,pid){
  const c=byId(id); if(!c)return;
  const prop=propAt(c,pid);
  const week=upcomingBookings(21);
  const near=week.filter(w=>w.area===prop.area);
  const adj=week.filter(w=>w.area!==prop.area && areaOf(w.area).core && areaOf(prop.area).core);
  const hit = near.slice(0,6).map(w=>`<div class="hit"><span class="big">${w.day} @ ${w.time}:00</span> — ${w.tech} at ${escapeHtml(w.cust)}, ${escapeHtml(w.addr)}
      <button class="btn mini" style="margin-left:.4rem" onclick="openBookModal(${c.id},{tech:'${w.tech}',date:'${w.date}',pid:'${prop.pid}'})">Book alongside</button></div>`).join("");
  const assist=document.getElementById("assist");
  assist.innerHTML="";
  assist.appendChild(el(`<div class="card"><div class="pad">
    <div class="row" style="justify-content:space-between">
      <div><div style="font-weight:800">${escapeHtml(c.name)}</div><div class="muted">${escapeHtml(prop.addr)} · ${areaOf(prop.area).name}</div></div>
      ${areaTag(prop.area)}
    </div>
    ${propList(c).length>1?`<div class="muted" style="font-size:.76rem;margin-top:.3rem">This folder has ${propList(c).length} addresses — you're booking <b>${escapeHtml(prop.addr)}</b>.</div>`:''}
    <div style="margin:.8rem 0 .3rem;font-size:.72rem;letter-spacing:.5px;color:var(--ink-soft)">ALREADY BOOKED IN ${prop.area||'this area'}</div>
    ${hit || `<div class="muted" style="font-size:.85rem">Nothing booked in ${prop.area||'this area'} yet — this call starts the cluster.</div>`}
    ${adj.length?`<div style="margin:.8rem 0 .3rem;font-size:.72rem;letter-spacing:.5px;color:var(--ink-soft)">NEARBY CORE AREAS</div>
      ${adj.slice(0,3).map(w=>`<div class="hit" style="border-left-color:var(--line)">${w.day} @ ${w.time}:00 — ${escapeHtml(w.cust)} (${w.area})</div>`).join("")}`:''}
    <div class="row" style="margin-top:1rem">

  </div></div>`));
}
/* ---- cancel · reschedule · rained out ----

   it changes from am to pm or if they change the services."
   Rain: the sheet stays with the tech — he fits them in over the next few days,

function cancelJob(date,tech,tm){
  const s=SCHED[date][tech][tm], c=byIdSafe(s.cid);

let RESCHED=null;
function openRescheduleModal(date,tech,tm){

function reschedSet(k,v){ RESCHED[k]=v; renderRescheduleModal(); }
function renderRescheduleModal(){

  const techDay=(SCHED[R.date]||{})[R.tech]||{};

          ${slots.map(t=>{const taken=techDay[t]&&techDay[t].cid&&!(R.date===R.from.date&&R.tech===R.from.tech&&t===R.from.tm);
            return `<option value="${t}" ${taken?'disabled':''} ${t===R.from.tm?'selected':''}>${t}:00${taken?' — taken':''}</option>`;}).join("")}
        </select></div>
    </div>
    <div class="muted" style="font-size:.78rem;margin-top:.6rem">If the morning/afternoon or the services change, the sheet gets rewritten — it'll tell you.</div>

function doReschedule(){
  const R=RESCHED; if(!R)return;
  const from=R.from, s=SCHED[from.date][from.tech][from.tm], c=byIdSafe(s.cid);
  const tm=(document.getElementById('rs_tm')||{}).value||from.tm;
  const day=(SCHED[R.date]=SCHED[R.date]||{}); const techDay=(day[R.tech]=day[R.tech]||{});
  if(techDay[tm]&&techDay[tm].cid&&!(R.date===from.date&&R.tech===from.tech&&tm===from.tm)){
    toast('That slot is taken — pick another'); renderRescheduleModal(); return; }
  const wasAM=(+from.tm>=7&&+from.tm<12), nowAM=(+tm>=7&&+tm<12);
  const moved=Object.assign({},s,{st:{x:false,w:false,ret:false}});
  delete moved.rained; delete moved.notHome;
  /* AM↔PM flip means the written sheet is wrong — force a rewrite */
  if(wasAM!==nowAM && moved.sheet) moved.needsRewrite=true;
  delete SCHED[from.date][from.tech][from.tm];
  techDay[tm]=moved;
  if(!c.missing) c.log.push({who:auditWho(),d:fmtToday(),t:'call',
    txt:`Moved — ${fmtDayShort(from.date)} ${from.tm}:00 → ${fmtDayShort(R.date)} ${tm}:00 (${R.tech})`});
  persist(); closeModal(); RESCHED=null;
  toast(wasAM!==nowAM
    ? `Moved to ${fmtDayShort(R.date)} ${tm}:00 — AM/PM changed, rewrite the sheet`
    : `Moved to ${fmtDayShort(R.date)} at ${tm}:00`);
  router();
}

function captureBookInputs(){

function saveBooking(){
  const b=BOOK_CTX; if(!b)return; const c=byId(b.cid);

  const tm=b.tm||(document.getElementById('bk_tm')||{}).value;
  if(!tm){ toast('Pick a time'); return; }
  if(!b.lines.length){ toast('Add at least one service'); return; }
  const lines=b.lines.map(l=>({service:l.service, price:(l.price!=null?l.price:priceFor(l.service,c.area))}));
  const day=(SCHED[b.date]=SCHED[b.date]||{}); const techDay=(day[b.tech]=day[b.tech]||{});
  if(techDay[tm]&&techDay[tm].cid){ toast('That slot just filled — pick another'); renderBookModal(); return; }
  const bigTest=s=>/treatment|crawlspace|vapor|insulation/i.test(s);
  techDay[tm]={cid:c.id, pid:(b.pid&&String(b.pid)!=="0")?b.pid:undefined,
    service:lines[0].service, price:lines[0].price,
    lines:(lines.length>1?lines:undefined), taxRate:TAX_RATE,
    st:{x:false,w:false,ret:false}, big:lines.some(l=>bigTest(l.service))};
  markCalled(callKey(c.id,b.pid));
  if(c.recall) delete c.recall;                          // out of the recall box — they booked
  const bp=propAt(c,b.pid);
  c.log.push({who:auditWho(),d:fmtToday(),t:'job',txt:`Booked — ${lines.map(l=>l.service).join(" + ")}, ${fmtDayShort(b.date)} at ${tm}:00 (${b.tech})${!bp.primary?` — ${bp.addr}`:''}`});
  if(b.leadId){ const l=LEADS.find(x=>x.id===b.leadId); if(l){ l.scheduled=true; l.note=`On the calendar — ${fmtDayShort(b.date)}, ${b.tech}`; } }
  persist(); closeModal(); BOOK_CTX=null; updateBadges();
  toast(`${c.name} — in the book, ${fmtDayShort(b.date)} at ${tm}:00 with ${b.tech}`);
  router();
}

const digits=s=>String(s||"").replace(/\D/g,"");
function findPossibleDuplicate(name,addr,phone){
  const n=name.toLowerCase().trim(), a=addr.toLowerCase().replace(/\s+/g,' ').trim(), p=digits(phone);
  return CUST.find(c=>{
    if(p&&p.length>=7&&digits(c.phone)===p) return true;
    if(!n) return false;
    if(c.name.toLowerCase().trim()!==n) return false;
    return a? (c.addr||"").toLowerCase().replace(/\s+/g,' ').trim()===a : true;
  });
}

/* ---------------- THE SERVICE LOG — her own notes ----------------
   The folder cover is a handwritten chronological log: jobs, calls,
   no-answers, quotes with reasoning, prices. She must be able to write
   in it herself, and to back-date an entry so it lands in order. */
const LOG_KINDS=[
  {t:'job',   label:'Service done'},
  {t:'call',  label:'Phone call / message'},
  {t:'quote', label:'Quote or estimate'},
  {t:'money', label:'Payment note'},
];
function parseLogDate(s){
  const m=/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/.exec(String(s||"").trim());
  if(!m) return null;
  let y=+m[3]; if(y<100) y+=(y>50?1900:2000);
  return new Date(y,+m[1]-1,+m[2]);
}
function logSortKey(e){ return e.iso?parseISO(e.iso):parseLogDate(e.d); }
function sortLog(c){
  if(!c||!Array.isArray(c.log))return;
  c.log.sort((a,b)=>{const da=logSortKey(a),db=logSortKey(b);
    if(!da&&!db)return 0; if(!da)return 1; if(!db)return -1; return da-db;});
}
function openLogNoteModal(cid,idx){
  const c=byId(cid); if(!c)return;
  const editing=(idx!=null&&c.log[idx]);
  const e=editing?c.log[idx]:null;
  const isoVal=e?(e.iso||(()=>{const d=parseLogDate(e.d);return d?iso(d):TODAY_ISO;})()):TODAY_ISO;
  const kind=e?e.t:'call';
  showModal(`<div class="pad">
    <div style="font-weight:800;font-size:1.05rem">${editing?'Edit this note':'Add a note to the log'}</div>
    <div class="muted" style="margin:.15rem 0 .8rem;font-size:.85rem">${c.name} — ${escapeHtml(c.addr)}</div>
    <div class="rs-grid" style="gap:.55rem .8rem">
      <div><label class="muted" style="font-size:.78rem">Date</label>
        <input type="date" id="ln_date" class="search" style="margin:.2rem 0 0" value="${isoVal}">
        <div class="muted" style="font-size:.7rem;margin-top:.15rem">Back-date it and it slots into the right place.</div></div>
      <div><label class="muted" style="font-size:.78rem">What kind of note</label>
        <select id="ln_kind" class="search" style="margin:.2rem 0 0">
          ${LOG_KINDS.map(k=>`<option value="${k.t}" ${k.t===kind?'selected':''}>${k.label}</option>`).join("")}
        </select></div>
    </div>
    <label class="muted" style="font-size:.78rem;display:block;margin-top:.6rem">The note — exactly as you'd write it on the folder</label>
    <textarea id="ln_txt" class="tpl-edit" style="height:90px" placeholder="e.g. left message · 9–12 termite 75.00 · quoted 650 TT — new tunnels in crawl toward back of home">${e?escapeHtml(e.txt):''}</textarea>
    <div class="row" style="margin-top:.5rem">
      <button class="btn" onclick="saveLogNote(${cid},${editing?idx:'null'})">${editing?'Save the note':'Add it to the log'}</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      ${editing?`<span style="flex:1"></span><button class="btn ghost" style="color:var(--warn);border-color:var(--warn)" onclick="confirmDeleteLogNote(${cid},${idx})">Delete</button>`:''}
    </div>
  </div>`);
}
function saveLogNote(cid,idx){
  const c=byId(cid); if(!c)return;
  const txt=sanitizeField((document.getElementById('ln_txt')||{}).value||"");
  const isoV=(document.getElementById('ln_date')||{}).value||TODAY_ISO;
  const t=(document.getElementById('ln_kind')||{}).value||'call';
  if(!txt){ toast('Write the note first'); return; }
  const d=parseISO(isoV);
  const entry={who:auditWho(), d:`${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}`, iso:isoV, t, txt, manual:true};
  if(idx!=null&&c.log[idx]) c.log[idx]=Object.assign({},c.log[idx],entry);
  else c.log.push(entry);
  sortLog(c); persist(); closeModal();
  toast(idx!=null?'Note updated':'Note added to the log');
  location.hash='cust/'+cid; router();
}
function confirmDeleteLogNote(cid,idx){
  const c=byId(cid); if(!c||!c.log[idx])return;
  showModal(`<div class="pad">
    <div style="font-weight:800">Delete this note?</div>

    <div class="row">
      <button class="btn" style="background:var(--warn)" onclick="deleteLogNote(${cid},${idx})">Yes, delete it</button>
      <button class="btn ghost" onclick="openLogNoteModal(${cid},${idx})">Keep it</button>
    </div></div>`);
}
function deleteLogNote(cid,idx){
  const c=byId(cid); if(!c||!c.log[idx])return;
  c.log.splice(idx,1); persist(); closeModal();

function savePropertyEdits(cid,pid){
  const c=byId(cid); if(!c)return;
  const g=id=>sanitizeField((document.getElementById(id)||{}).value||"");
  const addr=g('pr_addr');

    zip:g('pr_zip'), star:!!(document.getElementById('pr_star')||{}).checked, ft:g('pr_ft'),
    warrantyExp:(warr>1900&&warr<2200)?warr:null};
  if(pid==null){
    addProperty(c,patch);

    toast(`${addr} added to ${c.name}'s folder`);
  } else {
    propWrite(c,pid,patch);
    c.log.push({who:auditWho(),d:fmtToday(),t:'call',txt:`Address updated — ${addr}`});
    toast('Address saved');
  }
  persist(); closeModal(); location.hash='cust/'+cid; router();

function removeProperty(cid,pid){
  const c=byId(cid); if(!c)return;
  const used=(()=>{ for(const d in SCHED) for(const t in SCHED[d]) for(const tm in SCHED[d][t]){
    const s=SCHED[d][t][tm]; if(s.cid===cid && String(s.pid||0)===String(pid)) return true; } return false; })();
  if(used){ toast("That address has jobs in the book — it can't be removed"); return; }
  const p=propAt(c,pid);
  c.props=(c.props||[]).filter(x=>String(x.pid)!==String(pid));
  c.log.push({who:auditWho(),d:fmtToday(),t:'call',txt:`Address removed — ${p.addr}`});
  persist(); closeModal(); toast('Address removed'); location.hash='cust/'+cid; router();
}

function saveCustomerEdits(id){
  const c=byId(id); if(!c)return;
  const g=eid=>sanitizeField((document.getElementById(eid)||{}).value||"");
  const name=g('ec_name');
  if(!name){ toast('A last name is needed'); return; }
  const newMonth=parseInt(g('ec_month'),10)||0;
  const newArea=g('ec_area');
  const changes=[];
  if(name!==c.name) changes.push(`name → ${name}`);
  if(g('ec_addr')!==c.addr) changes.push('address');
  if(g('ec_phone')!==c.phone) changes.push('phone');
  if(newArea!==(c.area||"")) changes.push(`area → ${newArea||'unset'}`);
  if(newMonth!==(c.month||0)) changes.push(`month box ${c.month?MONTHS[c.month-1]:'unset'} → ${newMonth?MONTHS[newMonth-1]:'unset'}`);
  c.name=name; c.first=g('ec_first'); c.addr=g('ec_addr')||"(no street address yet)";
  c.phone=g('ec_phone'); c.area=newArea; c.month=newMonth;
  const star=!!(document.getElementById('ec_star')||{}).checked;
  const ft=g('ec_ft'); const warr=parseInt(g('ec_warr'),10);
  if(star!==!!c.star||ft!==(c.ft||"")||(warr||0)!==(c.warrantyExp||0)) changes.push('termite history');
  c.star=star; c.ft=ft;
  if(warr>1900&&warr<2200) c.warrantyExp=warr; else delete c.warrantyExp;
  if(changes.length) c.log.push({who:auditWho(),d:fmtToday(),t:'call',txt:`Folder updated — ${changes.join(', ')}`});
  persist(); closeModal();
  toast(changes.length?`${c.name}'s folder updated`:`No changes`);
  location.hash='cust/'+c.id; router();
}
/* Deleting is only for junk that never should have been a folder (a vendor row,
   a duplicate). Anything with real history gets set aside instead — never erased. */
function customerHistory(id){
  let jobs=0,paid=0;
  for(const d in SCHED) for(const t in SCHED[d]) for(const tm in SCHED[d][t]){
    const s=SCHED[d][t][tm]; if(s.cid!==id) continue; jobs++; if(s.pay&&s.pay.run) paid++;
  }
  return {jobs, paid, quotes:LEADS.filter(l=>l.cid===id).length};
}
function confirmDeleteCustomer(id){
  const c=byId(id); if(!c)return; const h=customerHistory(id);
  const hasHistory=h.jobs>0||h.paid>0||h.quotes>0;
  showModal(`<div class="pad">
    <div style="font-weight:800">Delete ${escapeHtml(c.name)}'s folder?</div>
    ${hasHistory
      ? `<div class="banner" style="margin:.6rem 0;background:#fbe9e3;border-color:#f0cfc2;color:var(--warn)">
          This folder has history — ${h.jobs} job${h.jobs===1?'':'s'}${h.paid?`, ${h.paid} paid`:''}${h.quotes?`, ${h.quotes} quote${h.quotes===1?'':'s'}`:''}.
          Deleting would leave that work with no customer attached. <b>Set it aside instead</b> — it disappears from the calling list but the record survives.</div>
        <div class="row">
          <button class="btn" onclick="openInactiveModal(${id})">Set it aside instead</button>
          <button class="btn ghost" onclick="openEditCustomerModal(${id})">Cancel</button>
          <span style="flex:1"></span>
          <button class="btn ghost mini" style="color:var(--warn);border-color:var(--warn)" onclick="deleteCustomer(${id})">Delete anyway</button>
        </div>`
      : `<div class="muted" style="margin:.5rem 0 .8rem;font-size:.87rem">No jobs, payments or quotes are attached — safe to remove. This can't be undone (a backup can restore it).</div>
        <div class="row">
          <button class="btn" style="background:var(--warn)" onclick="deleteCustomer(${id})">Yes, delete the folder</button>
          <button class="btn ghost" onclick="openEditCustomerModal(${id})">Keep it</button>
        </div>`}
  </div>`);
}
function deleteCustomer(id){
  const c=byId(id); if(!c)return; const nm=c.name;
  CUST=CUST.filter(x=>x.id!==id);
  LEADS=LEADS.filter(l=>l.cid!==id);
  unmarkCalled(id);
  persist(); closeModal(); updateBadges();
  toast(`${nm}'s folder deleted`);
  location.hash='customers'; router();
}
function reactivateCustomer(id){
  const c=byId(id); if(!c)return;
  delete c.inactive; delete c.recall;
  c.log.push({who:auditWho(),d:fmtToday(),t:'call',txt:`Folder brought back into the ${c.month?MONTHS[c.month-1]:'month'} box`});
  persist(); closeModal();
  toast(`${c.name} is back in the rotation`);
  location.hash='cust/'+c.id; router();
}

const FORM_SERVICE_ALIAS={

const normSvc=s=>String(s||"").toLowerCase().replace(/[^a-z]/g,"");
function formServicePrice(formName,area){
  const alias=FORM_SERVICE_ALIAS[formName];
  if(alias){ const p=priceFor(alias,area); if(p) return p; }

function lineMatchesForm(lineService,formName){
  const a=normSvc(lineService), b=normSvc(formName), al=normSvc(FORM_SERVICE_ALIAS[formName]||"");

  if(a==="yardspray" && formName==="Pest Control Service General") return true;  // legacy naming
  return false;

/* one place that writes the line items, so the money, the header and the
   compliance list can never drift apart */
function writeSlotLines(s,lines){
  if(!lines.length) return;
  s.service=lines[0].service; s.price=lines[0].price;
  if(lines.length>1) s.lines=lines; else delete s.lines;
  s.big=lines.some(l=>/treatment|crawlspace|vapor|insulation|waterproof/i.test(l.service));
  const st=sheetState(s);
  st.services=FORM_SERVICES.flat().filter(f=>lines.some(l=>lineMatchesForm(l.service,f)));

function toggleServiceLine(date,tech,tm,formName){

  if(i>=0){

    lines.splice(i,1);

function saveAdjust(date,tech,tm){
  const s=slotAt(date,tech,tm); if(!s)return;
  const c=byIdSafe(s.cid);
  const amt=Math.abs(parseFloat((document.getElementById('adj_amt')||{}).value)||0);

  if(!amt){ toast('How much should come off?'); return; }
  if(!why){ toast('Say why — it goes on the folder'); return; }
  const lines=slotLines(s,propAt(c,s.pid).area);
  const gross=lines.reduce((n,l)=>n+l.price,0);
  if(amt>gross){ toast(`That's more than the ${money(gross)} on the sheet`); return; }
  s.adjust={amount:-amt, reason:why};
  if(!c.missing) c.log.push({who:auditWho(),d:fmtToday(),t:'money',
    txt:`${money(amt)} taken off — ${why}`});
  persist(); closeModal(); toast(`${money(amt)} off`); router();

function clearAdjust(date,tech,tm){
  const s=slotAt(date,tech,tm); if(!s)return;
  const c=byIdSafe(s.cid); const had=s.adjust?Math.abs(s.adjust.amount):0;
  delete s.adjust;
  if(had&&!c.missing) c.log.push({who:auditWho(),d:fmtToday(),t:'money',txt:`Discount of ${money(had)} removed`});

}
const slotAdjust=s=>(s&&s.adjust&&s.adjust.amount)||0;

}

/* ---- the tech and the time live on the BOOKING, so changing them moves the
   job in the book — with the same no-double-booking guard as rescheduling ---- */
function sheetSetTech(date,tech,tm,newTech){
  if(newTech===tech) return;
  const day=SCHED[date]||{};
  if((day[newTech]||{})[tm] && day[newTech][tm].cid){
    toast(`${newTech} already has ${tm}:00 — use “Change or cancel” to move it`); return;
  }
  const s=day[tech][tm];
  (SCHED[date][newTech]=SCHED[date][newTech]||{})[tm]=s;
  delete SCHED[date][tech][tm];
  const c=byIdSafe(s.cid);
  if(!c.missing) c.log.push({who:auditWho(),d:fmtToday(),t:'call',txt:`Given to ${newTech} — ${fmtDayShort(date)} ${tm}:00`});
  persist(); toast(`${newTech}'s job now`);
  location.hash=`render/${s.cid}/${encodeURIComponent(newTech)}/${date}/${tm}`;
}
function openSheetTimeModal(date,tech,tm){

function sheetSetTime(date,techEnc,tm,newTm){
  const tech=decodeURIComponent(techEnc);
  if(newTm===tm){ closeModal(); return; }
  const day=(SCHED[date]||{})[tech]||{};
  if(day[newTm]&&day[newTm].cid){ toast('That time is taken'); return; }

}

/* per-visit compliance state lives on the booking, so a filed sheet keeps what
   was actually done rather than being re-derived later */
const EMPTY_SHEET=()=>({services:[],pests:[],warranty:"",warrantyNote:"",areas:[],method:"",
  materials:{},propDate:"",notes:""});
function sheetState(s){
  if(!s) return EMPTY_SHEET();                 // job moved or removed — don't throw
  if(!s.sheet) s.sheet=EMPTY_SHEET();
  return s.sheet;
}
/* the job may have been moved or cancelled since this sheet was opened */
function slotAt(date,tech,tm){ return (((SCHED[date]||{})[tech])||{})[tm]||null; }
function toggleSheet(date,tech,tm,field,value){
  const s=slotAt(date,tech,tm);
  if(!s){ toast("That appointment has moved — reopen the sheet"); return; }
  const st=sheetState(s);
  if(field==='warranty'){ st.warranty = (st.warranty===value)?"":value; }
  else if(field==='method'){ st.method = (st.method===value)?"":value; }
  else { const arr=st[field]; const i=arr.indexOf(value); if(i>=0)arr.splice(i,1); else arr.push(value); }
  persist(); router();
}
function toggleMaterial(date,tech,tm,name){
  const s=slotAt(date,tech,tm);
  if(!s){ toast("That appointment has moved — reopen the sheet"); return; }
  const st=sheetState(s);
  if(st.materials[name]) delete st.materials[name]; else st.materials[name]={pct:"",amt:""};
  persist(); router();
}
function setMaterialField(date,tech,tm,name,key,val){
  const s=slotAt(date,tech,tm); if(!s)return;
  const st=sheetState(s);
  if(st.materials[name]){ st.materials[name][key]=sanitizeField(val); persist(); }
}
function setSheetField(date,tech,tm,field,val){
  const s=slotAt(date,tech,tm); if(!s)return;
  const st=sheetState(s);
  st[field]=sanitizeField(val); persist();

/* every visit this customer has ever had in the system, newest first — so any
   old render sheet can be pulled back up and reprinted */
function customerVisits(cid){
  const out=[];
  for(const date in SCHED) for(const tech in SCHED[date]) for(const tm in SCHED[date][tech]){
    const s=SCHED[date][tech][tm];
    if(s.cid===cid) out.push({date,tech,tm,s});
  }
  return out.sort((a,b)=> b.date.localeCompare(a.date) || tmVal(b.tm)-tmVal(a.tm));
}
function visitStatus(s){
  if(s.cancelled) return {t:s.notHome?'nobody home':'cancelled', tone:'plain'};
  if(s.refunded)  return {t:'refunded', tone:'plain'};
  if(s.pay&&s.pay.run) return {t:'paid · '+s.pay.method, tone:'good'};
  if(s.pay&&s.pay.method==='To Be Mailed') return {t:'to be mailed', tone:'warn'};
  if(s.done) return {t:s.pay?escapeHtml(s.pay.method)+' — not collected':'done, unpaid', tone:'warn'};
  if(s.rained) return {t:'rained out', tone:'warn'};
  if(s.st&&s.st.w) return {t:'sheet written', tone:'plain'};
  return {t:'booked', tone:'plain'};
}
function findBookingFor(cid){
  for(const date of Object.keys(SCHED).sort().reverse())
    for(const tech in SCHED[date]) for(const tm in SCHED[date][tech])
      if(SCHED[date][tech][tm].cid===cid) return {date,tech,tm,slot:SCHED[date][tech][tm]};
  return null;
}
function slotLines(slot,area){
  if(slot&&slot.lines&&slot.lines.length) return slot.lines;
  if(slot) return [{service:slot.service, price:slot.price}];
  const svc="General pest service"; return [{service:svc, price:priceFor(svc,area)}];
}
/* a visit's money and description — honors multi-line sheets everywhere */
const slotGross=s=>(s.lines&&s.lines.length)?s.lines.reduce((a,l)=>a+l.price,0):s.price;
/* the total is what they actually owe — gross less any discount, so the cork
   board, the daily close and the folder all agree with the sheet */
function slotTotal(s){ return Math.max(0, slotGross(s)+slotAdjust(s)); }
/* what was collected vs what's owed now — a discount after payment means a refund */
function slotOverpaid(s){
  if(!(s.pay&&s.pay.run)) return 0;
  const paid=(s.pay.amount!=null?s.pay.amount:slotGross(s));
  return Math.max(0, paid-slotTotal(s));
}
/* the tax rate is SNAPSHOTTED on the visit when it's booked — changing the
   rate in Settings must never rewrite what an old job owed or was billed */
function slotTaxRate(s){ return (s&&s.taxRate!=null)?s.taxRate:TAX_RATE; }
function slotWithTax(s){ return slotTotal(s)*(1+slotTaxRate(s)); }
function slotDesc(s){ return (s.lines&&s.lines.length>1)?`${s.lines[0].service} +${s.lines.length-1} more`:s.service; }
/* the AREA is where they actually live, so the city follows the area code;
   the paper form pre-prints "Toms River" and crosses it out when different */
function sheetCity(c){
  const a=areaOf(c.area);
  if(c.area==='Man') return 'Manchester';
  if(c.area==='Brick') return 'Brick';
  if(c.area==='FR') return 'Forked River';
  if(a.unknown&&c.area) return c.area;      // free-text from the old list
  return 'Toms River';
}

 "Exterior siding","Window well covers","Wood pile","Snow","Unsafe conditions","Rigid foam board",
 "Synthetic stucco","Duct work, wiring, and/or plumbing","Spray foam insulation","Equipment"];
const WDI_AREAS=["Basement","Crawlspace","Main Level","Attic","Garage","Exterior","Porch","Addition","Other"];
function wdiState(s){
  if(!s.wdi) s.wdi={inspDate:TODAY_ISO, structures:"", finding:"", live:"", dead:"", damage:"",
    rec:"", recNone:"", recAction:"", obstr:{}, comments:"", attachments:""};
  return s.wdi;
}
function wdiSet(date,tech,tm,field,val){
  const s=slotAt(date,tech,tm); if(!s)return;
  const w=wdiState(s);
  if(field==='finding'||field==='rec'){ w[field]=(w[field]===val)?"":val; }
  else w[field]=sanitizeField(val);
  persist(); router();
}
function wdiToggleArea(date,tech,tm,area){
  const s=slotAt(date,tech,tm); if(!s)return;
  const w=wdiState(s);
  if(w.obstr[area]) delete w.obstr[area]; else w.obstr[area]="";
  persist(); router();
}
function wdiSetArea(date,tech,tm,area,val){
  const s=slotAt(date,tech,tm); if(!s)return;
  const w=wdiState(s);
  if(area in w.obstr){ w.obstr[area]=sanitizeField(val); persist(); }
}
const wdiExpiry=w=>w&&w.inspDate?iso(addDays(parseISO(w.inspDate),90)):null;
const wdiDaysLeft=w=>{const e=wdiExpiry(w); return e?Math.round((parseISO(e)-TODAY)/86400000):null;};
/* every WDI report in the book */
function allWDI(){
  const out=[];
  for(const date in SCHED) for(const tech in SCHED[date]) for(const tm in SCHED[date][tech]){
    const s=SCHED[date][tech][tm];
    if(s.wdi) out.push({date,tech,tm,s,c:byIdSafe(s.cid),w:s.wdi});
  }
  return out.sort((a,b)=>(b.w.inspDate||'').localeCompare(a.w.inspDate||''));
}

        :`<span class="pill">valid ${d} days</span>`}
    </div>`;};
  main.innerHTML="";

  </div>`));

/* ---------------- THE DAY'S SHEETS, ALL AT ONCE ----------------
   "Write up daily render sheets" is the job — so print the whole stack.
   Reuses the single-sheet renderer rather than duplicating the legal form:
   render it, lift the sheet out, put the screen back. */
function renderSheetHTML(c,ctx){
  /* an orphaned job (customer missing after a mismatched restore) must render
     a placeholder — viewRender would redirect the whole screen */
  if(!byId(c.id)) return `<div class="card pad" style="border-left:4px solid var(--warn)">Sheet skipped — this job's customer isn't in the list (see Data).</div>`;
  const saved=main.innerHTML;
  let html="";
  try{ viewRender(c.id,ctx); const rs=main.querySelector('.rs'); html=rs?rs.outerHTML:""; }
  catch(e){ html=`<div class="card pad">Couldn't build the sheet for ${escapeHtml(c.name)}.</div>`; }
  main.innerHTML=saved;
  return html;
}
function daySlots(date){
  const day=SCHED[date]||{}; const out=[];
  TECHS.forEach(tech=>Object.keys(day[tech]||{}).forEach(tm=>{
    const s=day[tech][tm]; if(s.cid&&!s.cancelled) out.push({tech,tm,s});
  }));
  return out.sort((a,b)=>TECHS.indexOf(a.tech)-TECHS.indexOf(b.tech)||tmVal(a.tm)-tmVal(b.tm));
}
function viewDaySheets(dateArg){
  const date=(dateArg&&/^\d{4}-\d{2}-\d{2}$/.test(dateArg))?dateArg:TODAY_ISO;
  const slots=daySlots(date);
  main.innerHTML="";
  main.appendChild(el(`<div>
    <div class="row noprint" style="justify-content:space-between;margin-bottom:.7rem">
      <div>
        <h2 class="screen-title" style="margin:0">The day's render sheets</h2>
        <p class="sub" style="margin:.1rem 0 0">${fmtDayLong(date)} · ${slots.length} sheet${slots.length===1?'':'s'}, one per page, ready to go out with the trucks.</p>
      </div>
      <div class="row">
        <button class="btn ghost mini" onclick="location.hash='daysheets/${iso(addDays(parseISO(date),-1))}'">‹ ${fmtDayShort(iso(addDays(parseISO(date),-1)))}</button>
        <button class="btn ghost mini" onclick="location.hash='daysheets/${iso(addDays(parseISO(date),1))}'">${fmtDayShort(iso(addDays(parseISO(date),1)))} ›</button>
        <button class="btn" onclick="markAllWritten('${date}');window.print()">🖨 Print all ${slots.length}</button>
      </div>
    </div>
    ${slots.length===0?'<div class="banner noprint">Nothing booked for this day.</div>':''}
    ${slots.map(x=>`<div class="daysheet">${renderSheetHTML(byIdSafe(x.s.cid),{date,tech:x.tech,tm:x.tm,slot:x.s})}</div>`).join("")}
  </div>`));
}
function markAllWritten(date){
  daySlots(date).forEach(x=>{ if(x.s.st&&!x.s.st.w) x.s.st.w=true; });
  persist();
}

   Transcribed from the real form (photographed Aug 2026). One sheet does three

const EVAL_ROWS=["Foundation Vents","Floor Insulation","Pipe Insulation","Side Wall Insulation",

  "Air Leaks","Vapor Barrier","Damp Rot","Moisture","Odor","Water Seepage","Dehumidifier",
  "Outside Relative Humidity","Outside Temperature","Outside Dew Point",
  "Inside Relative Humidity","Inside Temperature","Inside Dew Point","Wood Moisture Content"];

function evalState(l){
  if(!l.eval) l.eval={mode:"Evaluation", date:TODAY_ISO, warrantyYears:"",
    billing:{name:"",addr:"",city:"",state:"NJ",zip:"",phone:"",email:""},
    services:{}, rows:{}, sig:"", signedOn:""};
  return l.eval;
}
function evalSet(id,field,val){
  const l=LEADS.find(x=>x.id===id); if(!l)return;
  const e=evalState(l);
  if(field==='mode') e.mode=val; else e[field]=sanitizeField(val);

function evalSetBilling(id,field,val){
  const l=LEADS.find(x=>x.id===id); if(!l)return;

function evalToggleService(id,name){
  const l=LEADS.find(x=>x.id===id); if(!l)return;
  const e=evalState(l), c=byIdSafe(l.cid);

function evalSetPrice(id,name,val){
  const l=LEADS.find(x=>x.id===id); if(!l)return;

let EVAL_SIG=null;
function initEvalSig(){
  const cv=document.getElementById('evalsig'); if(!cv)return; EVAL_SIG=cv;
  const ctx=cv.getContext('2d'); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.strokeStyle='#1c2321';
  let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();const p=(e.touches&&e.touches[0])||e;
    return {x:(p.clientX-r.left)*(cv.width/r.width), y:(p.clientY-r.top)*(cv.height/r.height)};};
  const start=e=>{drawing=true;last=pos(e);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault();};
  const end=()=>{drawing=false;};
  cv.onmousedown=start; cv.onmousemove=move; window.addEventListener('mouseup',end);
  cv.ontouchstart=start; cv.ontouchmove=move; cv.ontouchend=end;
}
function clearEvalSig(){ if(EVAL_SIG){const c=EVAL_SIG.getContext('2d');c.clearRect(0,0,EVAL_SIG.width,EVAL_SIG.height);} }

  persist(); toast('Signed'); router();
}

/* ---------------- DASHBOARD ("This Month") ---------------- */
/* the cork board — DERIVED, never hand-pinned. A completed job that isn't
   paid (or is "To Be Mailed") is on the board; recording payment removes it. */
function ticketStatus(s){
  if(!s.pay) return "unpaid — sheet returned";
  if(s.pay.reversedReason) return s.pay.reversedReason;
  if(s.pay.method==="To Be Mailed") return "To Be Mailed";
  return (s.pay.method||"payment")+" — not recorded";
}
function corkBoard(){
  const out=[];
  for(const date in SCHED) for(const tech in SCHED[date]) for(const tm in SCHED[date][tech]){
    const s=SCHED[date][tech][tm];
    if(s.cid && s.done && !s.cancelled && !s.refunded && (!s.pay || !s.pay.run))
      out.push({cid:s.cid, service:slotDesc(s), price:slotTotal(s), withTax:slotWithTax(s), date, tech, tm, status:ticketStatus(s), days:daysSince(date), resent:s.resent});
  }
  return out.sort((a,b)=> b.days-a.days);   // oldest first
}
/* dunning is a RECORDED action, not just a toast — it lands on the folder timeline */
function resendTicket(date,tech,tm){
  const s=SCHED[date][tech][tm]; const c=byId(s.cid);
  s.resent=TODAY_ISO;
  c.log.push({who:auditWho(),d:fmtToday(),t:'money',txt:`Render sheet re-sent (owes ${money(slotWithTax(s))})`});
  persist();
  toast(`Noted on ${c.name}'s folder — here's the sheet to print and mail`);
  // dunning IS re-mailing the sheet — so end with the sheet, ready to print
  location.hash=`render/${c.id}/${tech}/${date}/${tm}`;
}
function viewDashboard(){
  /* per PROPERTY, exactly like the Calling screen — the two must never disagree */
  const dueProps=propsDue(THIS_MONTH);
  const remaining=dueProps.filter(x=>!x.c.recall && !isCalled(callKey(x.c.id,x.p.pid))).length;
  const box={length:dueProps.length};
  // capacity: 2 techs x 10 slots x ~21 days ~= 420
  const booked = Object.values(SCHED).reduce((n,day)=>n+Object.values(day).reduce((m,t)=>m+Object.values(t).filter(s=>s.cid).length,0),0);
  const capacity=420, util=Math.min(100,Math.round(booked/capacity*100));
  /* per PROPERTY, same counting as the Warranties screen and the menu badge */
  const warrExp=[]; CUST.forEach(c=>propList(c).forEach(p=>{if(p.star&&p.warrantyExp&&p.warrantyExp<=THIS_YEAR)warrExp.push({c,p});}));
  const preTotal=CUST.filter(c=>c.preSched).length;
  const preDone=CUST.filter(c=>c.preSched&&PRESCHED_SENT[c.id]).length;
  const cork=corkBoard();
  const arTotal=cork.reduce((s,t)=>s+t.withTax,0);
  const close=scanDay(TODAY_ISO);
  const followups=LEADS.filter(leadNeedsFollowup);
  const wonToSchedule=LEADS.filter(l=>l.status==="Won"&&!l.scheduled);
  const attention=[];
  if(close.atRisk>0) attention.push([`${money(close.atRisk)} of completed work has no payment recorded`,"close","var(--warn)"]);

/* ---------------- PRE-SCHEDULE GENERATOR (the flagship automation) ----------------
   Rule engine: nth weekday of month, May–September, for the coming year.
   Validated in the brief against 2 real 2026 letters (9/10 dates, money to the cent).
*/
const WD_NAME=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function nthWeekday(year,month/*1-12*/,wd/*0-6*/,nth){
  const firstDow=new Date(year,month-1,1).getDay();
  const day=1+((wd-firstDow+7)%7)+(nth-1)*7;
  return new Date(year,month-1,day);
}
// observed-holiday collisions for a given year
function holidayHit(date){
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  // Memorial Day = last Monday of May
  if(m===5){ const last=nthWeekday(y,5,1,5); const memorial = last.getMonth()===4?last:nthWeekday(y,5,1,4);
    if(date.getDate()===memorial.getDate()) return "Memorial Day"; }
  // Labor Day = first Monday of September
  if(m===9 && date.getDate()===nthWeekday(y,9,1,1).getDate()) return "Labor Day";
  // July 4th observed
  if(m===7){ const j4=new Date(y,6,4); const dow=j4.getDay();
    let obs=4; if(dow===6)obs=3; else if(dow===0)obs=5;
    if(d===obs) return "July 4th (observed)"; }
  // Thanksgiving = 4th Thursday of November (the brief lists it among the four observed)
  if(m===11 && d===nthWeekday(y,11,4,4).getDate()) return "Thanksgiving";
  return null;
}
/* a bundled extra may run every OTHER year (the brief: dryer vent cleaning) */
function extraFor(c,m,year){
  const e=c.extras&&c.extras[m]; if(!e) return null;
  if(typeof e==='string') return {label:e, price:SETTINGS.extraPrice};      // original seed format
  if(e.everyOther && Math.abs(year-(e.baseYear||year))%2!==0) return null;  // off year
  return {label:e.label, price:(e.price!=null?e.price:SETTINGS.extraPrice)};
}
function generateYear(c, year){
  const months=[5,6,7,8,9];
  return months.map(m=>{
    const key=`${year}-${m}`;
    let dt, nth=c.nth, exception=false, manual=false;
    if(c.overrides && c.overrides[key]){ dt=parseISO(c.overrides[key]); manual=true; }
    else {
      if(m===8 && c.augPullEarly){ nth=c.nth-1; exception=true; }   // Rocca's known pull-early
      dt=nthWeekday(year,m,c.wd,nth);
    }
    const hol=holidayHit(dt);
    const ex=extraFor(c,m,year);
    return {month:m, date:dt, nth, hol, exception, manual,
      extra:ex?ex.label:null, extraPrice:ex?ex.price:0};
  });
}
/* what a year costs — 5 sprays plus whichever extras fall in that year */
function preschedMoney(c,year){
  const yr=generateYear(c,year);
  const sprays=(c.base!=null?c.base:SETTINGS.preschedBase)*5;
  const extras=yr.reduce((s,x)=>s+x.extraPrice,0);
  const sub=sprays+extras, tax=sub*TAX_RATE;
  return {yr, sprays, extras, sub, tax, total:sub+tax};
}

/* ---------------- DAILY CLOSE / RECONCILIATION ----------------
   The dealership-style report United has never had. Completed work vs
   payments recorded — flags any job whose card was never run.
   (a completed job whose card never gets run is money simply lost.)
*/
function scanDay(date){
  const day=SCHED[date]||{}; const done=[],out=[],flags=[];
  for(const tech of Object.keys(day)){
    for(const tm of Object.keys(day[tech])){
      const s=day[tech][tm]; if(!s.cid||s.cancelled) continue;
      const rec={tech,tm,s,c:byIdSafe(s.cid)};
      if(s.done){ done.push(rec); if(!s.pay||!s.pay.run) flags.push(rec); }
      else if(s.st&&s.st.w){ out.push(rec); }   // sheet written & in the field, not back yet
    }
  }
  const completed=done.reduce((n,r)=>n+slotTotal(r.s),0);
  const recorded=done.filter(r=>r.s.pay&&r.s.pay.run).reduce((n,r)=>n+slotTotal(r.s),0);
  return {done,out,flags,completed,recorded,atRisk:completed-recorded};
}

function saveFixedCheck(date,tech,tm){

function payMethodChanged(){
  const m=(document.getElementById('paymethod')||{}).value;

function savePayment(date,tech,tm){
  const s=SCHED[date][tech][tm], c=byIdSafe(s.cid);
  const method=document.getElementById('paymethod').value;
  const checkEl=document.getElementById('checkno');
  const checkNo=checkEl?checkEl.value.trim():"";
  if(method==='Check' && !checkNo){ toast('Enter the check number'); return; }
  const label = (method==='Check') ? ('check #'+checkNo) : method;
  const mailed = (method==='To Be Mailed');
  const cardRun = isCardMethod(method) ? !!(document.getElementById('cardrun')||{}).checked : false;
  /* money is only IN when it's really in: cash/check in hand, or a card
     actually run. A card written on the sheet is not collected money. */
  if(s.taxRate==null) s.taxRate=TAX_RATE;   // lock the rate when the money is committed
  const collected = mailed ? false : (isCardMethod(method) ? cardRun : true);
  s.pay={method:label, amount:slotTotal(s), run:collected, checkNo:(method==='Check'?checkNo:null),
         card:isCardMethod(method)?method:null};
  s.st.ret=collected; s.done=true;
  if(c.isNew && collected) delete c.isNew;   // first money in — no longer "new" on later sheets
  if(!s.logged) logServiceDone(s,c,tm);
  else if(collected && !c.missing)           // the job line exists — record the money finally landing
    c.log.push({who:auditWho(),d:fmtToday(),t:'money',txt:`Payment received — ${label} (${money(slotWithTax(s))})`});
  persist(); closeModal();
  toast(collected ? `${c.name}: recorded ${label}`
    : mailed ? `${c.name}: marked To Be Mailed — stays on the cork board`
    : `${c.name}: ${label} noted — the card still needs running`);
  router();
}

function logServiceDone(s,c,tm){
  if(!c||c.missing||s.logged) return;
  const svc=slotLines(s,c.area).map(l=>l.service).join(" + ");
  const how=s.pay?(s.pay.run?s.pay.method:s.pay.method+" — not collected yet"):"unpaid";
  c.log.push({who:auditWho(),d:fmtToday(),t:'job',txt:`${tm}:00 ${svc} ${money(slotTotal(s))} — ${how}`});
  s.logged=true;
}
/* find every recorded payment for a customer, across all days (so you can
   reverse one weeks later without remembering which day it was) */
function findPayments(cid){
  const out=[];
  for(const date in SCHED) for(const tech in SCHED[date]) for(const tm in SCHED[date][tech]){
    const s=SCHED[date][tech][tm];
    /* include work that's DONE but never paid — "what do they owe me?" is the
       question she opens a folder to answer */
    if(s.cid===cid && (s.pay||s.done)) out.push({date,tech,tm,s});
  }
  return out;
}

function reversePayment(date,tech,tm,reason){
  const s=SCHED[date][tech][tm], c=byIdSafe(s.cid);
  const owesAgain=/bounce|chargeback/i.test(reason);
  const accidental=/accidental/i.test(reason);
  const refunded=/refund/i.test(reason);
  if(s.pay){ s.pay.run=false; s.pay.reversedReason = owesAgain?reason:null; }
  if(refunded) s.refunded=true;      // money went back on purpose — they do NOT owe again
  if(s.st) s.st.ret=false;
  const when=fmtToday();
  PAYMENT_LOG.unshift({who:auditWho(),when,cid:c.id,name:c.name,amount:slotTotal(s),service:slotDesc(s),reason});
  // the job is now done-but-unpaid → it returns to the cork board automatically
  if(owesAgain){
    c.log.push({d:when,t:'money',txt:`Payment reversed — ${reason} — owes ${money(slotWithTax(s))} again`});
  } else if(!accidental){
    c.log.push({d:when,t:'money',txt:`Payment marked unpaid — ${reason}`});
  }
  persist(); closeModal();
  toast(`${c.name}: marked unpaid${accidental?' (correction)':' — '+reason}`);
  router();  // refresh whichever screen we're on
}

function quoteSearch(q){
  q=(q||"").toLowerCase();
  const box=document.getElementById('q_results'); if(!box)return;
  if(!q){box.innerHTML="";return;}
  const list=CUST.filter(c=>(c.name+" "+c.addr).toLowerCase().includes(q)).slice(0,8);
  box.innerHTML=list.map(c=>`<div class="queue-item" style="cursor:pointer" onclick="QUOTE_EDIT.cid=${c.id};openQuoteModal(${c.id}${QUOTE_EDIT.id?','+QUOTE_EDIT.id:''})">

function saveQuote(){
  const Q=QUOTE_EDIT; if(!Q||!Q.cid){ toast('Pick a customer first'); return; }
  const c=byId(Q.cid); if(!c)return;
  const type=(document.getElementById('q_type')||{}).value||'Estimate';
  const amt=parseFloat((document.getElementById('q_amt')||{}).value)||0;
  const desc=sanitizeField((document.getElementById('q_desc')||{}).value);
  const note=sanitizeField((document.getElementById('q_note')||{}).value);
  if(!desc){ toast('Say what the quote is for'); return; }
  if(Q.id){
    const l=LEADS.find(x=>x.id===Q.id); if(l) Object.assign(l,{type,amount:amt,desc,note});
    toast('Quote updated');
  } else {
    const nid=Math.max(100,...LEADS.map(l=>l.id))+1;
    LEADS.unshift({id:nid, cid:c.id, type, desc, amount:amt, status:"Sent", sentISO:TODAY_ISO, note});
    c.log.push({who:auditWho(),d:fmtToday(),t:'quote',txt:`${type} quoted ${money(amt)} — ${desc}`});
    toast(`Quote added for ${c.name}`);
  }
  QUOTE_EDIT=null; persist(); closeModal(); updateBadges(); location.hash='leads'; router();
}
function deleteQuote(id){
  const l=LEADS.find(x=>x.id===id); if(!l)return;
  LEADS=LEADS.filter(x=>x.id!==id);
  persist(); closeModal(); updateBadges(); toast('Quote deleted'); location.hash='leads'; router();
}
function setLeadStatus(id,status){
  const l=LEADS.find(x=>x.id===id); if(!l)return; const c=byId(l.cid);
  l.status=status;
  if(status==="Thinking"){ l.sentISO=TODAY_ISO; l.note="Followed up "+fmtToday()+" — still deciding."; }
  if(status==="Won"){ c.log.push({who:auditWho(),d:fmtToday(),t:'quote',txt:`${l.type} SOLD — ${money(l.amount)} (${l.desc})`}); }
  if(status==="Lost"){ c.log.push({who:auditWho(),d:fmtToday(),t:'call',txt:`${l.type} lost — ${l.desc}`}); }
  persist(); updateBadges();
  toast(`${c.name}: ${l.type.toLowerCase()} → ${status}`);
  viewLeads();
}

function recordRetreat(id,pid){
  const c=byId(id); if(!c)return;

function custDueSummary(c){
  const bits=[];
  if(c.star&&c.warrantyExp&&c.warrantyExp<=THIS_YEAR) bits.push("⚠ warranty due");
  else if(c.warrantyExp) bits.push("warr→"+c.warrantyExp);
  bits.push(c.month?("box "+MONTHS[c.month-1]):"box not set");
  return bits.join(" · ");
}
function runGlobalSearch(q){
  const box=document.getElementById("gresults"); if(!box)return;
  q=(q||"").trim().toLowerCase();
  if(!q){ box.classList.remove("show"); box.innerHTML=""; return; }
  const qDigits=/^[\d\s()+.-]+$/.test(q)?q.replace(/\D/g,""):null;   // caller-ID digits work too
  const matches=CUST.filter(c=>
    (qDigits && qDigits.length>=3 && (c.phone||"").replace(/\D/g,"").includes(qDigits)) ||
    (c.name+" "+(c.first||"")+" "+c.addr+" "+c.area+" "+((AREAS[c.area]||{}).name||"")+" "+c.phone).toLowerCase().includes(q)
  ).slice(0,7);
  box.innerHTML = matches.length ? matches.map(c=>`<div class="gres-item" onmousedown="openFromSearch(${c.id})">
      <span class="dot" style="background:${areaOf(c.area).dot}"></span>
      <div style="flex:1"><div class="nm">${c.name} ${c.star?'<span class="star">★</span>':''} <span class="meta">· ${c.area}</span></div>
        <div class="meta">${c.addr} · ${c.phone}</div></div>
      <div class="meta" style="text-align:right;white-space:nowrap">${custDueSummary(c)}</div>
    </div>`).join("") : `<div class="gres-empty">No customer matches “${escapeHtml(q)}”.
      <button class="btn mini" style="display:block;margin-top:.45rem" onmousedown="newCustomerFromSearch()">＋ Add as a new customer</button></div>`;
  box.classList.add("show");
}

let _sig=null;
function initSigPad(){
  const cv=document.getElementById('sigpad'); if(!cv)return; _sig=cv;
  const ctx=cv.getContext('2d'); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.strokeStyle='#1c2321';
  let drawing=false,last=null;
  const pos=e=>{const r=cv.getBoundingClientRect();const p=(e.touches&&e.touches[0])||e;
    return {x:(p.clientX-r.left)*(cv.width/r.width), y:(p.clientY-r.top)*(cv.height/r.height)};};
  const start=e=>{drawing=true;last=pos(e);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault();};
  const end=()=>{drawing=false;};
  cv.onmousedown=start; cv.onmousemove=move; window.addEventListener('mouseup',end);
  cv.ontouchstart=start; cv.ontouchmove=move; cv.ontouchend=end;
}
function clearSig(){ if(_sig){const c=_sig.getContext('2d');c.clearRect(0,0,_sig.width,_sig.height);} }
function saveSig(tech,tm){ const s=SCHED[TODAY_ISO][tech][tm];
  if(_sig){ try{ s.sig=_sig.toDataURL('image/png'); }catch(e){} }   // keep the actual signature — it's the consent record

/* Strip only the characters that would break markup. "&" is KEPT — her list's
   FIRST column is "Mr. & Mrs." on most records; escaping happens at render. */
function sanitizeField(v){ return String(v==null?"":v).replace(/[<>]/g,"").trim(); }

function parseCSV(text){
  const rows=[]; let row=[], cell="", inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else inQ=false; }
      else cell+=ch;
    } else {
      if(ch==='"' && cell==="") inQ=true;              // opening quote only at cell start
      else if(ch==='"') cell+=ch;                       // naked quote mid-cell (FT"15) is literal
      else if(ch===','){ row.push(cell); cell=""; }
      else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n')i++;
        row.push(cell); cell="";
        if(row.some(c=>c.trim()!=="")) rows.push(row);
        row=[]; }
      else cell+=ch;
    }
  }
  row.push(cell); if(row.some(c=>c.trim()!=="")) rows.push(row);
  return rows;
}

/* free-text AREA -> our codes; anything unmapped keeps its raw text for review */
const AREA_ALIASES={
  "HH":"HH","HOLIDAY HEIGHTS":"HH",
  "HCS":"HCS","HC8":"HCS","HOLIDAY CITY SOUTH":"HCS",
  "HCW":"HCW","HOLIDAY CITY WEST":"HCW",
  "HCC":"HCC","HOLIDAY CITY CAREFREE":"HCC","CAREFREE":"HCC",
  "HCB":"HCB","HOLIDAY CITY BERKELEY":"HCB","BERKELEY":"HCB",
  "SRPN":"SRPN","SILVER RIDGE PARK NORTH":"SRPN",
  "SRPW":"SRPW","SILVER RIDGE PARK WEST":"SRPW",
  "SRPE":"SRPE","SILVER RIDGE PARK EAST":"SRPE",
  "WESTERLY":"Westerly","SILVER RIDGE PARK WESTERLY":"Westerly",
  "SIL":"Sil","SILVERTON":"Sil",
  "MAN":"Man","MANCHESTER":"Man",
  "BRICK":"Brick","BRICKTOWN":"Brick",
  "FR":"FR","FORKED RIVER":"FR",
  "TR":"TR","TOMS RIVER":"TR",
};
function normalizeArea(raw){
  const k=sanitizeField(raw).toUpperCase().replace(/[^A-Z0-9 ]/g,"").trim();
  if(!k) return {code:"", review:true};
  if(AREA_ALIASES[k]) return {code:AREA_ALIASES[k], review:false};
  return {code:sanitizeField(raw), review:true};   // unmapped — keep raw text, flag it
}
/* parse FT warranty codes out of the freeform SERVICE column, e.g. FT"13 5y 2003 */
function parseServiceField(svc){
  const out={star:false, ft:"", warrantyExp:null, note:sanitizeField(svc)};
  const m=/FT\s*["”]?\s*(\d{2})(?:\s*(\d+)\s*y(?:rs?|ears?)?)?/i.exec(svc||"");
  if(m){
    out.star=true;
    const yy=+m[1], term=m[2]?+m[2]:null;
    const year=yy>50?1900+yy:2000+yy;
    out.ft=`FT" ${String(yy).padStart(2,'0')}${term?` ${term} yr${term>1?'s':''}`:''}`;
    if(term) out.warrantyExp=year+term;
  }
  return out;
}
function importMyMailList(text){
  const rows=parseCSV(text);
  if(!rows.length) return {error:"The file looks empty."};
  // header row: find the LAST column by name
  const hdr=rows[0].map(h=>sanitizeField(h).toUpperCase());
  const col=name=>hdr.findIndex(h=>h===name||h.startsWith(name));
  const iLast=col("LAST"), iFirst=col("FIRST"), iNum=col("#"), iAddr=col("ADDRESS"),
        iCity=col("CITY"), iZip=col("ZIP"), iPhone=col("TELEPHONE"),
        iMonth=col("MONTH"), iSvc=col("SERVICE"), iArea=col("AREA"), iEmail=col("EMAIL");
  if(iLast<0) return {error:"Could not find a LAST column in the header row."};
  const customers=[], skipped=[], review=[];
  let nextId=1;
  for(let r=1;r<rows.length;r++){
    const g=i=>i>=0?sanitizeField(rows[r][i]):"";
    const last=g(iLast), monthRaw=g(iMonth);
    if(!last || last.toUpperCase()==="AAA"){ skipped.push({row:r+1, why:"blank / placeholder row"}); continue; }
    if(/z{2,}/i.test(monthRaw)){ skipped.push({row:r+1, why:`"${last}" — vendor/reference (zzzz month)`}); continue; }
    const month=parseInt(monthRaw,10);
    const area=normalizeArea(g(iArea));
    const svc=parseServiceField(iSvc>=0?rows[r][iSvc]:"");
    const addr=[g(iNum),g(iAddr)].filter(Boolean).join(" ");
    const cust={
      id:nextId++, name:last, first:g(iFirst), addr:addr||"(no street address)",
      area:area.code, month:(month>=1&&month<=12)?month:0,
      phone:g(iPhone), email:g(iEmail)||undefined,
      star:svc.star, ft:svc.ft, warrantyExp:svc.warrantyExp||undefined,

function applyImport(){
  if(!PENDING_IMPORT)return;
  /* the pre-scheduled program is hand-built and must survive an import —
     carry each member's slot, price and add-ons across by name + street */
  const norm=s=>String(s||"").toLowerCase().replace(/\s+/g,' ').trim();
  const carry={};
  CUST.filter(c=>c.preSched).forEach(c=>{
    carry[norm(c.name)+'|'+norm(c.addr)]={preSched:true, nth:c.nth, wd:c.wd, base:c.base,
      extras:c.extras, overrides:c.overrides, slot:c.slot, augPullEarly:c.augPullEarly};
  });
  let carried=0;
  CUST=PENDING_IMPORT.customers.map(c=>{
    const k=norm(c.name)+'|'+norm(c.addr);
    if(carry[k]){ carried++; return Object.assign(c,carry[k]); }
    return c;
  });
  SCHED={}; LEADS=[]; CALLED={}; PRESCHED_SENT={}; PAYMENT_LOG=[];
  PENDING_IMPORT=null;
  persist(); closeModal(); updateBadges();
  const lost=Object.keys(carry).length-carried;
  toast(`Imported ${CUST.length} customers${carried?` · ${carried} kept on the program`:''}${lost>0?` · ${lost} program member${lost>1?'s':''} not matched — check Pre-Schedule`:''}`);
  location.hash='customers'; router();
}

function validateBackup(s){
  if(!s||typeof s!=="object") return "That file isn't a United Termite backup.";
  if(!Array.isArray(s.CUST)) return "That file has no customer list in it.";
  if(s.CUST.some(c=>!c||typeof c!=="object"||c.id==null||typeof c.name!=="string"))
    return "That backup's customer records look damaged — not restoring.";
  if(s.SCHED&&typeof s.SCHED!=="object") return "That backup's schedule looks damaged — not restoring.";
  if(s.LEADS&&!Array.isArray(s.LEADS)) return "That backup's quotes look damaged — not restoring.";
  return null;
}
function doRestore(){
  const s=PENDING_RESTORE; if(!s){ closeModal(); return; }
  CUST=s.CUST.map(c=>Object.assign({},c,{log:Array.isArray(c.log)?c.log:[]}));
  SCHED=(s.SCHED&&typeof s.SCHED==="object")?s.SCHED:{};
  LEADS=Array.isArray(s.LEADS)?s.LEADS:[];
  if(s.templates&&typeof s.templates==="object") TEMPLATES=s.templates;
  if(s.settings&&typeof s.settings==="object"){
    SETTINGS=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),s.settings); applySettings();
  }
  CALLED=(s.called&&typeof s.called==="object"&&!Array.isArray(s.called))?s.called
        :(Array.isArray(s.called)?{[monthKey()]:s.called}:{});   // tolerate the old flat format
  PRESCHED_SENT=s.presched||{}; PAYMENT_LOG=Array.isArray(s.plog)?s.plog:[];
  PENDING_RESTORE=null;
  persist(); closeModal(); updateBadges();
  toast(`Restored — ${CUST.length} customers back on this device`);
  location.hash='home'; router();
}

            <div style="flex:1;font-size:.86rem"><b>${k}</b> <span class="muted" style="font-size:.74rem">${escapeHtml(AREAS[k].name)}</span></div>
            ${custom?`<button class="btn ghost mini" onclick="clearAreaColour('${k}')" title="Back to the original">↺</button>`:''}
          </div>`;}).join("")}
      </div>
      <div class="row" style="margin-top:.8rem">
        <button class="btn ghost mini" onclick="resetColours()">Put all the colours back</button>
      </div>
    </div>

    <div class="row" style="margin-top:1rem"><button class="btn ghost" onclick="resetSettings()">Put settings back to normal…</button></div>
  </div>`));
}

    ${needsReview?`<div class="card pad" style="margin-bottom:1rem;border-left:4px solid var(--gold)">
