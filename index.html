        <div style="flex:1;min-width:9rem"><b>${escapeHtml(c.name)}</b> <span class="muted" style="font-size:.8rem">· ${escapeHtml(c.addr)}</span>
          <div class="muted" style="font-size:.78rem">area ${c.area?`"${escapeHtml(c.area)}" — not a known code`:'blank'} · month ${c.month?MONTHS[c.month-1]:'not set'}</div></div>
        <button class="btn mini" onclick="openEditCustomerModal(${c.id})">Set it right</button>
      </div>`).join("")}
      ${needsReview>40?`<div class="muted" style="font-size:.8rem;margin-top:.4rem">…and ${needsReview-40} more.</div>`:''}
    </div>`:''}

/* ---------------- modal + router ---------------- */
function showModal(html){const m=document.getElementById("modal");
  m.innerHTML='<button class="modal-x" onclick="closeModal()" aria-label="Close">✕</button>'+html;
  document.getElementById("modalbg").classList.add("show");}
function closeModal(){document.getElementById("modalbg").classList.remove("show");}
document.getElementById("modalbg").addEventListener("click",e=>{if(e.target.id==="modalbg")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeMore();}});

/* Nothing may ever leave her looking at a blank page. If a screen fails, say
   so plainly, keep the data safe, and offer a way out. */
function router(){
  try{ routeTo(); }
  catch(e){
    try{
      main.innerHTML="";
      main.appendChild(el(`<div class="card pad" style="border-left:4px solid var(--warn)">
        <div style="font-weight:800;font-size:1.05rem">This screen couldn't open</div>
        <p class="sub" style="margin:.35rem 0 .6rem">Nothing was lost — your information is still saved on this device. Try another screen, or export a backup from Data and send it over so it can be looked at.</p>
        <div class="row">
          <button class="btn" onclick="location.hash='home';router()">Back to This Month</button>
          <button class="btn ghost" onclick="location.hash='data';router()">Go to Data &amp; back up</button>
        </div>
        <details style="margin-top:.7rem"><summary class="muted" style="font-size:.78rem;cursor:pointer">Technical detail</summary>
          <div class="muted" style="font-size:.75rem;font-family:ui-monospace,Consolas,monospace;margin-top:.3rem">${escapeHtml(String(e&&e.message||e))}</div></details>
      </div>`));
    }catch(_){}
  }
}
function routeTo(){
  const h=(location.hash||"#home").slice(1);
  const dec=x=>{ if(x==null)return x; try{return decodeURIComponent(x);}catch(e){return x;} };
  const [route,arg,arg2,arg3,arg4]=h.split("/").map(dec);
  const activeMap={cust:"customers",preletter:"preschedule",preletters:"preschedule",
  warrantyletter:"warranties",wdi:"wdilist",week:"today",month:"today",daysheets:"today",
  eval:"leads"};
  const canonical=activeMap[route]||route;
  closeMore();
  document.querySelectorAll("nav.tabs button[data-route]").forEach(b=>
    b.classList.toggle("active", b.dataset.route===canonical));
  const mb=document.getElementById("morebtn");
  if(mb) mb.classList.toggle("active", !PRIMARY_ROUTES.includes(canonical));
  const act=document.querySelector("nav.tabs button.active");
  if(act&&act.scrollIntoView) act.scrollIntoView({inline:"center",block:"nearest"});
  window.scrollTo(0,0);
  if(route==="home")return viewDashboard();
  if(route==="today")return viewToday(arg);
  if(route==="week")return viewWeek(arg);
  if(route==="month")return viewMonth(arg);
  if(route==="field")return viewField(arg);
  if(route==="calls")return viewCalls();
  if(route==="mailing")return viewMailing(arg);
  if(route==="customers")return viewCustomers();
  if(route==="cust")return viewCustomer(+arg);
  if(route==="render")return viewRender(+arg||null, arg2?{tech:arg2,date:arg3,tm:arg4}:null);
  if(route==="leads")return viewLeads();
  if(route==="close")return viewClose();
  if(route==="preschedule")return viewPreschedule();
  if(route==="preletter")return viewPreletter(+arg);
  if(route==="preletters")return viewPreLetters();
  if(route==="warranties")return viewWarranties();
  if(route==="warrantyletter")return viewWarrantyLetter(+arg);
  if(route==="capacity")return viewCapacity();
  if(route==="daysheets")return viewDaySheets(arg);
  if(route==="eval")return viewEval(arg);
  if(route==="wdilist")return viewWDIList();
  if(route==="wdi")return viewWDI(arg,arg2,arg3,arg4);
  if(route==="business")return viewBusiness();
  if(route==="templates")return viewTemplates();
  if(route==="settings")return viewSettings();
  if(route==="data")return viewData();
  viewDashboard();
}
document.querySelectorAll("nav.tabs button[data-route]").forEach(b=>b.addEventListener("click",()=>location.hash=b.dataset.route));
window.addEventListener("hashchange",router);
(function initSearch(){
  const inp=document.getElementById("gsearch"); if(!inp)return;
  inp.addEventListener("input",e=>runGlobalSearch(e.target.value));
  inp.addEventListener("focus",e=>{ if(e.target.value) runGlobalSearch(e.target.value); });
  inp.addEventListener("blur",()=>setTimeout(()=>{const b=document.getElementById("gresults");if(b)b.classList.remove("show");},150));
})();
/* ---- screen lock ----
   Honest about what this is: it hides the book on a device left sitting (an iPad
   in a truck, a laptop on the kitchen table). It is NOT a sign-in — real
   accounts arrive with hosting. The device's own passcode is the real lock. */
let LOCK_TIMER=null;
function lockApp(){
  const el=document.getElementById('lockscreen'); if(el) el.classList.add('show');
  closeModal(); closeMore();
}
function unlockApp(){
  const el=document.getElementById('lockscreen'); if(el) el.classList.remove('show');
  resetLockTimer();
}
function resetLockTimer(){
  clearTimeout(LOCK_TIMER);
  const mins=parseFloat(SETTINGS.lockMinutes);
  if(!mins||mins<=0) return;                 // 0 turns it off
  LOCK_TIMER=setTimeout(lockApp, mins*60000);
}
["click","keydown","touchstart","mousemove"].forEach(ev=>
  document.addEventListener(ev,()=>{
    const el=document.getElementById('lockscreen');
    if(el&&el.classList.contains('show')) return;   // don't extend while locked
    resetLockTimer();
  },{passive:true}));

/* a laptop or iPad left open overnight must not keep showing yesterday */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible")return;
  if(iso(atMidnight(new Date()))!==TODAY_ISO){
    toast("It's a new day — refreshing"); setTimeout(()=>location.reload(),900);
  }
});
router();
updateBadges();
updateWhoLabel();
resetLockTimer();
</script>
